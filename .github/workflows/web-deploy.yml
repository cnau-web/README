name: Web — déploiement Render

# Déclenche le déploiement de la version web sur Render à chaque modification de web/.
# Secret requis : RENDER_DEPLOY_HOOK (Render → service ondetv → Settings → Deploy Hook).

on:
  push:
    branches: [claude/ios-xtream-player]
    paths: ["web/**", "render.yaml", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Secret RENDER_DEPLOY_HOOK absent : déploiement automatique ignoré."
            exit 0
          fi
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          case "$HOOK" in
            https://api.render.com/deploy/srv-*) ;;
            *)
              # Indice sans fuite : début de la valeur jusqu'au « ? » (la clé secrète est après), 40 caractères max.
              hint="$(printf '%s' "$HOOK" | cut -d'?' -f1 | cut -c1-40)"
              echo "::error::Le secret RENDER_DEPLOY_HOOK ne ressemble pas à un Deploy Hook Render (https://api.render.com/deploy/srv-…). Début enregistré : « ${hint} » (${#HOOK} caractères)."
              exit 1 ;;
          esac
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$HOOK")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "::notice::Déploiement Render lancé."
          else
            # La réponse de Render ne contient pas la clé secrète.
            echo "::error::Render a refusé le déploiement (HTTP $code) : $(head -c 300 response.txt)"
            exit 1
          fi
