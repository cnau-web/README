name: iOS — build OndeTV (.ipa)

on:
  push:
    branches: [claude/ios-xtream-player]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Outils (XcodeGen, CocoaPods)
        run: |
          brew install xcodegen
          which pod || sudo gem install cocoapods
          xcodebuild -version

      - name: Tests XtreamKit
        working-directory: ios/Packages/XtreamKit
        run: swift test

      - name: Génération du projet + pod install
        run: xcodegen generate

      - name: Compilation (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace OndeTV.xcworkspace \
            -scheme OndeTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*OndeTV|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Création de l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OndeTV.app Payload/
          zip -qry OndeTV.ipa Payload
          ls -lh OndeTV.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OndeTV-ipa
          path: ios/OndeTV.ipa
          retention-days: 30

      # Version simulateur : à téléverser sur appetize.io pour tester l'app dans le navigateur.
      - name: Compilation simulateur (Appetize)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace OndeTV.xcworkspace \
            -scheme OndeTV \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-sim.log
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ios/OndeTV-simulateur.zip" OndeTV.app
          ls -lh "$GITHUB_WORKSPACE/ios/OndeTV-simulateur.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OndeTV-simulateur
          path: ios/OndeTV-simulateur.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild*.log
