name: Android TV — construction de l'APK

# Construit l'app Android TV / Fire TV et la publie dans la release « android-latest ».
# Téléchargement sur la TV (app Downloader) : ondetv.onrender.com/tv

on:
  push:
    branches: [claude/ios-xtream-player]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Construire
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Renommer et décrire la version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OndeTV.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: OndeTV Android TV
          body: |
            App OndeTV pour Android TV, Google TV et Fire TV.
            Sur la TV : app « Downloader » → adresse ondetv.onrender.com/tv
          prerelease: false
          make_latest: true
          files: |
            OndeTV.apk
            version.json
          overwrite_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: OndeTV-android-tv
          path: OndeTV.apk
