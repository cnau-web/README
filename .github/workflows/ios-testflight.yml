name: iOS — envoi sur TestFlight

# Compile OndeTV, la signe avec votre compte Apple Developer et l'envoie sur TestFlight.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe (10 caractères, developer.apple.com → Membership)
#   ASC_KEY_ID      ID de la clé API App Store Connect
#   ASC_ISSUER_ID   Issuer ID de la clé API
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
# Variable facultative : BUNDLE_ID (par défaut com.cnau.ondetv)

on:
  push:
    branches: [claude/ios-xtream-player]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.cnau.ondetv' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Vérification des secrets
        id: check
        working-directory: .
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Secrets Apple absents : envoi TestFlight ignoré (voir ios/TESTFLIGHT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Outils et clé API
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          which pod || sudo gem install cocoapods
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Projet (identifiant, équipe)
        if: steps.check.outputs.ready == 'true'
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: app.ondetv.OndeTV/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" project.yml
          xcodegen generate

      - name: Archive signée
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace OndeTV.xcworkspace \
            -scheme OndeTV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OndeTV.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Envoi sur TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OndeTV.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "::notice::Build ${{ github.run_number }} envoyé. Il apparaîtra dans TestFlight après traitement (10 à 30 min)."

      - uses: actions/upload-artifact@v4
        if: failure() && steps.check.outputs.ready == 'true'
        with:
          name: testflight-logs
          path: ios/*.log
