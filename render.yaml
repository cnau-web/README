# Déploiement en un clic de la version web d'OndeTV sur Render (offre gratuite).
services:
  - type: web
    name: ondetv
    runtime: docker
    plan: free
    # Europe : plus proche des serveurs IPTV et des utilisateurs (moins de coupures).
    region: frankfurt
    rootDir: web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PROXY_SECRET
        generateValue: true
      # Synchronisation entre appareils (données chiffrées par l'app).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ondetv-sync
          property: connectionString

  # Stockage de synchronisation (Render Key Value gratuit, accessible seulement depuis le réseau privé).
  - type: keyvalue
    name: ondetv-sync
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
