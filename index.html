 signifie gland en espagnol.\nLes porcs ibériques en mangent en liberté dans les « dehesas » pendant la saison appelée « montanera ».","opts":["Des châtaignes","Des figues","Des glands","Du maïs"]},"es":{"q":"¿De qué se alimentan los cerdos del jamón ibérico de bellota?","a":"De bellotas","w":"Los cerdos ibéricos comen bellotas en libertad en la dehesa.\nEsa temporada de engorde se llama montanera.","opts":["De castañas","De higos","De bellotas","De maíz"]}},{"cat":"cul","level":2,"fr":{"q":"À Cannes on remet la Palme d'or. Quelle est la récompense suprême du festival de Saint-Sébastien ?","a":"La Coquille d'or","w":"Le festival de Saint-Sébastien remet la « Concha de Oro ».\nElle fait référence à la baie de La Concha, symbole de la ville.","opts":["La Coquille d'or","Le Lion d'or","L'Ours d'or","Le Goya d'or"]},"es":{"q":"En Cannes se entrega la Palma de Oro. ¿Cuál es el máximo premio del Festival de San Sebastián?","a":"La Concha de Oro","w":"El Festival de San Sebastián entrega la Concha de Oro.\nEl nombre alude a la bahía de La Concha, símbolo de la ciudad.","opts":["La Concha de Oro","El León de Oro","El Oso de Oro","El Goya de Oro"]}},{"cat":"cul","level":2,"fr":{"q":"Comment s'appelle le cheval de Don Quichotte ?","a":"Rossinante","w":"Rossinante est la monture maigre et fidèle de Don Quichotte.\nLe Grison est l'âne de Sancho Pança, et Babieca le cheval du Cid.","opts":["Rossinante","Babieca","Bucéphale","Le Grison"]},"es":{"q":"¿Cómo se llama el caballo de Don Quijote?","a":"Rocinante","w":"Rocinante es el flaco y fiel caballo de don Quijote.\nRucio es el asno de Sancho Panza y Babieca el caballo del Cid.","opts":["Rocinante","Babieca","Bucéfalo","Rucio"]}},{"cat":"cul","level":2,"fr":{"q":"En quelle année a commencé la guerre civile espagnole ?","a":"1936","w":"La guerre civile a duré de 1936 à 1939.\nElle a été suivie par la dictature de Franco jusqu'en 1975.","opts":["1923","1931","1936","1939"]},"es":{"q":"¿En qué año empezó la Guerra Civil española?","a":"1936","w":"La Guerra Civil duró de 1936 a 1939.\nDespués llegó la dictadura de Franco, que se prolongó hasta 1975.","opts":["1923","1931","1936","1939"]}},{"cat":"cul","level":1,"fr":{"q":"En combien d'arrondissements Paris est-il divisé ?","a":"20","w":"Paris compte 20 arrondissements.\nIls sont numérotés en spirale à partir du centre, dans le sens des aiguilles d'une montre.","opts":["12","20","16","24"]},"es":{"q":"¿En cuántos distritos (arrondissements) está dividido París?","a":"20","w":"París tiene 20 distritos.\nSe numeran en espiral desde el centro, en el sentido de las agujas del reloj.","opts":["12","20","16","24"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville est né Napoléon Bonaparte ?","a":"Ajaccio","w":"Napoléon est né à Ajaccio, en Corse, en 1769.\nLa Corse était devenue française l'année précédente.","opts":["Bastia","Paris","Nice","Ajaccio"]},"es":{"q":"¿En qué ciudad nació Napoleón Bonaparte?","a":"Ajaccio","w":"Napoleón nació en Ajaccio, Córcega, en 1769.\nLa isla se había vuelto francesa solo un año antes.","opts":["Bastia","París","Niza","Ajaccio"]}},{"cat":"cul","level":3,"fr":{"q":"Qui sont les deux coprinces d'Andorre ?","a":"Le président français et l'évêque d'Urgell","w":"Andorre a deux chefs d'État : le président de la République française et l'évêque d'Urgell, en Catalogne.\nCe système remonte au Moyen Âge.","opts":["Le roi d'Espagne et le président français","Le président français et l'évêque d'Urgell","Le pape et le roi d'Espagne","Le président catalan et le préfet des Pyrénées"]},"es":{"q":"¿Quiénes son los dos copríncipes de Andorra?","a":"El presidente francés y el obispo de Urgel","w":"Andorra tiene dos jefes de Estado: el presidente de la República Francesa y el obispo de Urgel.\nEste sistema se remonta a la Edad Media.","opts":["El rey de España y el presidente francés","El presidente francés y el obispo de Urgel","El papa y el rey de España","El presidente catalán y el prefecto de los Pirineos"]}},{"cat":"cul","level":2,"fr":{"q":"Laquelle de ces villes espagnoles se trouve sur le continent africain ?","a":"Melilla","w":"Melilla et Ceuta sont deux villes autonomes espagnoles situées en Afrique du Nord.\nElles sont entourées par le Maroc.","opts":["Algésiras","Tarifa","Almería","Melilla"]},"es":{"q":"¿Cuál de estas ciudades españolas está en el continente africano?","a":"Melilla","w":"Melilla y Ceuta son ciudades autónomas españolas en el norte de África.\nAmbas limitan con Marruecos.","opts":["Algeciras","Tarifa","Almería","Melilla"]}},{"cat":"cul","level":2,"fr":{"q":"De quelle ville la bouillabaisse est-elle la spécialité ?","a":"Marseille","w":"La bouillabaisse est une soupe de poissons de roche typique de Marseille.\nElle se sert avec une rouille et des croûtons.","opts":["Bordeaux","Brest","Marseille","Lyon"]},"es":{"q":"¿De qué ciudad es típica la bullabesa (bouillabaisse)?","a":"Marsella","w":"La bullabesa es una sopa de pescados de roca típica de Marsella.\nSe sirve con salsa rouille y picatostes.","opts":["Burdeos","Brest","Marsella","Lyon"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quel océan se trouve l'île de La Réunion ?","a":"L'océan Indien","w":"La Réunion est un département français de l'océan Indien.\nElle se trouve à l'est de Madagascar, près de l'île Maurice.","opts":["L'océan Indien","L'océan Atlantique","L'océan Pacifique","L'océan Austral"]},"es":{"q":"¿En qué océano se encuentra la isla de La Reunión?","a":"El océano Índico","w":"La Reunión es un departamento francés en el océano Índico.\nEstá al este de Madagascar, cerca de Mauricio.","opts":["El océano Índico","El océano Atlántico","El océano Pacífico","El océano Antártico"]}},{"cat":"cul","level":1,"fr":{"q":"Pour quelle fête Valence brûle-t-elle d'immenses figures en carton en mars ?","a":"Las Fallas","w":"Les Fallas se terminent par la « Cremà », la nuit du 19 mars.\nOn y brûle des monuments satiriques appelés « ninots ».","opts":["La Tomatina","Moros y Cristianos","Las Fallas","La Feria de Abril"]},"es":{"q":"¿En qué fiesta Valencia quema enormes figuras de cartón en marzo?","a":"Las Fallas","w":"Las Fallas terminan con la Cremà, la noche del 19 de marzo.\nSe queman monumentos satíricos llenos de ninots.","opts":["La Tomatina","Moros y Cristianos","Las Fallas","La Feria de Abril"]}},{"cat":"cul","level":2,"fr":{"q":"Qui chantait « Non, je ne regrette rien » ?","a":"Édith Piaf","w":"Édith Piaf a enregistré cette chanson en 1960.\nElle est aussi célèbre pour « La Vie en rose ».","opts":["Édith Piaf","Dalida","Barbara","Juliette Gréco"]},"es":{"q":"¿Quién cantaba «Non, je ne regrette rien»?","a":"Édith Piaf","w":"Édith Piaf grabó esta canción en 1960.\nTambién es famosa por «La Vie en rose».","opts":["Édith Piaf","Dalida","Barbara","Juliette Gréco"]}},{"cat":"cul","level":1,"fr":{"q":"Quel roi de France était surnommé le Roi-Soleil ?","a":"Louis XIV","w":"Louis XIV a choisi le soleil comme emblème.\nIl a fait du château de Versailles le siège du pouvoir.","opts":["Louis XVI","François Ier","Henri IV","Louis XIV"]},"es":{"q":"¿Qué rey de Francia era conocido como el Rey Sol?","a":"Luis XIV","w":"Luis XIV eligió el sol como emblema.\nConvirtió el palacio de Versalles en la sede del poder.","opts":["Luis XVI","Francisco I","Enrique IV","Luis XIV"]}},{"cat":"cul","level":3,"fr":{"q":"Combien de fois Paris a-t-il accueilli les Jeux olympiques d'été ?","a":"3","w":"Paris a organisé les Jeux en 1900, 1924 et 2024.\nLondres est la seule autre ville à les avoir accueillis trois fois.","opts":["1","3","2","4"]},"es":{"q":"¿Cuántas veces ha organizado París los Juegos Olímpicos de verano?","a":"3","w":"París organizó los Juegos en 1900, 1924 y 2024.\nLondres es la única otra ciudad que los ha acogido tres veces.","opts":["1","3","2","4"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville Jeanne d'Arc a-t-elle été brûlée en 1431 ?","a":"Rouen","w":"Jeanne d'Arc a été jugée et brûlée à Rouen.\nElle est surnommée la Pucelle d'Orléans, ville qu'elle avait libérée.","opts":["Orléans","Reims","Paris","Rouen"]},"es":{"q":"¿En qué ciudad fue quemada Juana de Arco en 1431?","a":"Ruan","w":"Juana de Arco fue juzgada y quemada en Ruan.\nSe la conoce como la Doncella de Orleans, ciudad que liberó.","opts":["Orleans","Reims","París","Ruan"]}},{"cat":"cul","level":2,"fr":{"q":"Quel jour sort traditionnellement le beaujolais nouveau ?","a":"Le troisième jeudi de novembre","w":"Le beaujolais nouveau est mis en vente le troisième jeudi de novembre.\nIl s'agit d'un vin primeur, à boire jeune.","opts":["Le premier lundi d'octobre","Le troisième jeudi de novembre","Le 11 novembre","Le dernier vendredi de septembre"]},"es":{"q":"¿Qué día sale tradicionalmente el beaujolais nouveau?","a":"El tercer jueves de noviembre","w":"El beaujolais nouveau sale a la venta el tercer jueves de noviembre.\nEs un vino joven, pensado para beberse pronto.","opts":["El primer lunes de octubre","El tercer jueves de noviembre","El 11 de noviembre","El último viernes de septiembre"]}},{"cat":"cul","level":2,"fr":{"q":"Combien de Tours de France consécutifs l'Espagnol Miguel Indurain a-t-il gagnés ?","a":"5","w":"Miguel Indurain a remporté le Tour cinq fois de suite, de 1991 à 1995.\nIl a été le premier coureur à réussir cinq victoires consécutives.","opts":["5","3","4","7"]},"es":{"q":"¿Cuántos Tours de Francia consecutivos ganó Miguel Induráin?","a":"5","w":"Induráin ganó el Tour cinco veces seguidas, de 1991 a 1995.\nFue el primer ciclista en lograr cinco victorias consecutivas.","opts":["5","3","4","7"]}},{"cat":"cul","level":2,"fr":{"q":"Comment s'appelle la figure féminine qui symbolise la République française ?","a":"Marianne","w":"Marianne porte un bonnet phrygien, symbole de liberté.\nSon buste trône dans toutes les mairies de France.","opts":["Jeanne","Liberté","Marianne","Gabrielle"]},"es":{"q":"¿Cómo se llama la figura femenina que simboliza la República francesa?","a":"Marianne","w":"Marianne lleva un gorro frigio, símbolo de libertad.\nSu busto preside todos los ayuntamientos de Francia.","opts":["Jeanne","Liberté","Marianne","Gabrielle"]}},{"cat":"cul","level":2,"fr":{"q":"Quels sont les deux symboles des armoiries de Madrid ?","a":"Un ours et un arbousier","w":"L'ours et l'arbousier, le « madroño », figurent sur le blason de Madrid.\nOn peut voir leur statue à la Puerta del Sol.","opts":["Un ours et un arbousier","Un lion et un château","Un taureau et un olivier","Un aigle et une grenade"]},"es":{"q":"¿Cuáles son los dos símbolos del escudo de Madrid?","a":"El oso y el madroño","w":"El oso y el madroño aparecen en el escudo de Madrid.\nSu estatua es un punto de encuentro clásico en la Puerta del Sol.","opts":["El oso y el madroño","El león y el castillo","El toro y el olivo","El águila y la granada"]}},{"cat":"cul","level":2,"fr":{"q":"Quelle devise latine figure sur les armoiries de l'Espagne ?","a":"Plus Ultra","w":"« Plus Ultra » signifie « plus loin ».\nElle s'enroule autour des colonnes d'Hercule et date de Charles Quint.","opts":["Veni Vidi Vici","Fluctuat nec mergitur","Semper Fidelis","Plus Ultra"]},"es":{"q":"¿Qué lema en latín aparece en el escudo de España?","a":"Plus Ultra","w":"«Plus Ultra» significa «más allá».\nRodea las columnas de Hércules y procede de la época de Carlos V.","opts":["Veni Vidi Vici","Fluctuat nec mergitur","Semper Fidelis","Plus Ultra"]}},{"cat":"cul","level":2,"fr":{"q":"Quel fleuve traverse Bordeaux ?","a":"La Garonne","w":"Bordeaux est construite sur un croissant de la Garonne, d'où son surnom de « port de la Lune ».\nPlus en aval, la Garonne rejoint la Dordogne pour former la Gironde.","opts":["La Dordogne","La Loire","La Garonne","Le Lot"]},"es":{"q":"¿Qué río atraviesa Burdeos?","a":"El Garona","w":"Burdeos se asienta en una curva del Garona, de ahí su apodo de «puerto de la Luna».\nMás abajo, el Garona se une al Dordoña para formar la Gironda.","opts":["El Dordoña","El Loira","El Garona","El Lot"]}},{"cat":"cul","level":3,"fr":{"q":"Par quel traité Gibraltar est-il devenu britannique en 1713 ?","a":"Le traité d'Utrecht","w":"Le traité d'Utrecht a mis fin à la guerre de Succession d'Espagne.\nL'Espagne y a cédé Gibraltar à la Grande-Bretagne.","opts":["Le traité de Versailles","Le traité d'Utrecht","Le traité des Pyrénées","Le traité de Tordesillas"]},"es":{"q":"¿Por qué tratado pasó Gibraltar a ser británico en 1713?","a":"El Tratado de Utrecht","w":"El Tratado de Utrecht puso fin a la guerra de Sucesión española.\nEn él España cedió Gibraltar a Gran Bretaña.","opts":["El Tratado de Versalles","El Tratado de Utrecht","El Tratado de los Pirineos","El Tratado de Tordesillas"]}},{"cat":"cul","level":2,"fr":{"q":"Quel est le symbole des pèlerins du chemin de Saint-Jacques-de-Compostelle ?","a":"La coquille Saint-Jacques","w":"Les pèlerins portent une coquille accrochée à leur sac.\nOn la retrouve aussi sur les bornes qui balisent le chemin.","opts":["La croix de Malte","La coquille Saint-Jacques","L'épi de blé","La clé"]},"es":{"q":"¿Cuál es el símbolo de los peregrinos del Camino de Santiago?","a":"La concha de vieira","w":"Los peregrinos llevan una concha colgada de la mochila.\nTambién aparece en los mojones que señalan el Camino.","opts":["La cruz de Malta","La concha de vieira","La espiga de trigo","La llave"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle ville se déroule la Feria de Abril ?","a":"Séville","w":"La Feria de Abril de Séville a lieu une ou deux semaines après Pâques.\nOn y danse des sévillanes dans les « casetas » en tenue traditionnelle.","opts":["Malaga","Cordoue","Séville","Valence"]},"es":{"q":"¿En qué ciudad se celebra la Feria de Abril?","a":"Sevilla","w":"La Feria de Abril de Sevilla se celebra una o dos semanas después de Semana Santa.\nEn las casetas se bailan sevillanas con traje de flamenca.","opts":["Málaga","Córdoba","Sevilla","Valencia"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle région espagnole produit-on l'essentiel du cava ?","a":"La Catalogne","w":"La grande majorité du cava vient du Penedès, en Catalogne.\nIl est élaboré selon la méthode traditionnelle, comme le champagne.","opts":["L'Andalousie","La Galice","La Rioja","La Catalogne"]},"es":{"q":"¿En qué comunidad se produce la mayor parte del cava?","a":"Cataluña","w":"La gran mayoría del cava procede del Penedès, en Cataluña.\nSe elabora por el método tradicional, como el champán.","opts":["Andalucía","Galicia","La Rioja","Cataluña"]}},{"cat":"cul","level":1,"fr":{"q":"Quel dessert espagnol ressemble beaucoup à la crème brûlée française ?","a":"La crema catalana","w":"La crema catalana est parfumée au citron et à la cannelle.\nComme la crème brûlée, elle est recouverte de sucre caramélisé.","opts":["La crema catalana","Le flan","La natilla","L'arroz con leche"]},"es":{"q":"¿Qué postre español se parece mucho a la crème brûlée francesa?","a":"La crema catalana","w":"La crema catalana se aromatiza con limón y canela.\nComo la crème brûlée, lleva una capa de azúcar caramelizado.","opts":["La crema catalana","El flan","Las natillas","El arroz con leche"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quoi trempe-t-on traditionnellement les churros en Espagne ?","a":"Du chocolat chaud","w":"Les churros se dégustent avec un chocolat chaud épais.\nC'est un petit-déjeuner classique, surtout le 1er janvier au matin.","opts":["Du café au lait","Du miel","Du chocolat chaud","De la crème fouettée"]},"es":{"q":"¿En qué se mojan tradicionalmente los churros en España?","a":"Chocolate caliente","w":"Los churros se toman con un chocolate caliente espeso.\nEs un desayuno clásico, sobre todo la mañana del 1 de enero.","opts":["Café con leche","Miel","Chocolate caliente","Nata montada"]}},{"cat":"cul","level":2,"fr":{"q":"De quelle région viennent les « pintxos », petites bouchées souvent piquées sur du pain ?","a":"Le Pays basque","w":"Les pintxos sont la version basque des tapas.\nSaint-Sébastien en a fait une véritable spécialité.","opts":["Le Pays basque","L'Andalousie","La Castille","Les Baléares"]},"es":{"q":"¿De qué región son típicos los pintxos?","a":"País Vasco","w":"Los pintxos son la versión vasca de las tapas.\nSan Sebastián los ha convertido en todo un emblema.","opts":["País Vasco","Andalucía","Castilla","Baleares"]}},{"cat":"cul","level":3,"fr":{"q":"Dans quelle ville se trouve le Théâtre-musée Dalí ?","a":"Figueres","w":"Salvador Dalí est né à Figueres et y a créé son propre musée.\nIl y est aussi enterré, sous la scène du théâtre.","opts":["Cadaqués","Figueres","Gérone","Barcelone"]},"es":{"q":"¿En qué ciudad está el Teatro-Museo Dalí?","a":"Figueres","w":"Salvador Dalí nació en Figueres y allí creó su propio museo.\nTambién está enterrado en él, bajo el escenario.","opts":["Cadaqués","Figueres","Girona","Barcelona"]}},{"cat":"cul","level":1,"fr":{"q":"Quel groupe sévillan a chanté le tube planétaire « Macarena » ?","a":"Los del Río","w":"« Macarena » a été enregistrée par Los del Río en 1993.\nLe remix de 1995 en a fait un succès mondial.","opts":["Gipsy Kings","Las Ketchup","Mecano","Los del Río"]},"es":{"q":"¿Qué dúo sevillano cantó el éxito mundial «Macarena»?","a":"Los del Río","w":"«Macarena» la grabaron Los del Río en 1993.\nUn remix de 1995 la convirtió en un éxito mundial.","opts":["Gipsy Kings","Las Ketchup","Mecano","Los del Río"]}},{"cat":"cul","level":1,"fr":{"q":"Comment s'appelle le stade du Paris Saint-Germain ?","a":"Le Parc des Princes","w":"Le PSG joue au Parc des Princes, dans le 16e arrondissement.\nLe Vélodrome est le stade de l'Olympique de Marseille.","opts":["Le Stade de France","Le Vélodrome","Le Stade Charléty","Le Parc des Princes"]},"es":{"q":"¿Cómo se llama el estadio del Paris Saint-Germain?","a":"El Parque de los Príncipes","w":"El PSG juega en el Parque de los Príncipes, en el distrito 16.\nEl Vélodrome es el estadio del Olympique de Marsella.","opts":["El Stade de France","El Vélodrome","El Estadio Charléty","El Parque de los Príncipes"]}},{"cat":"cul","level":2,"fr":{"q":"Quelles rivières se rejoignent à Lyon ?","a":"Le Rhône et la Saône","w":"Le Rhône et la Saône se rejoignent au sud de Lyon.\nLe quartier qui occupe ce point s'appelle d'ailleurs La Confluence.","opts":["La Loire et l'Allier","Le Rhône et la Saône","La Seine et la Marne","La Garonne et le Tarn"]},"es":{"q":"¿Qué ríos confluyen en Lyon?","a":"El Ródano y el Saona","w":"El Ródano y el Saona se unen al sur de Lyon.\nEl barrio situado en ese punto se llama precisamente Confluence.","opts":["El Loira y el Allier","El Ródano y el Saona","El Sena y el Marne","El Garona y el Tarn"]}},{"cat":"cul","level":1,"fr":{"q":"De quelle région française vient le camembert ?","a":"La Normandie","w":"Le camembert porte le nom d'un village de l'Orne, en Normandie.\nLe camembert de Normandie AOP est fait au lait cru de vache.","opts":["La Normandie","La Bourgogne","L'Auvergne","La Savoie"]},"es":{"q":"¿De qué región francesa es el camembert?","a":"Normandía","w":"El camembert toma su nombre de un pueblo del Orne, en Normandía.\nEl camembert de Normandía con denominación se hace con leche cruda de vaca.","opts":["Normandía","Borgoña","Auvernia","Saboya"]}},{"cat":"cul","level":3,"fr":{"q":"Quel architecte a conçu la pyramide de verre du Louvre ?","a":"Ieoh Ming Pei","w":"La pyramide d'Ieoh Ming Pei a été inaugurée en 1989.\nElle sert d'entrée principale au musée.","opts":["Jean Nouvel","Renzo Piano","Ieoh Ming Pei","Frank Gehry"]},"es":{"q":"¿Qué arquitecto diseñó la pirámide de cristal del Louvre?","a":"Ieoh Ming Pei","w":"La pirámide de Ieoh Ming Pei se inauguró en 1989.\nEs la entrada principal del museo.","opts":["Jean Nouvel","Renzo Piano","Ieoh Ming Pei","Frank Gehry"]}},{"cat":"cul","level":1,"fr":{"q":"En quelle année Barcelone a-t-elle accueilli les Jeux olympiques ?","a":"1992","w":"Les Jeux de Barcelone ont eu lieu à l'été 1992.\nLa même année, Séville accueillait l'Exposition universelle.","opts":["1988","1992","1996","2000"]},"es":{"q":"¿En qué año se celebraron los Juegos Olímpicos de Barcelona?","a":"1992","w":"Los Juegos de Barcelona se celebraron en el verano de 1992.\nEse mismo año Sevilla acogió la Exposición Universal.","opts":["1988","1992","1996","2000"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a des aiguilles mais ne pique jamais ?","a":"Une horloge","w":"Le piège : penser à quelque chose qui pique, comme le sapin ou le hérisson.\nLes aiguilles d'une horloge indiquent l'heure.\nElles ne piquent personne : c'est une horloge.","opts":["Une horloge","Un sapin","Un hérisson","Un cactus"]},"es":{"q":"¿Qué tiene agujas pero nunca pincha?","a":"Un reloj","w":"Trampa: pensar en algo que pincha, como el pino o el erizo.\nLas agujas de un reloj marcan la hora.\nNo pinchan a nadie: es un reloj.","opts":["Un reloj","Un pino","Un erizo","Un cactus"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a quatre pieds mais ne peut pas marcher ?","a":"Une table","w":"Le piège : chercher un animal.\nUne table a quatre pieds, mais elle ne bouge pas.\nUne chaise serait aussi acceptée.","opts":["Un chien","Une table","Un cheval","Un bébé"]},"es":{"q":"¿Qué tiene cuatro patas pero no puede caminar?","a":"Una mesa","w":"Trampa: buscar un animal.\nUna mesa tiene cuatro patas, pero no se mueve.\nUna silla también valdría.","opts":["Un perro","Una mesa","Un caballo","Un bebé"]}},{"cat":"eni","level":2,"fr":{"q":"Je fais le tour du monde sans jamais quitter mon coin. Qui suis-je ?","a":"Un timbre","w":"Le piège : penser à un moyen de transport.\nUn timbre est collé dans le coin de l'enveloppe.\nIl voyage partout avec la lettre sans bouger de son coin.","opts":["Un avion","Une valise","Un timbre","Un globe"]},"es":{"q":"Doy la vuelta al mundo sin salir de mi esquina. ¿Qué soy?","a":"Un sello","w":"Trampa: pensar en un medio de transporte.\nEl sello va pegado en la esquina del sobre.\nViaja por todo el mundo con la carta sin moverse de su esquina.","opts":["Un avión","Una maleta","Un sello","Un globo terráqueo"]}},{"cat":"eni","level":1,"fr":{"q":"Plus il y en a, moins on y voit. Qu'est-ce que c'est ?","a":"L'obscurité","w":"Le piège : penser à quelque chose qui éblouit.\nPlus il fait noir, moins on voit.\nC'est l'obscurité (le brouillard serait aussi accepté).","opts":["La lumière","Le soleil","Les lunettes","L'obscurité"]},"es":{"q":"Cuanto más hay, menos se ve. ¿Qué es?","a":"La oscuridad","w":"Trampa: pensar en algo que deslumbra.\nCuanto más oscuro está, menos se ve.\nEs la oscuridad (la niebla también valdría).","opts":["La luz","El sol","Las gafas","La oscuridad"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qu'on peut attraper mais jamais lancer ?","a":"Un rhume","w":"Le piège : penser à un objet qu'on attrape au vol.\nUn ballon, ça se lance aussi.\nUn rhume, on l'attrape, mais impossible de le lancer.","opts":["Un rhume","Un ballon","Une balle","Un frisbee"]},"es":{"q":"¿Qué se puede pillar pero nunca lanzar?","a":"Un resfriado","w":"Trampa: pensar en un objeto que se atrapa al vuelo.\nUn balón también se lanza.\nUn resfriado se pilla, pero no hay forma de lanzarlo.","opts":["Un resfriado","Un balón","Una pelota","Un frisbi"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai un lit mais je ne dors jamais, et je cours sans avoir de jambes. Qui suis-je ?","a":"Une rivière","w":"Le piège : penser à un vrai lit ou à un animal.\nUne rivière coule dans son lit.\nEt on dit qu'une rivière court : c'est elle.","opts":["Un hôpital","Une rivière","Un lièvre","Un hamac"]},"es":{"q":"Tengo lecho pero nunca duermo, y corro sin tener piernas. ¿Qué soy?","a":"Un río","w":"Trampa: pensar en una cama de verdad o en un animal.\nEl río corre por su lecho.\nTiene lecho y corre sin piernas: es el río.","opts":["Un hospital","Un río","Una liebre","Una hamaca"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce que tu peux donner à quelqu'un tout en le gardant ?","a":"Ta parole","w":"Le piège : penser à un objet, qu'on perd quand on le donne.\nOn donne sa parole, puis on la tient.\nOn l'a donnée et on la garde : c'est ta parole.","opts":["Ton manteau","Ton argent","Ta parole","Ta place"]},"es":{"q":"¿Qué puedes dar a alguien y aun así quedártelo?","a":"Tu palabra","w":"Trampa: pensar en un objeto, que se pierde al darlo.\nDas tu palabra y luego la mantienes.\nLa has dado y sigue siendo tuya: es tu palabra.","opts":["Tu abrigo","Tu dinero","Tu palabra","Tu asiento"]}},{"cat":"eni","level":3,"fr":{"q":"Un homme habite au 10e étage. Le soir, il prend l'ascenseur jusqu'au 7e et finit à pied, sauf les jours de pluie où il monte directement au 10e. Pourquoi ?","a":"Il est trop petit pour atteindre le bouton 10","w":"Le piège : chercher une raison sportive ou une panne.\nIl est petit et n'atteint que le bouton du 7e.\nLes jours de pluie, il appuie sur le 10 avec son parapluie.","opts":["Il fait du sport","L'ascenseur est en panne","Il rend visite à un voisin","Il est trop petit pour atteindre le bouton 10"]},"es":{"q":"Un hombre vive en un 10.º piso. Por la tarde sube en ascensor hasta el 7.º y sigue a pie, salvo los días de lluvia, que sube directo al 10.º. ¿Por qué?","a":"Es demasiado bajito para llegar al botón del 10","w":"Trampa: buscar un motivo deportivo o una avería.\nEs bajito y solo llega al botón del 7.º.\nLos días de lluvia pulsa el 10 con el paraguas.","opts":["Hace deporte","El ascensor está averiado","Visita a un vecino","Es demasiado bajito para llegar al botón del 10"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qui marche à quatre pattes le matin, sur deux pattes à midi et sur trois le soir ?","a":"L'être humain","w":"Le piège : chercher un animal.\nAu matin de la vie, le bébé marche à quatre pattes.\nAdulte, il marche sur deux jambes, et vieux, avec une canne : l'être humain.","opts":["L'être humain","Le chat","Le kangourou","Le chien"]},"es":{"q":"¿Qué anda a cuatro patas por la mañana, a dos al mediodía y a tres por la noche?","a":"El ser humano","w":"Trampa: buscar un animal.\nEn la mañana de la vida, el bebé gatea a cuatro patas.\nDe adulto anda con dos piernas y de viejo con bastón: el ser humano.","opts":["El ser humano","El gato","El canguro","El perro"]}},{"cat":"eni","level":2,"fr":{"q":"Je suis plus léger qu'une plume, mais même l'homme le plus fort ne peut pas me retenir plus de quelques minutes. Qui suis-je ?","a":"Le souffle","w":"Le piège : penser à un objet léger qu'on tient dans la main.\nOn peut retenir son souffle, mais pas longtemps.\nIl ne pèse rien : c'est le souffle.","opts":["Une bulle","Le souffle","Un ballon","Une feuille"]},"es":{"q":"Soy más ligero que una pluma, pero ni el hombre más fuerte puede contenerme más de unos minutos. ¿Qué soy?","a":"El aliento","w":"Trampa: pensar en un objeto ligero que se sujeta con la mano.\nSe puede contener el aliento, pero no mucho tiempo.\nNo pesa nada: es el aliento.","opts":["Una burbuja","El aliento","Un globo","Una hoja"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a des feuilles mais n'est pas une plante ?","a":"Un livre","w":"Le piège : penser à un végétal.\nLes pages d'un livre s'appellent aussi des feuilles.\nUn livre a des feuilles sans être une plante (un cahier serait aussi accepté).","opts":["Un chêne","Une salade","Un livre","Un arbre"]},"es":{"q":"¿Qué tiene hojas pero no es una planta?","a":"Un libro","w":"Trampa: pensar en un vegetal.\nLas páginas de un libro también se llaman hojas.\nEl libro tiene hojas sin ser una planta (un cuaderno también valdría).","opts":["Un roble","Una lechuga","Un libro","Un árbol"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qu'il faut casser avant de pouvoir s'en servir ?","a":"Un œuf","w":"Le piège : penser à un objet qu'on casse par accident.\nUn verre cassé ne sert plus à rien.\nUn œuf, lui, il faut le casser pour le cuisiner.","opts":["Un verre","Une assiette","Un téléphone","Un œuf"]},"es":{"q":"¿Qué hay que romper antes de poder usarlo?","a":"Un huevo","w":"Trampa: pensar en un objeto que se rompe por accidente.\nUn vaso roto ya no sirve para nada.\nUn huevo, en cambio, hay que romperlo para cocinarlo.","opts":["Un vaso","Un plato","Un teléfono","Un huevo"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui monte et descend sans jamais bouger ?","a":"Un escalier","w":"Le piège : penser à quelque chose qui bouge vraiment, comme l'ascenseur.\nOn dit qu'un escalier monte ou descend.\nPourtant il ne bouge jamais : c'est l'escalier.","opts":["Un escalier","Un ascenseur","Un yoyo","Une balançoire"]},"es":{"q":"¿Qué sube y baja sin moverse nunca?","a":"Una escalera","w":"Trampa: pensar en algo que se mueve de verdad, como el ascensor.\nSe dice que una escalera sube o baja.\nPero nunca se mueve: es la escalera.","opts":["Una escalera","Un ascensor","Un yoyó","Un columpio"]}},{"cat":"eni","level":2,"fr":{"q":"Je suis noir quand on m'achète, rouge quand on m'utilise et gris quand on me jette. Qui suis-je ?","a":"Le charbon","w":"Le piège : s'arrêter à la couleur noire (café, chocolat).\nLe charbon est noir, puis rougeoie quand il brûle.\nIl finit en cendres grises : c'est le charbon.","opts":["Le café","Le charbon","Le pneu","Le chocolat"]},"es":{"q":"Soy negro cuando me compran, rojo cuando me usan y gris cuando me tiran. ¿Qué soy?","a":"El carbón","w":"Trampa: quedarse en el color negro (café, chocolate).\nEl carbón es negro y se pone rojo al arder.\nTermina en ceniza gris: es el carbón.","opts":["El café","El carbón","El neumático","El chocolate"]}},{"cat":"eni","level":2,"fr":{"q":"Dans un tiroir, il y a 10 chaussettes noires et 10 blanches. Dans le noir, combien dois-tu en prendre au minimum pour être sûr d'avoir une paire de la même couleur ?","a":"3","w":"Le piège : répondre 2, ou 11 en imaginant le pire cas.\nAvec 2 chaussettes, tu peux avoir une noire et une blanche.\nLa 3e est forcément noire ou blanche : elle complète une paire.","opts":["2","11","3","10"]},"es":{"q":"En un cajón hay 10 calcetines negros y 10 blancos. A oscuras, ¿cuántos tienes que sacar como mínimo para tener seguro un par del mismo color?","a":"3","w":"Trampa: responder 2, u 11 pensando en el peor caso.\nCon 2 calcetines puedes tener uno negro y uno blanco.\nEl 3.º es negro o blanco por fuerza: completa un par.","opts":["2","11","3","10"]}},{"cat":"eni","level":2,"fr":{"q":"Si avant-hier était jeudi, quel jour serons-nous après-demain ?","a":"Lundi","w":"Le piège : s'arrêter à aujourd'hui (samedi).\nAvant-hier jeudi, donc hier vendredi et aujourd'hui samedi.\nAprès-demain, c'est donc lundi.","opts":["Samedi","Dimanche","Vendredi","Lundi"]},"es":{"q":"Si anteayer fue jueves, ¿qué día será pasado mañana?","a":"Lunes","w":"Trampa: quedarse en hoy (sábado).\nAnteayer jueves, así que ayer viernes y hoy sábado.\nPasado mañana será lunes.","opts":["Sábado","Domingo","Viernes","Lunes"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qui tombe tous les jours sans jamais se faire mal ?","a":"La nuit","w":"Le piège : penser à un objet qui tombe vraiment.\nOn dit que la nuit tombe.\nElle tombe chaque soir et ne se fait jamais mal.","opts":["La nuit","Un vase","Une pomme","Un enfant"]},"es":{"q":"¿Qué cae todos los días sin hacerse nunca daño?","a":"La noche","w":"Trampa: pensar en un objeto que se cae de verdad.\nSe dice que cae la noche.\nCae cada tarde y nunca se hace daño.","opts":["La noche","Un jarrón","Una manzana","Un niño"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai un pouce et quatre doigts, mais je ne suis pas vivant. Qui suis-je ?","a":"Un gant","w":"Le piège : répondre « une main », qui est vivante.\nUn gant a la forme d'une main.\nUn pouce, quatre doigts, mais aucune vie : c'est le gant.","opts":["Une main","Un gant","Un singe","Une fourchette"]},"es":{"q":"Tengo un pulgar y cuatro dedos, pero no estoy vivo. ¿Qué soy?","a":"Un guante","w":"Trampa: responder «una mano», que está viva.\nUn guante tiene forma de mano.\nUn pulgar, cuatro dedos y nada de vida: es el guante.","opts":["Una mano","Un guante","Un mono","Un tenedor"]}},{"cat":"eni","level":1,"fr":{"q":"Je réponds toujours, mais je ne parle jamais en premier. Qui suis-je ?","a":"L'écho","w":"Le piège : penser au perroquet, qui peut parler tout seul.\nL'écho ne fait que répéter ce qu'on vient de dire.\nIl ne parle jamais le premier.","opts":["Un répondeur","Un perroquet","L'écho","Un élève"]},"es":{"q":"Siempre respondo, pero nunca hablo primero. ¿Qué soy?","a":"El eco","w":"Trampa: pensar en el loro, que puede hablar solo.\nEl eco solo repite lo que se acaba de decir.\nNunca habla primero.","opts":["Un contestador","Un loro","El eco","Un alumno"]}},{"cat":"eni","level":3,"fr":{"q":"J'ai deux pièces qui font 30 centimes en tout. L'une des deux n'est pas une pièce de 10 centimes. Quelles sont ces pièces ?","a":"Une de 20 et une de 10","w":"Le piège : croire qu'aucune des deux n'est une pièce de 10.\nL'énoncé dit seulement que l'une n'en est pas une.\nCelle-là est la pièce de 20, et l'autre est bien une pièce de 10.","opts":["Deux pièces de 15","Impossible","Une de 25 et une de 5","Une de 20 et une de 10"]},"es":{"q":"Tengo dos monedas que suman 30 céntimos. Una de ellas no es de 10 céntimos. ¿Qué monedas son?","a":"Una de 20 y una de 10","w":"Trampa: creer que ninguna de las dos es de 10.\nEl enunciado solo dice que una no lo es.\nEsa es la de 20, y la otra sí es de 10.","opts":["Dos de 15","Es imposible","Una de 25 y una de 5","Una de 20 y una de 10"]}},{"cat":"eni","level":3,"fr":{"q":"10 bougies sont allumées. Un courant d'air en éteint 3, et on ne rallume rien. Combien de bougies restera-t-il le lendemain matin ?","a":"3","w":"Le piège : répondre 7, les bougies encore allumées.\nCelles qui restent allumées brûlent jusqu'au bout et disparaissent.\nIl ne reste que les 3 bougies éteintes.","opts":["3","7","10","0"]},"es":{"q":"Hay 10 velas encendidas. Una corriente de aire apaga 3 y no se vuelve a encender ninguna. ¿Cuántas velas quedarán a la mañana siguiente?","a":"3","w":"Trampa: responder 7, las velas que siguen encendidas.\nEsas se consumen hasta el final y desaparecen.\nSolo quedan las 3 velas apagadas.","opts":["3","7","10","0"]}},{"cat":"eni","level":2,"fr":{"q":"J'ai un chapeau mais pas de tête, et un pied mais pas de chaussure. Qui suis-je ?","a":"Un champignon","w":"Le piège : penser à un personnage, comme l'épouvantail.\nLe haut d'un champignon s'appelle le chapeau, et sa tige le pied.\nNi tête ni chaussure : c'est le champignon.","opts":["Un épouvantail","Un champignon","Un clou","Une lampe"]},"es":{"q":"Tengo sombrero pero no cabeza, y pie pero no zapato. ¿Qué soy?","a":"Una seta","w":"Trampa: pensar en un personaje, como el espantapájaros.\nLa parte de arriba de una seta se llama sombrero, y el tallo, pie.\nNi cabeza ni zapato: es la seta.","opts":["Un espantapájaros","Una seta","Un clavo","Una lámpara"]}},{"cat":"eni","level":1,"fr":{"q":"Je te ressemble trait pour trait, mais ta droite est ma gauche. Qui suis-je ?","a":"Ton reflet dans le miroir","w":"Le piège : répondre « ton jumeau » ou « ton ombre ».\nUn jumeau ne t'imite pas, et une ombre n'a pas de traits.\nSeul le miroir te renvoie ton image inversée.","opts":["Ton jumeau","Ta photo","Ton reflet dans le miroir","Ton ombre"]},"es":{"q":"Me parezco a ti en todo, pero tu derecha es mi izquierda. ¿Qué soy?","a":"Tu reflejo en el espejo","w":"Trampa: responder «tu gemelo» o «tu sombra».\nUn gemelo no te imita, y una sombra no tiene rasgos.\nSolo el espejo te devuelve tu imagen invertida.","opts":["Tu gemelo","Tu foto","Tu reflejo en el espejo","Tu sombra"]}},{"cat":"pie","level":1,"fr":{"q":"Un œuf met 4 minutes à cuire. Combien de temps faut-il pour cuire 3 œufs ensemble dans la même casserole ?","a":"4 minutes","w":"Le réflexe : multiplier, 3 × 4 = 12 minutes.\nLes œufs cuisent en même temps dans la même eau.\nIl faut donc toujours 4 minutes.","opts":["12 minutes","4 minutes","8 minutes","6 minutes"]},"es":{"q":"Un huevo tarda 4 minutos en cocerse. ¿Cuánto se tarda en cocer 3 huevos juntos en el mismo cazo?","a":"4 minutos","w":"Reflejo: multiplicar, 3 × 4 = 12 minutos.\nLos huevos se cuecen a la vez en la misma agua.\nAsí que siguen siendo 4 minutos.","opts":["12 minutos","4 minutos","8 minutos","6 minutos"]}},{"cat":"pie","level":2,"fr":{"q":"Si o ndre 80.\nDu 1er au 3e, on monte 2 étages : 20 marches par étage.\nDu 1er au 6e, on monte 5 étages : 5 × 20 = 100 marches.","opts":["80","100","120","60"]},"es":{"q":"Para subir del 1.er al 3.er piso hay 40 escalones. ¿Cuántos escalones hay para subir del 1.er al 6.º piso?","a":"100","w":"Reflejo: duplicar (3.º → 6.º) y responder 80.\nDel 1.º al 3.º se suben 2 pisos: 20 escalones por piso.\nDel 1.º al 6.º se suben 5 pisos: 5 × 20 = 100 escalones.","opts":["80","100","120","60"]}},{"cat":"pie","level":3,"fr":{"q":"Il faut 12 minutes pour couper une bûche en 4 morceaux. Combien de temps pour la couper en 6 morceaux ?","a":"20 minutes","w":"Le réflexe : la règle de trois, 18 minutes.\nPour 4 morceaux, il faut 3 coupes : 4 minutes par coupe.\nPour 6 morceaux, il faut 5 coupes : 5 × 4 = 20 minutes.","opts":["18 minutes","24 minutes","20 minutes","16 minutes"]},"es":{"q":"Se tarda 12 minutos en cortar un tronco en 4 trozos. ¿Cuánto se tarda en cortarlo en 6 trozos?","a":"20 minutos","w":"Reflejo: la regla de tres, 18 minutos.\nPara 4 trozos hacen falta 3 cortes: 4 minutos por corte.\nPara 6 trozos hacen falta 5 cortes: 5 × 4 = 20 minutos.","opts":["18 minutos","24 minutos","20 minutos","16 minutos"]}},{"cat":"pie","level":1,"fr":{"q":"Un homme marche sous une grosse averse, sans parapluie ni chapeau. Ses vêtements sont trempés, mais pas un seul de ses cheveux n'est mouillé. Comment est-ce possible ?","a":"Il est chauve","w":"Le réflexe : chercher une astuce compliquée.\nLa réponse est toute simple : il n'a pas de cheveux.\nIl est chauve, donc aucun cheveu ne peut être mouillé.","opts":["Il porte du gel","Il court très vite","La pluie est tiède","Il est chauve"]},"es":{"q":"Un hombre camina bajo un chaparrón, sin paraguas ni sombrero. Tiene la ropa empapada, pero no se le moja ni un pelo. ¿Cómo es posible?","a":"Es calvo","w":"Reflejo: buscar un truco complicado.\nLa respuesta es muy simple: no tiene pelo.\nEs calvo, así que ningún pelo se puede mojar.","opts":["Lleva gomi itesse moyenne sur tout le trajet ?","a":"40 km/h","w":"Piège : ce n'est pas 45 km/h\nAller : 1 h, retour : 2 h\n120 km en 3 h = 40 km/h","opts":["45 km/h","50 km/h","40 km/h","35 km/h"]},"es":{"q":"Haces 60 km de ida a 60 km/h y los 60 km de vuelta a 30 km/h. ¿Cuál es tu velocidad media en todo el trayecto?","a":"40 km/h","w":"Trampa: no es 45 km/h\nIda: 1 h, vuelta: 2 h\n120 km en 3 h = 40 km/h","opts":["45 km/h","50 km/h","40 km/h","35 km/h"]}},{"cat":"cal","level":2,"fr":{"q":"300 g de fromage coûtent 6 €. Quel est le prix au kilo ?","a":"20 €/kg","w":"100 g = 6 ÷ 3 = 2 €\n1 kg = 10 × 2 = 20 €","opts":["18 €/kg","24 €/kg","30 €/kg","20 €/kg"]},"es":{"q":"300 g de queso cuestan 6 €. ¿Cuál es el precio por kilo?","a":"20 €/kg","w":"100 g = 6 ÷ 3 = 2 €\n1 kg = 10 × 2 = 20 €","opts":["18 €/kg","24 €/kg","30 €/kg","20 €/kg"]}},{"cat":"cal","level":3,"fr":{"q":"Grande pizza : 12 parts pour 15 €. Combien coûte une part ?","a":"1,25 €","w":"15 ÷ 12 = 1 € reste 3 €\n3 € ÷ 12 = 0,25 €\nUne part : 1,25 €","opts":["1,25 €","1,20 €","1,50 €","1,30 €"]},"es":{"q":"Pizza familiar: 12 porciones por 15 €. ¿Cuánto cuesta cada porción?","a":"1,25 €","w":"15 ÷ 12 = 1 € y sobran 3 €\n3 € ÷ 12 = 0,25 €\nCada porción: 1,25 €","opts":["1,25 €","1,20 €","1,50 €","1,30 €"]}},{"cat":"cal","level":3,"fr":{"q":"2 peintres repeignent une pièce en 6 heures. Combien de temps faut-il à 3 peintres au même rythme ?","a":"4 h","w":"Piège : plus de peintres = moins de temps, pas 9 h\nTravail total : 2 × 6 = 12 heures-peintre\n12 ÷ 3 = 4 heures","opts":["9 h","4 h","3 h","5 h"]},"es":{"q":"2 pintores pintan una habitación en 6 horas. ¿Cuánto tardan 3 pintores al mismo ritmo?","a":"4 h","w":"Trampa: más pintores = menos tiempo, no 9 h\nTrabajo total: 2 × 6 = 12 horas-pintor\n12 ÷ 3 = 4 horas","opts":["9 h","4 h","3 h","5 h"]}},{"cat":"cal","level":3,"fr":{"q":"À minuit, un tiers des invités part. À 2 h, la moitié des restants part aussi. Il en reste 10. Combien étaient-ils au départ ?","a":"30 invités","w":"On remonte : avant 2 h, ils étaient 20\n20 = les deux tiers du groupe de départ\n20 ÷ 2 × 3 = 30 invités","opts":["40 invités","25 invités","30 invités","60 invités"]},"es":{"q":"A medianoche se va un tercio de los invitados. A las 2:00 se va la mitad de los que quedan. Quedan 10. ¿Cuántos eran al principio?","a":"30 invitados","w":"Vamos hacia atrás: antes de las 2:00 eran 20\n20 son dos tercios del grupo inicial\n20 ÷ 2 × 3 = 30 invitados","opts":["40 invitados","25 invitados","30 invitados","60 invitados"]}},{"cat":"cal","level":3,"fr":{"q":"Combien de jours du 1er mars au 1er juin (1er juin non compris) ?","a":"92 jours","w":"Mars 31 + avril 30 + mai 31\n= 92 jours","opts":["90 jours","91 jours","93 jours","92 jours"]},"es":{"q":"¿Cuántos días hay del 1 de marzo al 1 de junio (sin contar el 1 de junio)?","a":"92 días","w":"Marzo 31 + abril 30 + mayo 31\n= 92 días","opts":["90 días","91 días","93 días","92 días"]}},{"cat":"cal","level":3,"fr":{"q":"Offre « le 2e à moitié prix » sur deux articles à 40 €. Quelle réduction totale, en pourcentage ?","a":"25 %","w":"Piège : ce n'est pas 50 %\nTu payes 40 + 20 = 60 € au lieu de 80 €\n20 ÷ 80 = 25 %","opts":["25 %","50 %","20 %","30 %"]},"es":{"q":"Oferta «la 2.ª unidad a mitad de precio» en dos artículos de 40 €. ¿Qué descuento total supone, en porcentaje?","a":"25 %","w":"Trampa: no es un 50 %\nPagas 40 + 20 = 60 € en vez de 80 €\n20 ÷ 80 = 25 %","opts":["25 %","50 %","20 %","30 %"]}},{"cat":"cal","level":3,"fr":{"q":"Combien d'années bissextiles entre 2001 et 2024 inclus ?","a":"6 années","w":"Bissextiles : 2004, 2008, 2012, 2016, 2020, 2024\nSoit 6 années","opts":["5 années","6 années","7 années","8 années"]},"es":{"q":"¿Cuántos años bisiestos hay entre 2001 y 2024, ambos incluidos?","a":"6 años","w":"Bisiestos: 2004, 2008, 2012, 2016, 2020 y 2024\nEn total, 6 años","opts":["5 años","6 años","7 años","8 años"]}},{"cat":"cal","level":2,"fr":{"q":"Un taxi facture 3 € de prise en charge puis 1,50 € par km. Combien pour 12 km ?","a":"21 €","w":"12 × 1,50 = 18 €\n18 + 3 = 21 €","opts":["18 €","19,50 €","21 €","22,50 €"]},"es":{"q":"Un taxi cobra 3 € de bajada de bandera y 1,50 € por km. ¿Cuánto cuesta un trayecto de 12 km?","a":"21 €","w":"12 × 1,50 = 18 €\n18 + 3 = 21 €","opts":["18 €","19,50 €","21 €","22,50 €"]}},{"cat":"seq","level":1,"fr":{"q":"Main est à gant ce que pied est à… ?","a":"Chaussure","w":"On enfile un gant sur la main.\nEt sur le pied, on enfile une chaussure !","opts":["Chaussure","Jambe","Orteil","Genou"]},"es":{"q":"Mano es a guante lo que pie es a… ?","a":"Zapato","w":"El guante se pone en la mano.\nY en el pie, ¡el zapato!","opts":["Zapato","Pierna","Dedo","Rodilla"]}},{"cat":"seq","level":1,"fr":{"q":"Oiseau est à nid ce que abeille est à… ?","a":"Ruche","w":"L'oiseau vit dans un nid.\nL'abeille, elle, vit dans une ruche.","opts":["Fleur","Ruche","Miel","Terrier"]},"es":{"q":"Pájaro es a nido lo que abeja es a… ?","a":"Colmena","w":"El pájaro vive en el nido.\nLa abeja vive en la colmena.","opts":["Flor","Colmena","Miel","Madriguera"]}},{"cat":"seq","level":1,"fr":{"q":"Chaud est à froid ce que haut est à… ?","a":"Bas","w":"Ce sont des contraires.\nLe contraire de haut, c'est bas.","opts":["Grand","Long","Bas","Fort"]},"es":{"q":"Caliente es a frío lo que arriba es a… ?","a":"Abajo","w":"Son contrarios.\nLo contrario de arriba es abajo.","opts":["Encima","Lejos","Abajo","Delante"]}},{"cat":"seq","level":2,"fr":{"q":"Écrivain est à livre ce que compositeur est à… ?","a":"Musique","w":"L'écrivain crée un livre.\nLe compositeur crée de la musique.","opts":["Piano","Orchestre","Chef","Musique"]},"es":{"q":"Escritor es a libro lo que compositor es a… ?","a":"Música","w":"El escritor crea libros.\nEl compositor crea música.","opts":["Piano","Orquesta","Director","Música"]}},{"cat":"seq","level":1,"fr":{"q":"Chien est à aboyer ce que chat est à… ?","a":"Miauler","w":"Le chien aboie, le chat miaule.\nHennir, c'est pour le cheval !","opts":["Miauler","Hennir","Bêler","Rugir"]},"es":{"q":"Perro es a ladrar lo que gato es a… ?","a":"Maullar","w":"El perro ladra y el gato maúlla.\n¡Relinchar es cosa del caballo!","opts":["Maullar","Relinchar","Balar","Rugir"]}},{"cat":"seq","level":2,"fr":{"q":"Veau est à vache ce que poulain est à… ?","a":"Jument","w":"Piège : on dit « cheval » par réflexe.\nLe veau est le petit de la vache, donc il faut la mère du poulain : la jument.","opts":["Cheval","Jument","Âne","Chèvre"]},"es":{"q":"Ternero es a vaca lo que potro es a… ?","a":"Yegua","w":"Trampa: sale «caballo» sin pensar.\nEl ternero es la cría de la vaca, así que buscamos la madre del potro: la yegua.","opts":["Caballo","Yegua","Burro","Cabra"]}},{"cat":"seq","level":1,"fr":{"q":"Œil est à voir ce que nez est à… ?","a":"Sentir","w":"On voit avec les yeux.\nOn sent les odeurs avec le nez.","opts":["Toucher","Goûter","Sentir","Entendre"]},"es":{"q":"Ojo es a ver lo que nariz es a… ?","a":"Oler","w":"Con los ojos vemos.\nCon la nariz olemos.","opts":["Tocar","Saborear","Oler","Oír"]}},{"cat":"seq","level":1,"fr":{"q":"Lundi est à mardi ce que janvier est à… ?","a":"Février","w":"Mardi vient juste après lundi.\nJuste après janvier, c'est février.","opts":["Décembre","Mars","Mercredi","Février"]},"es":{"q":"Lunes es a martes lo que enero es a… ?","a":"Febrero","w":"Martes va justo después del lunes.\nJusto después de enero viene febrero.","opts":["Diciembre","Marzo","Miércoles","Febrero"]}},{"cat":"seq","level":2,"fr":{"q":"Raisin est à vin ce que pomme est à… ?","a":"Cidre","w":"On fait fermenter le raisin pour le vin.\nAvec la pomme fermentée, on fait du cidre.","opts":["Cidre","Bière","Compote","Champagne"]},"es":{"q":"Uva es a vino lo que manzana es a… ?","a":"Sidra","w":"La uva fermentada da vino.\nLa manzana fermentada da sidra.","opts":["Sidra","Cerveza","Compota","Cava"]}},{"cat":"seq","level":1,"fr":{"q":"Médecin est à hôpital ce que professeur est à… ?","a":"École","w":"C'est le lieu de travail.\nLe médecin travaille à l'hôpital, le prof à l'école.","opts":["Livre","École","Élève","Tableau"]},"es":{"q":"Médico es a hospital lo que profesor es a… ?","a":"Escuela","w":"Es el lugar de trabajo.\nEl médico trabaja en el hospital y el profe en la escuela.","opts":["Libro","Escuela","Alumno","Pizarra"]}},{"cat":"seq","level":3,"fr":{"q":"A est à Z ce que B est à… ?","a":"Y","w":"A est la 1re lettre, Z la dernière.\nB est la 2e lettre, donc on prend l'avant-dernière : Y.","opts":["C","X","Y","W"]},"es":{"q":"A es a Z lo que B es a… ?","a":"Y","w":"La A es la primera letra y la Z la última.\nLa B es la segunda, así que toca la penúltima: Y.","opts":["C","X","Y","W"]}},{"cat":"seq","level":1,"fr":{"q":"Minute est à heure ce que mois est à… ?","a":"Année","w":"Une heure contient des minutes.\nUne année contient des mois.","opts":["Semaine","Jour","Siècle","Année"]},"es":{"q":"Minuto es a hora lo que mes es a… ?","a":"Año","w":"Una hora está hecha de minutos.\nUn año está hecho de meses.","opts":["Semana","Día","Siglo","Año"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : pomme, banane, carotte, cerise.","a":"Carotte","w":"Trois fruits et un légume.\nLa carotte est l'intruse.","opts":["Carotte","Pomme","Banane","Cerise"]},"es":{"q":"Encuentra al intruso: manzana, plátano, zanahoria, cereza.","a":"Zanahoria","w":"Tres frutas y una hortaliza.\nLa zanahoria sobra.","opts":["Zanahoria","Manzana","Plátano","Cereza"]}},{"cat":"seq","level":2,"fr":{"q":"Trouve l'intrus : dauphin, requin, baleine, orque.","a":"Requin","w":"Ils vivent tous dans la mer, mais un seul est un poisson.\nDauphin, baleine et orque sont des mammifères.","opts":["Dauphin","Requin","Baleine","Orque"]},"es":{"q":"Encuentra al intruso: delfín, tiburón, ballena, orca.","a":"Tiburón","w":"Todos viven en el mar, pero solo uno es un pez.\nDelfín, ballena y orca son mamíferos.","opts":["Delfín","Tiburón","Ballena","Orca"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : Mercure, Vénus, Lune, Mars.","a":"Lune","w":"Mercure, Vénus et Mars sont des planètes.\nLa Lune est un satellite de la Terre.","opts":["Mercure","Vénus","Lune","Mars"]},"es":{"q":"Encuentra al intruso: Mercurio, Venus, Luna, Marte.","a":"Luna","w":"Mercurio, Venus y Marte son planetas.\nLa Luna es un satélite de la Tierra.","opts":["Mercurio","Venus","Luna","Marte"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : triangle, carré, cercle, rectangle.","a":"Cercle","w":"Le cercle est le seul sans angle ni côté droit.\nLes trois autres sont des polygones.","opts":["Triangle","Carré","Rectangle","Cercle"]},"es":{"q":"Encuentra al intruso: triángulo, cuadrado, círculo, rectángulo.","a":"Círculo","w":"El círculo es el único sin ángulos ni lados rectos.\nLos otros tres son polígonos.","opts":["Triángulo","Cuadrado","Rectángulo","Círculo"]}},{"cat":"seq","level":2,"fr":{"q":"Trouve l'intrus : violon, guitare, flûte, harpe.","a":"Flûte","w":"Violon, guitare et harpe sont des instruments à cordes.\nLa flûte est un instrument à vent.","opts":["Flûte","Violon","Guitare","Harpe"]},"es":{"q":"Encuentra al intruso: violín, guitarra, flauta, arpa.","a":"Flauta","w":"Violín, guitarra y arpa son de cuerda.\nLa flauta es de viento.","opts":["Flauta","Violín","Guitarra","Arpa"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : autruche, aigle, pigeon, moineau.","a":"Autruche","w":"Ce sont tous des oiseaux.\nMais l'autruche est la seule qui ne vole pas.","opts":["Aigle","Autruche","Pigeon","Moineau"]},"es":{"q":"Encuentra al intruso: avestruz, águila, paloma, gorrión.","a":"Avestruz","w":"Todos son aves.\nPero el avestruz es el único que no vuela.","opts":["Águila","Avestruz","Paloma","Gorrión"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : Rome, Lisbonne, Barcelone, Berlin.","a":"Barcelone","w":"Rome, Lisbonne et Berlin sont des capitales de pays.\nBarcelone est la capitale de la Catalogne, pas d'un État.","opts":["Rome","Lisbonne","Barcelone","Berlin"]},"es":{"q":"Encuentra al intruso: Roma, Lisboa, Barcelona, Berlín.","a":"Barcelona","w":"Roma, Lisboa y Berlín son capitales de país.\nBarcelona es capital de Cataluña, no de un Estado.","opts":["Roma","Lisboa","Barcelona","Berlín"]}},{"cat":"seq","level":2,"fr":{"q":"Trouve l'intrus : araignée, fourmi, mouche, abeille.","a":"Araignée","w":"Fourmi, mouche et abeille sont des insectes à 6 pattes.\nL'araignée a 8 pattes : ce n'est pas un insecte.","opts":["Fourmi","Mouche","Abeille","Araignée"]},"es":{"q":"Encuentra al intruso: araña, hormiga, mosca, abeja.","a":"Araña","w":"Hormiga, mosca y abeja son insectos de 6 patas.\nLa araña tiene 8: no es un insecto.","opts":["Hormiga","Mosca","Abeja","Araña"]}},{"cat":"seq","level":3,"fr":{"q":"Pour un botaniste, quel est l'intrus : tomate, avocat, concombre, laitue ?","a":"Laitue","w":"Piège : on les range tous au rayon légumes.\nMais tomate, avocat et concombre sont botaniquement des fruits (ils ont des graines). La laitue, ce sont des feuilles.","opts":["Laitue","Tomate","Avocat","Concombre"]},"es":{"q":"Para un botánico, ¿cuál es el intruso: tomate, aguacate, pepino, lechuga?","a":"Lechuga","w":"Trampa: todos parecen verduras.\nPero tomate, aguacate y pepino son frutos para la botánica (tienen semillas). La lechuga son hojas.","opts":["Lechuga","Tomate","Aguacate","Pepino"]}},{"cat":"seq","level":3,"fr":{"q":"Trouve l'intrus : janvier, mars, juin, août.","a":"Juin","w":"Janvier, mars et août ont 31 jours.\nJuin n'en a que 30.","opts":["Janvier","Juin","Mars","Août"]},"es":{"q":"Encuentra al intruso: enero, marzo, junio, agosto.","a":"Junio","w":"Enero, marzo y agosto tienen 31 días.\nJunio solo tiene 30.","opts":["Enero","Junio","Marzo","Agosto"]}},{"cat":"seq","level":1,"fr":{"q":"Trouve l'intrus : football, rugby, golf, volley.","a":"Golf","w":"Football, rugby et volley se jouent en équipe.\nLe golf est un sport individuel.","opts":["Football","Rugby","Golf","Volley"]},"es":{"q":"Encuentra al intruso: fútbol, rugby, golf, voleibol.","a":"Golf","w":"Fútbol, rugby y voleibol son deportes de equipo.\nEl golf es individual.","opts":["Fútbol","Rugby","Golf","Voleibol"]}},{"cat":"seq","level":2,"fr":{"q":"Trouve l'intrus : Seine, Loire, Rhône, Léman.","a":"Léman","w":"La Seine, la Loire et le Rhône sont des fleuves.\nLe Léman est un lac.","opts":["Seine","Loire","Rhône","Léman"]},"es":{"q":"Encuentra al intruso: Sena, Loira, Ródano, Lemán.","a":"Lemán","w":"El Sena, el Loira y el Ródano son ríos.\nEl Lemán es un lago.","opts":["Sena","Loira","Ródano","Lemán"]}},{"cat":"seq","level":2,"fr":{"q":"Si A=1, B=2, C=3… quel mot s'écrit 3-1-6-5 ?","a":"CAFÉ","w":"3 = C, 1 = A, 6 = F, 5 = E.\nÇa donne CAFÉ.","opts":["CAFÉ","CAGE","FACE","BAIE"]},"es":{"q":"Si A=1, B=2, C=3… ¿qué palabra se escribe 3-1-6-5?","a":"CAFÉ","w":"3 = C, 1 = A, 6 = F, 5 = E.\nSale CAFÉ.","opts":["CAFÉ","CARA","CAMA","CASA"]}},{"cat":"seq","level":3,"fr":{"q":"Dans un code, CHAT s'écrit DIBU (chaque lettre avance d'un cran). Comment s'écrit CHIEN ?","a":"DIJFO","w":"On remplace chaque lettre par la suivante.\nC→D, H→I, I→J, E→F, N→O : DIJFO.","opts":["DIJFN","DIJFO","BGHDM","DJIFO"]},"es":{"q":"En un código, GATO se escribe HBUP (cada letra avanza una posición). ¿Cómo se escribe PERRO?","a":"QFSSP","w":"Cada letra se cambia por la siguiente.\nP→Q, E→F, R→S, R→S, O→P: QFSSP.","opts":["QFSSO","QFSSP","OEQQN","QFRRP"]}},{"cat":"seq","level":1,"fr":{"q":"Lis le prénom « NOËL » à l'envers. Quel prénom obtiens-tu ?","a":"Léon","w":"N-O-Ë-L lu de droite à gauche : L-E-O-N.\nNoël devient Léon !","opts":["Noé","Lino","Léon","Léo"]},"es":{"q":"Lee la palabra «AMOR» al revés. ¿Qué ciudad sale?","a":"Roma","w":"A-M-O-R de derecha a izquierda: R-O-M-A.\n¡Amor se convierte en Roma!","opts":["Mora","Omar","Roma","Ramo"]}},{"cat":"seq","level":1,"fr":{"q":"Lequel de ces mots se lit pareil dans les deux sens ?","a":"Kayak","w":"C'est un palindrome.\nK-A-Y-A-K, de gauche à droite comme de droite à gauche.","opts":["Rasoir","Racine","Rideau","Kayak"]},"es":{"q":"¿Cuál de estas palabras se lee igual en los dos sentidos?","a":"Reconocer","w":"Es un palíndromo.\nR-E-C-O-N-O-C-E-R se lee igual al derecho y al revés.","opts":["Recordar","Reconstruir","Recoger","Reconocer"]}},{"cat":"seq","level":1,"fr":{"q":"Quel animal se cache dans le mot « CHÂTEAU » ?","a":"Chat","w":"CHÂT-EAU : le chat est au début du mot.\nPas de rat ni de taureau caché dedans !","opts":["Chat","Rat","Taureau","Chien"]},"es":{"q":"¿Qué animal se esconde en la palabra «HERMOSO»?","a":"Oso","w":"HERM-OSO: el oso está al final.\nNi mono ni toro por ningún lado.","opts":["Oso","Mono","Ratón","Toro"]}},{"cat":"seq","level":2,"fr":{"q":"Quel mot est une anagramme de « CHIEN » (mêmes lettres, autre ordre) ?","a":"Niche","w":"C-H-I-E-N donne N-I-C-H-E.\nEt le chien dort dans sa niche !","opts":["Chêne","Niche","Nièce","Hiver"]},"es":{"q":"¿Qué palabra es un anagrama de «MONJA» (mismas letras, otro orden)?","a":"Jamón","w":"M-O-N-J-A reordenado da J-A-M-O-N.\n¡De monja a jamón!","opts":["Mojado","Jamón","Manjar","Monte"]}},{"cat":"seq","level":2,"fr":{"q":"Qu'est-ce qu'on trouve une fois dans une minute, deux fois dans un moment, et jamais dans cent ans ?","a":"La lettre M","w":"Il fallait regarder les mots, pas le temps !\nMinute : 1 M, moment : 2 M, cent ans : aucun M.","opts":["La lettre E","Une seconde","La lettre M","La lettre N"]},"es":{"q":"¿Qué hay una vez en un minuto, dos veces en un momento y ninguna en cien años?","a":"La letra M","w":"¡Había que mirar las palabras, no el tiempo!\nMinuto: 1 M, momento: 2 M, cien años: ninguna.","opts":["La letra O","Un segundo","La letra M","La letra N"]}},{"cat":"seq","level":2,"fr":{"q":"Dans un code, LUNDI s'écrit 12345 (L=1, U=2, N=3…). Comment s'écrit « NUL » ?","a":"321","w":"N = 3, U = 2, L = 1.\nDonc NUL = 321.","opts":["123","312","231","321"]},"es":{"q":"En un código, MARTES se escribe 123456 (M=1, A=2, R=3…). ¿Cómo se escribe «MESA»?","a":"1562","w":"M = 1, E = 5, S = 6, A = 2.\nAsí que MESA = 1562.","opts":["1652","1462","1526","1562"]}},{"cat":"seq","level":2,"fr":{"q":"Si A=1, B=2, C=3… quelle lettre vaut 13 ?","a":"M","w":"A à J, c'est 1 à 10. Puis K=11, L=12, M=13.\nM est pile au milieu de l'alphabet.","opts":["M","L","N","K"]},"es":{"q":"Si A=1, B=2, C=3… ¿qué letra vale 13?","a":"M","w":"De la A a la J van del 1 al 10. Luego K=11, L=12, M=13.\n(Contando el alfabeto sin la Ñ, claro.)","opts":["M","L","N","K"]}},{"cat":"seq","level":3,"fr":{"q":"En écrivant les nombres en toutes lettres (un, deux, trois…), quel est le premier qui contient la lettre A ?","a":"4","w":"Un, deux, trois : pas de A.\nQuatre : le voilà !","opts":["8","4","10","1000"]},"es":{"q":"Escribiendo los números con letras (uno, dos, tres…), ¿cuál es el primero que lleva la letra A?","a":"4","w":"Uno, dos, tres: ninguna A.\nCuatro: ¡ahí está!","opts":["8","4","10","1000"]}},{"cat":"seq","level":2,"fr":{"q":"Aujourd'hui, on est mercredi. Quel jour serons-nous dans 10 jours ?","a":"Samedi","w":"Dans 7 jours, on retombe sur mercredi.\nPlus 3 jours : samedi.","opts":["Vendredi","Dimanche","Samedi","Mardi"]},"es":{"q":"Hoy es miércoles. ¿Qué día será dentro de 10 días?","a":"Sábado","w":"Dentro de 7 días vuelve a ser miércoles.\nTres días más: sábado.","opts":["Viernes","Domingo","Sábado","Martes"]}},{"cat":"seq","level":2,"fr":{"q":"Aujourd'hui, c'est lundi. Quel jour est le lendemain d'après-demain ?","a":"Jeudi","w":"Après-demain, c'est mercredi.\nSon lendemain : jeudi.","opts":["Mercredi","Vendredi","Mardi","Jeudi"]},"es":{"q":"Hoy es lunes. ¿Qué día es el día siguiente a pasado mañana?","a":"Jueves","w":"Pasado mañana es miércoles.\nEl día siguiente: jueves.","opts":["Miércoles","Viernes","Martes","Jueves"]}},{"cat":"seq","level":3,"fr":{"q":"Aujourd'hui, c'est lundi. Quel jour était-ce il y a 100 jours ?","a":"Samedi","w":"98 jours, c'est 14 semaines pile : on retombe sur un lundi.\nEncore 2 jours en arrière : samedi.","opts":["Samedi","Lundi","Jeudi","Mercredi"]},"es":{"q":"Hoy es lunes. ¿Qué día fue hace 100 días?","a":"Sábado","w":"98 días son 14 semanas justas: otra vez lunes.\nDos días más atrás: sábado.","opts":["Sábado","Lunes","Jueves","Miércoles"]}},{"cat":"seq","level":3,"fr":{"q":"Dans une année non bissextile, le 1er mars tombe un mardi. Quel jour tombait le 1er février ?","a":"Mardi","w":"Février a 28 jours, soit exactement 4 semaines.\nLe 1er février tombe donc aussi un mardi.","opts":["Lundi","Mardi","Dimanche","Mercredi"]},"es":{"q":"En un año no bisiesto, el 1 de marzo cae en martes. ¿Qué día cayó el 1 de febrero?","a":"Martes","w":"Febrero tiene 28 días: 4 semanas exactas.\nAsí que el 1 de febrero también fue martes.","opts":["Lunes","Martes","Domingo","Miércoles"]}},{"cat":"seq","level":2,"fr":{"q":"Si Noël tombe un vendredi, quel jour tombe le jour de l'An suivant ?","a":"Vendredi","w":"Du 25 décembre au 1er janvier, il y a 7 jours.\nUne semaine pile : encore un vendredi.","opts":["Samedi","Jeudi","Vendredi","Dimanche"]},"es":{"q":"Si Navidad cae en viernes, ¿qué día cae el Año Nuevo siguiente?","a":"Viernes","w":"Del 25 de diciembre al 1 de enero hay 7 días.\nUna semana justa: otra vez viernes.","opts":["Sábado","Jueves","Viernes","Domingo"]}},{"cat":"seq","level":1,"fr":{"q":"Il est exactement 3 h. Quel angle forment les aiguilles de l'horloge ?","a":"90°","w":"La petite sur le 3, la grande sur le 12.\nUn quart de tour : un angle droit, 90°.","opts":["45°","180°","30°","90°"]},"es":{"q":"Son exactamente las 3:00. ¿Qué ángulo forman las agujas del reloj?","a":"90°","w":"La pequeña en el 3, la grande en el 12.\nUn cuarto de vuelta: ángulo recto, 90°.","opts":["45°","180°","30°","90°"]}},{"cat":"seq","level":3,"fr":{"q":"Combien de fois les deux aiguilles d'une horloge se superposent-elles en 12 heures ?","a":"11","w":"Piège : on répond 12 par réflexe.\nLa superposition de 11 h 59 n'existe pas : elle tombe pile à midi. Donc 11 fois.","opts":["11","12","24","10"]},"es":{"q":"¿Cuántas veces se superponen las dos agujas de un reloj en 12 horas?","a":"11","w":"Trampa: sale 12 sin pensar.\nEntre las 11 y las 12 no se cruzan hasta las 12 en punto. Así que son 11.","opts":["11","12","24","10"]}},{"cat":"seq","level":3,"fr":{"q":"Une horloge sans chiffres, vue dans un miroir, semble indiquer 3 h. Quelle heure est-il vraiment ?","a":"9 h","w":"Le miroir inverse la gauche et la droite.\nL'aiguille qui semble sur le 3 est en réalité sur le 9.","opts":["3 h","9 h","6 h","12 h"]},"es":{"q":"Un reloj sin números, visto en un espejo, parece marcar las 3:00. ¿Qué hora es de verdad?","a":"Las 9:00","w":"El espejo invierte izquierda y derecha.\nLa aguja que parece estar en el 3 está en realidad en el 9.","opts":["Las 3:00","Las 9:00","Las 6:00","Las 12:00"]}},{"cat":"seq","level":2,"fr":{"q":"Ta montre retarde de 10 minutes. Elle indique 8 h 50. Quelle heure est-il vraiment ?","a":"9 h 00","w":"Piège : retarder, c'est être en arrière.\nL'heure réelle est 10 minutes plus tard : 9 h 00.","opts":["8 h 40","8 h 50","9 h 00","9 h 10"]},"es":{"q":"Tu reloj va 10 minutos atrasado. Marca las 8:50. ¿Qué hora es de verdad?","a":"Las 9:00","w":"Trampa: atrasado significa que se queda corto.\nLa hora real es 10 minutos más: las 9:00.","opts":["Las 8:40","Las 8:50","Las 9:00","Las 9:10"]}},{"cat":"seq","level":1,"fr":{"q":"Anne est plus grande que Béa. Béa est plus grande que Clara. Qui est la plus petite ?","a":"Clara","w":"Ordre : Anne, puis Béa, puis Clara.\nClara est la plus petite.","opts":["Anne","Béa","Impossible à savoir","Clara"]},"es":{"q":"Ana es más alta que Bea. Bea es más alta que Clara. ¿Quién es la más baja?","a":"Clara","w":"Orden: Ana, luego Bea, luego Clara.\nClara es la más baja.","opts":["Ana","Bea","No se puede saber","Clara"]}},{"cat":"seq","level":2,"fr":{"q":"Paul est plus vieux que Marc. Marc est plus vieux que Luc. Luc est plus vieux que Jean. Qui est le deuxième plus vieux ?","a":"Marc","w":"Ordre : Paul, Marc, Luc, Jean.\nLe deuxième, c'est Marc.","opts":["Marc","Paul","Luc","Jean"]},"es":{"q":"Pablo es mayor que Marcos. Marcos es mayor que Lucas. Lucas es mayor que Juan. ¿Quién es el segundo mayor?","a":"Marcos","w":"Orden: Pablo, Marcos, Lucas, Juan.\nEl segundo es Marcos.","opts":["Marcos","Pablo","Lucas","Juan"]}},{"cat":"seq","level":1,"fr":{"q":"Trois amis sur un banc. Léa est à gauche de Tom, et Tom est à gauche de Max. Qui est au milieu ?","a":"Tom","w":"De gauche à droite : Léa, Tom, Max.\nTom est au milieu.","opts":["Léa","Tom","Max","Personne"]},"es":{"q":"Tres amigos en un banco. Lea está a la izquierda de Tomás, y Tomás a la izquierda de Max. ¿Quién está en medio?","a":"Tomás","w":"De izquierda a derecha: Lea, Tomás, Max.\nTomás está en medio.","opts":["Lea","Tomás","Max","Nadie"]}},{"cat":"seq","level":2,"fr":{"q":"Dans une file d'attente, Julie est 4e en partant du début et 4e en partant de la fin. Combien de personnes dans la file ?","a":"7","w":"Piège : 4 + 4 = 8, mais Julie est comptée deux fois.\n3 devant, Julie, 3 derrière : 7.","opts":["8","6","7","9"]},"es":{"q":"En una cola, Julia es la 4.ª empezando por delante y la 4.ª empezando por detrás. ¿Cuántas personas hay?","a":"7","w":"Trampa: 4 + 4 = 8, pero Julia se cuenta dos veces.\n3 delante, Julia, 3 detrás: 7.","opts":["8","6","7","9"]}},{"cat":"seq","level":1,"fr":{"q":"Le fils de la sœur de ta mère est ton… ?","a":"Cousin","w":"La sœur de ta mère, c'est ta tante.\nSon fils est ton cousin.","opts":["Neveu","Oncle","Frère","Cousin"]},"es":{"q":"El hijo de la hermana de tu madre es tu… ?","a":"Primo","w":"La hermana de tu madre es tu tía.\nSu hijo es tu primo.","opts":["Sobrino","Tío","Hermano","Primo"]}},{"cat":"seq","level":2,"fr":{"q":"Le père du frère de ton père est ton… ?","a":"Grand-père","w":"Le frère de ton père est ton oncle.\nLe père de ton oncle, c'est aussi le père de ton père : ton grand-père.","opts":["Grand-père","Oncle","Arrière-grand-père","Cousin"]},"es":{"q":"El padre del hermano de tu padre es tu… ?","a":"Abuelo","w":"El hermano de tu padre es tu tío.\nEl padre de tu tío es también el padre de tu padre: tu abuelo.","opts":["Abuelo","Tío","Bisabuelo","Primo"]}},{"cat":"seq","level":1,"fr":{"q":"Dans une course, Ana arrive avant Bruno mais après Carlos. Dani arrive dernier. Qui gagne ?","a":"Carlos","w":"Ordre d'arrivée : Carlos, Ana, Bruno, Dani.\nCarlos gagne.","opts":["Ana","Carlos","Bruno","Dani"]},"es":{"q":"En una carrera, Ana llega antes que Bruno pero después que Carlos. Dani llega el último. ¿Quién gana?","a":"Carlos","w":"Orden de llegada: Carlos, Ana, Bruno, Dani.\nGana Carlos.","opts":["Ana","Carlos","Bruno","Dani"]}},{"cat":"seq","level":2,"fr":{"q":"Ana habite au-dessus de Ben. Ben habite au-dessus de Carl. Dora habite entre Ana et Ben. Qui habite juste au-dessus de Ben ?","a":"Dora","w":"De haut en bas : Ana, Dora, Ben, Carl.\nJuste au-dessus de Ben, c'est Dora.","opts":["Ana","Carl","Dora","Personne"]},"es":{"q":"Ana vive encima de Ben. Ben vive encima de Carlos. Dora vive entre Ana y Ben. ¿Quién vive justo encima de Ben?","a":"Dora","w":"De arriba abajo: Ana, Dora, Ben, Carlos.\nJusto encima de Ben vive Dora.","opts":["Ana","Carlos","Dora","Nadie"]}},{"cat":"seq","level":2,"fr":{"q":"Tous les Blips sont des Blops. Tous les Blops sont verts. Les Blips sont donc… ?","a":"Verts","w":"Un Blip est un Blop, et un Blop est vert.\nDonc un Blip est forcément vert.","opts":["Bleus","Pas verts","On ne peut pas savoir","Verts"]},"es":{"q":"Todos los Blips son Blops. Todos los Blops son verdes. Entonces los Blips son… ?","a":"Verdes","w":"Un Blip es un Blop, y un Blop es verde.\nAsí que un Blip es verde seguro.","opts":["Azules","No verdes","No se puede saber","Verdes"]}},{"cat":"seq","level":3,"fr":{"q":"Tous les chats ont quatre pattes. Rex a quatre pattes. Que peut-on en conclure ?","a":"Rien de sûr","w":"Piège : on conclut vite que Rex est un chat.\nBeaucoup d'animaux ont quatre pattes sans être des chats. On ne peut rien conclure.","opts":["Rien de sûr","Rex est un chat","Rex n'est pas un chat","Rex est un chien"]},"es":{"q":"Todos los gatos tienen cuatro patas. Rex tiene cuatro patas. ¿Qué se puede concluir?","a":"Nada seguro","w":"Trampa: parece que Rex es un gato.\nMuchos animales tienen cuatro patas sin ser gatos. No se puede concluir nada.","opts":["Nada seguro","Rex es un gato","Rex no es un gato","Rex es un perro"]}},{"cat":"seq","level":1,"fr":{"q":"Tu regardes vers le nord et tu fais un quart de tour vers la droite. Vers où regardes-tu ?","a":"L'est","w":"En tournant à droite depuis le nord, on passe à l'est.\nComme les aiguilles d'une montre : N, E, S, O.","opts":["L'ouest","L'est","Le sud","Le nord"]},"es":{"q":"Miras al norte y giras un cuarto de vuelta a la derecha. ¿Hacia dónde miras?","a":"Al este","w":"Girando a la derecha desde el norte llegas al este.\nComo las agujas del reloj: N, E, S, O.","opts":["Al oeste","Al este","Al sur","Al norte"]}},{"cat":"seq","level":3,"fr":{"q":"Tu fais face au sud. Tu fais trois quarts de tour vers la droite. Vers où regardes-tu ?","a":"L'est","w":"Vers la droite depuis le sud : ouest, puis nord, puis est.\nTrois quarts de tour à droite = un quart de tour à gauche.","opts":["L'ouest","Le nord","L'est","Le sud"]},"es":{"q":"Miras al sur. Giras tres cuartos de vuelta a la derecha. ¿Hacia dónde miras?","a":"Al este","w":"A la derecha desde el sur: oeste, luego norte, luego este.\nTres cuartos a la derecha = un cuarto a la izquierda.","opts":["Al oeste","Al norte","Al este","Al sur"]}},{"cat":"seq","level":2,"fr":{"q":"Quelle lettre majuscule reste identique quand on la regarde dans un miroir ?","a":"A","w":"Le A est symétrique : sa gauche et sa droite sont pareilles.\nF, R et L apparaissent à l'envers.","opts":["F","R","L","A"]},"es":{"q":"¿Qué letra mayúscula se ve igual en un espejo?","a":"A","w":"La A es simétrica: su lado izquierdo y derecho son iguales.\nF, R y L se ven al revés.","opts":["F","R","L","A"]}},{"cat":"seq","level":3,"fr":{"q":"Quelle lettre majuscule reste la même si on la tourne à l'envers (demi-tour) ?","a":"N","w":"Tourné de 180°, le N reste un N.\nLe M devient un W, le E et le P ne ressemblent plus à rien.","opts":["N","M","E","P"]},"es":{"q":"¿Qué letra mayúscula sigue igual si le das media vuelta (180°)?","a":"N","w":"Girada 180°, la N sigue siendo una N.\nLa M se convierte en W, y la E y la P quedan raras.","opts":["N","M","E","P"]}},{"cat":"seq","level":1,"fr":{"q":"On fait faire un demi-tour à un « 6 » écrit sur une feuille. Quel chiffre voit-on ?","a":"9","w":"Tête en bas, le 6 devient un 9.\nC'est pour ça qu'on souligne parfois ces chiffres !","opts":["6","9","0","8"]},"es":{"q":"Le das media vuelta a un «6» escrito en un papel. ¿Qué número ves?","a":"9","w":"Boca abajo, el 6 se convierte en 9.\n¡Por eso a veces se subrayan!","opts":["6","9","0","8"]}},{"cat":"seq","level":2,"fr":{"q":"Le nombre romain « IX » lu dans un miroir devient « XI ». Combien vaut-il alors ?","a":"11","w":"IX = 9, mais dans le miroir on lit XI.\nX puis I : 10 + 1 = 11.","opts":["9","10","11","19"]},"es":{"q":"El número romano «IX» visto en un espejo se lee «XI». ¿Cuánto vale entonces?","a":"11","w":"IX = 9, pero en el espejo se lee XI.\nX y luego I: 10 + 1 = 11.","opts":["9","10","11","19"]}},{"cat":"seq","level":2,"fr":{"q":"Sur un dé, deux faces opposées font toujours 7. Quelle face est opposée au 2 ?","a":"5","w":"7 − 2 = 5.\nLe 1 est face au 6, le 3 face au 4.","opts":["4","6","1","5"]},"es":{"q":"En un dado, dos caras opuestas siempre suman 7. ¿Qué cara está opuesta al 2?","a":"5","w":"7 − 2 = 5.\nEl 1 está frente al 6 y el 3 frente al 4.","opts":["4","6","1","5"]}},{"cat":"cul","level":1,"fr":{"q":"Quelle ville est surnommée « la Ville lumière » ?","a":"Paris","w":"Paris, la Ville lumière !\nPour son éclairage public pionnier et son rayonnement intellectuel au siècle des Lumières.","opts":["Paris","Lyon","Marseille","Nice"]},"es":{"q":"¿Qué ciudad es conocida como «la Ciudad de la Luz»?","a":"París","w":"¡París, la Ciudad de la Luz!\nPor su alumbrado pionero y su papel en el Siglo de las Luces.","opts":["París","Lyon","Marsella","Niza"]}} za"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville se trouve la Mezquita, mosquée devenue cathédrale ?","a":"Cordoue","w":"Cordoue !\nLe piège, c'était Grenade, qui a l'Alhambra.\nLa Mezquita et sa forêt d'arcs rouges et blancs sont à Cordoue.","opts":["Grenade","Séville","Cordoue","Tolède"]},"es":{"q":"¿En qué ciudad está la Mezquita, convertida después en catedral?","a":"Córdoba","w":"¡Córdoba!\nLa trampa era Granada, que tiene la Alhambra.\nLa Mezquita, con su bosque de arcos rojos y blancos, está en Córdoba.","opts":["Granada","Sevilla","Córdoba","Toledo"]}},{"cat":"cul","level":2,"fr":{"q":"Quelle ville de Castille est célèbre pour son immense aqueduc romain en plein centre ?","a":"Ségovie","w":"Ségovie !\nSon aqueduc tient debout depuis près de 2 000 ans, sans le moindre mortier.","opts":["Ávila","Salamanque","Burgos","Ségovie"]},"es":{"q":"¿Qué ciudad castellana es famosa por su enorme acueducto romano en pleno centro?","a":"Segovia","w":"¡Segovia!\nSu acueducto lleva casi 2.000 años en pie sin una gota de argamasa.","opts":["Ávila","Salamanca","Burgos","Segovia"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle ville se trouve la Puerta del Sol, avec le kilomètre zéro des routes espagnoles ?","a":"Madrid","w":"Madrid !\nC'est aussi là qu'on mange les douze raisins devant l'horloge le 31 décembre.","opts":["Madrid","Barcelone","Séville","Tolède"]},"es":{"q":"¿En qué ciudad está la Puerta del Sol, con el kilómetro cero de las carreteras españolas?","a":"Madrid","w":"¡Madrid!\nY es allí donde se toman las uvas frente al reloj cada Nochevieja.","opts":["Madrid","Barcelona","Sevilla","Toledo"]}},{"cat":"cul","level":2,"fr":{"q":"Quel fleuve traverse Saragosse ?","a":"L'Èbre","w":"L'Èbre, le grand fleuve du nord-est de l'Espagne.\nIl passe au pied de la basilique du Pilar.","opts":["Le Douro","L'Èbre","Le Tage","Le Júcar"]},"es":{"q":"¿Qué río pasa por Zaragoza?","a":"El Ebro","w":"El Ebro, el gran río del nordeste de España.\nPasa a los pies de la basílica del Pilar.","opts":["El Duero","El Ebro","El Tajo","El Júcar"]}},{"cat":"cul","level":3,"fr":{"q":"Quel cours d'eau traverse Madrid ?","a":"Le Manzanares","w":"Le piège, c'était le Tage !\nIl passe à Tolède, pas à Madrid.\nMadrid est traversé par le modeste Manzanares.","opts":["Le Tage","L'Henares","Le Manzanares","Le Jarama"]},"es":{"q":"¿Qué río pasa por Madrid?","a":"El Manzanares","w":"¡La trampa era el Tajo!\nPasa por Toledo, no por Madrid.\nMadrid tiene el modesto Manzanares.","opts":["El Tajo","El Henares","El Manzanares","El Jarama"]}},{"cat":"cul","level":2,"fr":{"q":"Quel fleuve né en Espagne se jette dans l'Atlantique à Porto ?","a":"Le Douro","w":"Le Douro, Duero en espagnol.\nIl naît en Castille et finit à Porto, entouré des vignes du porto.\nLe Tage, lui, finit à Lisbonne.","opts":["Le Tage","Le Minho","Le Guadiana","Le Douro"]},"es":{"q":"¿Qué río nacido en España desemboca en el Atlántico en Oporto?","a":"El Duero","w":"El Duero, Douro en portugués.\nNace en Soria y termina en Oporto, entre viñedos de oporto.\nEl Tajo termina en Lisboa.","opts":["El Tajo","El Miño","El Guadiana","El Duero"]}},{"cat":"cul","level":1,"fr":{"q":"Quelle ville est surnommée « la Ville éternelle » ?","a":"Rome","w":"Rome, la Ville éternelle !\nLes Romains pensaient déjà que leur ville durerait pour toujours.","opts":["Rome","Athènes","Jérusalem","Venise"]},"es":{"q":"¿Qué ciudad es conocida como «la Ciudad Eterna»?","a":"Roma","w":"¡Roma, la Ciudad Eterna!\nLos propios romanos creían que su ciudad duraría para siempre.","opts":["Roma","Atenas","Jerusalén","Venecia"]}},{"cat":"cul","level":1,"fr":{"q":"Quel archipel espagnol se trouve au large de l'Afrique ?","a":"Les Canaries","w":"Les Canaries, face au Maroc.\nLes Açores sont portugaises et en plein Atlantique.","opts":["Les Baléares","Les Canaries","Les Açores","Les Columbretes"]},"es":{"q":"¿Qué archipiélago español está frente a la costa de África?","a":"Las Canarias","w":"Las Canarias, frente a Marruecos.\nLas Azores son portuguesas y están en pleno Atlántico.","opts":["Las Baleares","Las Canarias","Las Azores","Las Columbretes"]}},{"cat":"cul","level":3,"fr":{"q":"Quelle île des Canaries est célèbre pour ses vignes plantées dans la cendre volcanique et pour l'artiste César Manrique ?","a":"Lanzarote","w":"Lanzarote !\nÀ La Geria, chaque pied de vigne pousse dans un trou de cendre noire protégé par un muret.","opts":["Fuerteventura","La Gomera","Lanzarote","El Hierro"]},"es":{"q":"¿Qué isla canaria es famosa por sus viñas plantadas en ceniza volcánica y por el artista César Manrique?","a":"Lanzarote","w":"¡Lanzarote!\nEn La Geria, cada cepa crece en un hoyo de ceniza negra protegido por un muro de piedra.","opts":["Fuerteventura","La Gomera","Lanzarote","El Hierro"]}},{"cat":"cul","level":2,"fr":{"q":"Quelle ville espagnole est célèbre pour ses « maisons suspendues » au bord d'une falaise ?","a":"Cuenca","w":"Cuenca !\nSes casas colgadas surplombent les gorges du Huécar depuis le Moyen Âge.","opts":["Ronda","Teruel","Albarracín","Cuenca"]},"es":{"q":"¿Qué ciudad española es famosa por sus «casas colgadas» al borde de un precipicio?","a":"Cuenca","w":"¡Cuenca!\nSus casas colgadas se asoman a la hoz del Huécar desde la Edad Media.","opts":["Ronda","Teruel","Albarracín","Cuenca"]}},{"cat":"cul","level":1,"fr":{"q":"Comment s'appelle la côte touristique autour de Malaga ?","a":"La Costa del Sol","w":"La Costa del Sol, avec Marbella et Torremolinos.\nLa Costa Brava, c'est la Catalogne.","opts":["La Costa del Sol","La Costa Brava","La Costa Blanca","La Costa Dorada"]},"es":{"q":"¿Cómo se llama la costa turística alrededor de Málaga?","a":"La Costa del Sol","w":"La Costa del Sol, con Marbella y Torremolinos.\nLa Costa Brava está en Cataluña.","opts":["La Costa del Sol","La Costa Brava","La Costa Blanca","La Costa Dorada"]}},{"cat":"cul","level":3,"fr":{"q":"Quel parc national andalou est une immense zone humide, refuge de millions d'oiseaux ?","a":"Doñana","w":"Doñana, à l'embouchure
