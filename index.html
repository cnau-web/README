<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1430">
<title>Le Plus Nul de la Bande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,900&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: game-show night stage. One column (max 600px); sticky top bar in game; full-width stacked actions so buttons never collide. Single committed dark look. */
:root{
  --night:#0d1430; --night2:#172150; --paper:#fffaf1; --cream:#f5eedf; --ink:#171b38;
  --gold:#f4b73c; --gold-dk:#b9821a; --soft:#aab3dc; --muted:#666b8c; --line:#e6ddc9;
  --ok:#1f9d6a; --ok-bg:#e3f5ec; --bad:#e5484d;
  --seq:#13958a; --rap:#d63c8a; --str:#e5484d; --stg:#1f9d6a; --stb:#2d6be0; --sty:#e0a100; --stv:#8b5cf6; --eni:#7656e8; --pie:#de4a3f; --cal:#e07a17; --cul:#2d6be0;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 45% at 50% -8%,rgba(244,183,60,.20),transparent 70%),
  radial-gradient(circle at 50% 50%,transparent 38%,rgba(255,255,255,.035) 39% 41%,transparent 42%);
  background-size:100% 100%,52px 52px;background-attachment:fixed,scroll}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 36px;display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:10px;background:linear-gradient(var(--night) 75%,rgba(13,20,48,0))}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:14px;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.prog{min-width:0;text-align:center}
.prog .l1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:3px;margin-top:6px}
.segs i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.segs i.d{background:var(--gold)} .segs i.n{background:var(--paper)}
.lang{display:inline-flex;border-radius:999px;border:1px solid rgba(255,255,255,.2);overflow:hidden;height:40px}
.lang button{padding:0 14px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--soft)}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
@media (max-width:380px){.pill .t{display:none}.pill{padding:0 12px}}

/* hero */
.hero{position:relative;border-radius:26px;padding:34px 22px 28px;text-align:center;background:linear-gradient(160deg,var(--night2),#0f1838)}
.hero::before,.hero::after{content:"";position:absolute;inset:0;border-radius:26px;padding:7px;pointer-events:none;
  background:radial-gradient(circle,var(--gold) 2.6px,transparent 3.2px) 0 0/18px 18px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero::after{background-position:9px 9px;background-image:radial-gradient(circle,#fff3cf 2.6px,transparent 3.2px);animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,64px);line-height:.95;margin:10px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{display:block;font-style:italic;color:var(--gold);font-size:.62em;margin-top:4px}
.hero p{margin:10px auto 0;max-width:34ch;color:var(--soft)}

/* panels */
.sec{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.sec h2{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1}
.sec h2 .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--body);font-size:14px;font-weight:700;flex:none}
.hint{margin:0;color:var(--muted);font-size:14px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);height:50px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pl{display:inline-flex;align-items:center;gap:8px;background:var(--cream);border-radius:999px;padding:4px 4px 4px 4px;font-weight:600;max-width:100%}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pl .x:hover{background:#fff;color:var(--bad)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--pc);flex:none;font-size:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left;min-height:62px;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--cream);color:var(--c);flex:none}
.tile .ic svg{width:20px;height:20px}
.tile b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.tile small{color:var(--muted);font-size:12.5px}
.tile[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.tile[aria-pressed="true"] .ic{background:var(--c);color:#fff}
.tile.wide{grid-column:1/-1}
.tile.mix .ic{color:var(--ink)}
.tile.mix[aria-pressed="true"] .ic{color:#fff;background:conic-gradient(var(--seq) 0 20%,var(--eni) 0 40%,var(--pie) 0 60%,var(--cal) 0 80%,var(--cul) 0)}
.tile.mix[aria-pressed="true"]{border-color:var(--ink);background:var(--cream)}
@media (max-width:360px){.tiles{grid-template-columns:1fr}}

.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.preset{padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left;min-width:0}
.preset b{display:block;font-weight:700}
.preset small{color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.preset[aria-pressed="true"] small{color:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.stepper .lb{font-weight:600}
.ctl{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:44px;border-radius:12px;background:var(--cream);color:var(--ink);font-size:22px;font-weight:700;display:grid;place-items:center}
.val{min-width:2.6ch;text-align:center;font-family:var(--display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:40px;padding:0 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--cream);border-radius:14px;padding:12px 14px}
.sum b{font-family:var(--display);font-weight:900;font-size:22px}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px 0;text-align:left}
.link.warn{color:var(--bad)}

/* buttons */
.actions{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;border-radius:16px;font-weight:700;font-size:17px;text-align:center}
.btn.primary{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-dk)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-dk)}
.btn.ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(255,255,255,.28);min-height:50px;font-size:16px}
.btn.quiet{min-height:44px;font-size:15px;color:var(--soft);font-weight:600}
.sticky{position:sticky;bottom:0;z-index:5;margin-inline:-16px;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(13,20,48,0),var(--night) 40%)}
.err{margin:0;text-align:center;color:#ffb3ad;font-size:14px}

.resume{border:2px solid var(--gold);border-radius:22px;padding:18px;background:rgba(244,183,60,.08);display:flex;flex-direction:column;gap:12px}
.resume h3{margin:0;font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold)}
.resume p{margin:0;color:var(--soft)}

/* question card */
.card{background:var(--paper);color:var(--ink);border-radius:24px;padding:22px 20px;box-shadow:0 22px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.badge svg{width:18px;height:18px}
.q{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.25;text-wrap:balance}
.q.small{font-size:clamp(17px,4.5vw,19px);color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:460px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;min-width:0}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok)}
.opt.dim{opacity:.4}
.timer{display:flex;align-items:center;gap:14px;padding-top:14px;border-top:1px dashed var(--line)}
.ring{position:relative;width:66px;height:66px;border-radius:50%;flex:none}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring .tr{stroke:var(--cream)} .ring .pr{stroke:var(--c);transition:stroke-dashoffset 1s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.timer p{margin:0;color:var(--muted);font-size:14px}
.timer.low .pr{stroke:var(--bad)}
.timer.up p{color:var(--bad);font-weight:700}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ans{padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ans .a{font-family:var(--display);font-weight:900;font-size:clamp(28px,8.5vw,40px);line-height:1.1;color:var(--c);animation:pop .35s ease-out}
.expl{background:var(--cream);border-radius:16px;padding:14px 16px;white-space:pre-line;line-height:1.6;font-size:15.5px}
.expl .lbl{display:block;margin-bottom:4px}
.notice{margin:0;padding:10px 14px;border-radius:12px;background:rgba(244,183,60,.12);color:var(--gold);font-size:14px}

.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h3{margin:0;font-family:var(--display);font-weight:900;font-size:21px}
.quick{display:flex;gap:6px}
.quick button{height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:13px;font-weight:600;color:var(--soft)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pc{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid transparent;min-height:48px;font-weight:600;text-align:left;min-width:0}
.pc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ck{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;display:grid;place-items:center}
.pc[aria-pressed="true"]{background:rgba(31,157,106,.25);border-color:var(--ok)}
.pc[aria-pressed="true"] .ck{background:var(--ok);border-color:var(--ok)}
.pc[aria-pressed="true"] .ck::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}

/* scoreboard */
.board{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.06)}
.row .rk{font-family:var(--display);font-weight:900;color:var(--soft);text-align:center}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.row .sc{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.row.top1{background:rgba(244,183,60,.14)}
.row.last{background:rgba(229,72,77,.18);box-shadow:inset 0 0 0 2px var(--bad)}
.row.last .bar i{background:var(--bad)}
.tag{display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#ffb3ad;font-weight:700;vertical-align:middle}
.h2{margin:0;font-family:var(--display);font-weight:900;font-size:28px;line-height:1.1;text-wrap:balance}
.h2 small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}

/* verdict */
.verdict{text-align:center;align-items:center}
.verdict .lbl{color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-size:clamp(44px,14vw,72px);line-height:1;color:var(--bad);word-break:break-word;margin:6px 0}
.big.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.gage{width:100%;text-align:left;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 16px}
.gage .lbl{color:var(--gold);display:block;margin-bottom:4px}

/* menu sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,22,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box{width:100%;max-width:560px;background:var(--night2);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out;max-height:85vh;overflow:auto}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{margin:0;font-family:var(--display);font-weight:900;font-size:24px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);text-align:left;font-weight:600}
.mi small{color:var(--soft);font-weight:400}
.mi.danger{color:#ffb3ad}

.diffs{display:grid;gap:8px}
.diff{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left}
.diff b{display:block;font-weight:700}
.diff small{color:var(--muted);font-size:13px}
.diff[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.diff[aria-pressed="true"] small{color:var(--soft)}
.lvl{display:inline-flex;align-items:flex-end;gap:3px;flex:none}
.lvl i{width:6px;border-radius:2px;background:var(--line)}
.lvl i:nth-child(1){height:10px}.lvl i:nth-child(2){height:15px}.lvl i:nth-child(3){height:20px}
.lvl i.on{background:var(--gold)}
.diff:not([aria-pressed="true"]) .lvl i.on{background:var(--ink)}
.cardhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvl.dk{align-items:center}
.lvl.dk i{width:5px}.lvl.dk i:nth-child(1){height:8px}.lvl.dk i:nth-child(2){height:12px}.lvl.dk i:nth-child(3){height:16px}
.lvl.dk i.on{background:var(--c)}
.lvl .lt{margin-left:6px;font-size:12px;font-weight:600;color:var(--muted)}
.pill.code{font-family:var(--display);font-weight:900;letter-spacing:.14em;color:var(--gold)}
.errp{margin:0;color:var(--bad);font-weight:600;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--cream);padding:4px;border-radius:14px}
.tabs button{min-height:44px;border-radius:10px;font-weight:700;color:var(--muted);font-size:14px;padding:4px 8px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.field input{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);height:52px}
.field input.codein{text-transform:uppercase;letter-spacing:.35em;font-family:var(--display);font-weight:900;font-size:24px;text-align:center}
.codebig{font-family:var(--display);font-weight:900;font-size:clamp(52px,17vw,84px);letter-spacing:.14em;line-height:1;color:var(--ink);padding-left:.14em}
.lobby{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);min-width:0}
.lrow .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.away{opacity:.45}
.tg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--soft);flex:none}
.tg.gold{color:var(--gold)}
.hint2{margin:0;color:var(--soft);font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600;max-width:100%}
.dot .av{width:26px;height:26px;font-size:12px}
.dot.ok{background:rgba(31,157,106,.3)}
.opt.pick{cursor:pointer;text-align:left;color:var(--ink);font:inherit;font-weight:600}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.opt.sel .k{background:var(--c)}
.pc .nm small{display:block;color:var(--soft);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pc .nm small i{opacity:.7}
.pc.ro{cursor:default}
.who:has(small){grid-template-columns:1fr}
.mi-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cream);flex:none}
.mi-ic svg{width:22px;height:22px}
.diff[aria-pressed="true"] .mi-ic{background:var(--gold);color:var(--ink)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.invite{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px;text-align:left}
.invite input{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.buzzbox{align-items:center;text-align:center}
.buzz{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;margin:6px auto 4px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,52px);letter-spacing:.04em;
 background:radial-gradient(circle at 35% 28%,#ff8a7f,var(--bad) 55%,#a3262b);box-shadow:0 10px 0 #7d1d22,0 22px 40px rgba(0,0,0,.45);animation:pulse 1.4s ease-in-out infinite}
.buzz:active{transform:translateY(7px);box-shadow:0 3px 0 #7d1d22,0 10px 20px rgba(0,0,0,.4)}
@keyframes pulse{50%{box-shadow:0 10px 0 #7d1d22,0 0 0 14px rgba(229,72,77,.18),0 22px 40px rgba(0,0,0,.45)}}
.buzzed{margin:0;font-family:var(--display);font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);text-wrap:balance}
.tries{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font-size:14px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
.tries .okk{color:#7be0b5}.tries .ko{color:#ffb3ad}
.notice.bad{background:rgba(229,72,77,.15);color:#ffb3ad}
.pen{color:#ffb3ad;font-weight:700}
.dual{display:block;font-size:.8em;font-style:italic;font-weight:500;opacity:.72;margin-top:3px;font-family:var(--body)}
.q .dual{font-size:.72em}
.ans .a .dual{font-size:.55em;opacity:.8}
.gage .dual{color:var(--soft)}
.tg.lgt{color:var(--ink);background:var(--gold);padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.lang button{padding:0 11px}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,label,.opt,.pc,.tile,.diff,.preset,.chip{touch-action:manipulation}
button,.opt,.pc,.buzz{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input,textarea{font-size:16px!important}
.stroop{display:block;font-size:1.7em;font-weight:900;letter-spacing:.08em;margin-top:8px;font-family:var(--display)}
.dual .stroop{font-size:1.2em}
.seqblk{display:block;margin-top:10px;font-family:var(--body);font-weight:700;font-size:1.05em;letter-spacing:.12em;word-spacing:.2em;line-height:1.6;background:var(--cream);border-radius:12px;padding:8px 12px}
.dual .seqblk,.rq .seqblk{display:inline;background:none;padding:0;margin:0}
.rq .stroop{display:inline;font-size:1em;margin:0}
.btn svg{flex:none}
.btn.wa{background:#25d366;color:#08331b;box-shadow:0 4px 0 #1a9e4b;text-decoration:none}
.btn.ghost.dark{color:var(--ink);border-color:var(--line);min-height:46px;font-size:15px}
.sharerow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.sharegame.wa{color:#25d366;border-color:rgba(37,211,102,.6);text-decoration:none}
.sharehint{margin:10px auto 0!important;font-size:13px;max-width:30ch!important}
.sharegame{margin:0;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(244,183,60,.6);color:var(--gold);font-weight:700;font-size:15px}
.readyp .btn.on{background:var(--ok);color:#fff;box-shadow:0 4px 0 #13734c}
.recap{display:flex;flex-direction:column;gap:10px}
.rc{background:rgba(255,255,255,.06);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rch{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700}
.rch i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rq{margin:0;font-weight:600;line-height:1.4}
.ra{margin:0;font-family:var(--display);font-weight:900;color:var(--gold);font-size:20px}
.rl{display:flex;flex-direction:column;gap:3px;font-size:14px}
.rl .okk{color:#7be0b5}.rl .ko{color:#ffb3ad}
.rc details summary{cursor:pointer;color:var(--soft);font-size:14px;font-weight:600;padding:4px 0}
.rc .expl{margin-top:6px;color:var(--ink)}
.add input::placeholder{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
