:{"q":"¿Junto a qué ciudad francesa empieza el túnel del canal de la Mancha?","a":"Calais","w":"¡Calais!\nEl túnel sale de Coquelles, al lado, y llega cerca de Folkestone, en Inglaterra.","opts":["Calais","Dunkerque","Boulogne-sur-Mer","El Havre"]}},{"cat":"cul","level":2,"fr":{"q":"Quelle ville bretonne est surnommée « la Cité corsaire » ?","a":"Saint-Malo","w":"Saint-Malo !\nSes corsaires, comme Surcouf, attaquaient les navires ennemis avec l'autorisation du roi.","opts":["Brest","Saint-Malo","Lorient","Concarneau"]},"es":{"q":"¿Qué ciudad bretona se conoce como «la Ciudad Corsaria»?","a":"Saint-Malo","w":"¡Saint-Malo!\nSus corsarios, como Surcouf, atacaban barcos enemigos con permiso del rey.","opts":["Brest","Saint-Malo","Lorient","Concarneau"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville se trouve la célèbre plage en forme de coquillage de La Concha ?","a":"Saint-Sébastien","w":"Saint-Sébastien !\nSa baie en forme de coquille est l'une des plus belles plages urbaines d'Europe.","opts":["Santander","Gijón","Saint-Sébastien","Biarritz"]},"es":{"q":"¿En qué ciudad está la famosa playa de La Concha?","a":"San Sebastián","w":"¡San Sebastián!\nSu bahía en forma de concha es una de las playas urbanas más bonitas de Europa.","opts":["Santander","Gijón","San Sebastián","Biarritz"]}},{"cat":"cul","level":1,"fr":{"q":"Comment s'appelle le célèbre pont-aqueduc romain près de Nîmes ?","a":"Le pont du Gard","w":"Le pont du Gard !\nTrois étages d'arches qui apportaient l'eau à Nîmes il y a 2 000 ans.","opts":["Le pont d'Avignon","Le pont Valentré","Le pont Neuf","Le pont du Gard"]},"es":{"q":"¿Cómo se llama el famoso puente acueducto romano cerca de Nimes?","a":"El puente del Gard","w":"¡El puente del Gard!\nTres pisos de arcos que llevaban el agua a Nimes hace 2.000 años.","opts":["El puente de Aviñón","El puente Valentré","El Pont Neuf","El puente del Gard"]}},{"cat":"cul","level":3,"fr":{"q":"Quelle ville espagnole est surnommée « la ville des trois cultures » ?","a":"Tolède","w":"Tolède !\nChrétiens, juifs et musulmans y ont vécu côte à côte au Moyen Âge.","opts":["Tolède","Cordoue","Grenade","Séville"]},"es":{"q":"¿Qué ciudad española se conoce como «la ciudad de las tres culturas»?","a":"Toledo","w":"¡Toledo!\nCristianos, judíos y musulmanes convivieron allí en la Edad Media.","opts":["Toledo","Córdoba","Granada","Sevilla"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle région d'Espagne Don Quichotte se bat-il contre des moulins à vent ?","a":"La Manche","w":"La Manche, en Castille !\nRien à voir avec la mer : en espagnol c'est La Mancha, la terre sèche.","opts":["L'Estrémadure","La Manche","L'Andalousie","L'Aragon"]},"es":{"q":"¿En qué región de España lucha Don Quijote contra los molinos de viento?","a":"La Mancha","w":"¡La Mancha!\nEn un lugar de La Mancha… los molinos de Campo de Criptana siguen en pie.","opts":["Extremadura","La Mancha","Andalucía","Aragón"]}},{"cat":"cul","level":1,"fr":{"q":"Quel est le plus petit pays du monde ?","a":"Le Vatican","w":"Le Vatican, moins d'un demi-kilomètre carré !\nMonaco est deuxième.","opts":["Monaco","Saint-Marin","Le Vatican","Le Liechtenstein"]},"es":{"q":"¿Cuál es el país más pequeño del mundo?","a":"El Vaticano","w":"¡El Vaticano, menos de medio kilómetro cuadrado!\nMónaco es el segundo.","opts":["Mónaco","San Marino","El Vaticano","Liechtenstein"]}},{"cat":"cul","level":1,"fr":{"q":"Quel peintre impressionniste a peint la série des « Nymphéas » dans son jardin de Giverny ?","a":"Monet","w":"Piège classique : Manet et Monet, une seule lettre d'écart !\nC'est bien Claude Monet, qui a peint ses nénuphars de Giverny pendant plus de 25 ans.","opts":["Manet","Renoir","Degas","Monet"]},"es":{"q":"¿Qué pintor impresionista pintó la serie de los «Nenúfares» en su jardín de Giverny?","a":"Monet","w":"Trampa clásica: Manet y Monet, ¡solo cambia una letra!\nFue Claude Monet, que pintó los nenúfares de su jardín durante más de 25 años.","opts":["Manet","Renoir","Degas","Monet"]}},{"cat":"cul","level":1,"fr":{"q":"Quelle scientifique a été la première femme à recevoir un prix Nobel, et en a même reçu deux ?","a":"Marie Curie","w":"Marie Curie : Nobel de physique en 1903, puis de chimie en 1911.\nNée à Varsovie, elle a fait toute sa carrière en France.","opts":["Marie Curie","Irène Joliot-Curie","Rosalind Franklin","Lise Meitner"]},"es":{"q":"¿Qué científica fue la primera mujer en ganar un Nobel, y además ganó dos?","a":"Marie Curie","w":"Marie Curie: Nobel de Física en 1903 y de Química en 1911.\nNació en Varsovia e hizo toda su carrera en Francia.","opts":["Marie Curie","Irène Joliot-Curie","Rosalind Franklin","Lise Meitner"]}},{"cat":"cul","level":1,"fr":{"q":"Quel savant français a mis au point le vaccin contre la rage en 1885 ?","a":"Louis Pasteur","w":"Louis Pasteur, en 1885.\nAttention au piège Jenner : lui, c'est le vaccin contre la variole, un siècle plus tôt.","opts":["Edward Jenner","Robert Koch","Claude Bernard","Louis Pasteur"]},"es":{"q":"¿Qué científico francés desarrolló la vacuna contra la rabia en 1885?","a":"Louis Pasteur","w":"Louis Pasteur, en 1885.\nOjo con Jenner: lo suyo fue la vacuna de la viruela, un siglo antes.","opts":["Edward Jenner","Robert Koch","Claude Bernard","Louis Pasteur"]}},{"cat":"cul","level":1,"fr":{"q":"Qui a écrit « Vingt Mille Lieues sous les mers » ?","a":"Jules Verne","w":"Jules Verne, avec le capitaine Nemo et son sous-marin, le Nautilus.\nPublié en 1869-1870.","opts":["Alexandre Dumas","Victor Hugo","Jules Verne","H. G. Wells"]},"es":{"q":"¿Quién escribió «Veinte mil leguas de viaje submarino»?","a":"Julio Verne","w":"Julio Verne, con el capitán Nemo y su submarino, el Nautilus.\nPublicada en 1869-1870.","opts":["Alejandro Dumas","Víctor Hugo","Julio Verne","H. G. Wells"]}},{"cat":"cul","level":1,"fr":{"q":"Qui a écrit « Le Petit Prince » ?","a":"Antoine de Saint-Exupéry","w":"Antoine de Saint-Exupéry, aviateur et écrivain, en 1943.\nL'un des livres les plus traduits au monde.","opts":["Albert Camus "]}},{"cat":"cul","level":3,"fr":{"q":"À ses débuts en 1837, la maison Hermès fabriquait…","a":"Des harnais pour chevaux","w":"Thierry Hermès était sellier-harnacheur.\nD'où le cheval et la calèche du logo.","opts":["Des chapeaux","Des harnais pour chevaux","Des parfums","Des montres"]},"es":{"q":"En sus inicios, en 1837, la casa Hermès fabricaba…","a":"Arneses para caballos","w":"Thierry Hermès hacía arneses y sillas de montar.\nDe ahí el caballo y el carruaje del logo.","opts":["Sombreros","Arneses para caballos","Perfumes","Relojes"]}},{"cat":"cul","level":3,"fr":{"q":"En France, la rue de la Paix est la case la plus chère du Monopoly. Et dans le Monopoly espagnol classique ?","a":"Le paseo del Prado","w":"Le Monopoly espagnol se joue dans les rues de Madrid.\nLa case la plus chère : le paseo del Prado.","opts":["La Gran Vía","La Castellana","Le paseo del Prado","La Puerta del Sol"]},"es":{"q":"En el Monopoly español clásico, ¿cuál es la casilla más cara?","a":"El paseo del Prado","w":"El Monopoly español se juega en las calles de Madrid.\nLa más cara es el paseo del Prado (en Francia, la rue de la Paix).","opts":["La Gran Vía","La Castellana","El paseo del Prado","La Puerta del Sol"]}},{"cat":"cul","level":3,"fr":{"q":"En Catalogne, à Noël, les enfants tapent sur une bûche pour qu'elle « fasse » des cadeaux. Comment s'appelle-t-elle ?","a":"Le Caga Tió","w":"Le Caga Tió, la bûche avec un visage souriant et une couverture.\nSon nom veut dire exactement ce que vous pensez.","opts":["L'Olentzero","Le Caga Tió","Le Pare Noel","Le Tronc de Reis"]},"es":{"q":"En Cataluña, en Navidad, los niños golpean un tronco para que «cague» regalos. ¿Cómo se llama?","a":"El Caga Tió","w":"El Caga Tió, el tronco con cara sonriente y manta.\nSu nombre significa exactamente lo que parece.","opts":["El Olentzero","El Caga Tió","El Pare Noel","El Tronc de Reis"]}},{"cat":"cul","level":3,"fr":{"q":"En Catalogne, comment appelle-t-on le sandwich chaud jambon-fromage, cousin du croque-monsieur ?","a":"Un bikini","w":"Un bikini !\nLe nom vient de la salle Bikini de Barcelone, qui l'aurait popularisé.","opts":["Un mixto","Un bocata","Un monokini","Un bikini"]},"es":{"q":"En Cataluña, ¿cómo se llama el sándwich caliente de jamón y queso, primo del croque-monsieur?","a":"Un bikini","w":"¡Un bikini!\nEl nombre viene de la sala Bikini de Barcelona, que lo popularizó.","opts":["Un mixto","Un bocata","Un monokini","Un bikini"]}},{"cat":"eni","level":1,"fr":{"q":"Si tu me partages, je n'existe plus. Qui suis-je ?","a":"Un secret","w":"Un secret partagé n'est plus un secret.\nLe gâteau, lui, existe encore en parts !","opts":["Un secret","Un gâteau","Un rêve","Un souvenir"]},"es":{"q":"Si me compartes, dejo de existir. ¿Quién soy?","a":"Un secreto","w":"Un secreto compartido ya no es un secreto.\n¡La tarta, en cambio, sigue existiendo en trozos!","opts":["Un secreto","Una tarta","Un sueño","Un recuerdo"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai des aiguilles mais je ne couds jamais, et on me décore une fois par an. Qui suis-je ?","a":"Le sapin de Noël","w":"Les aiguilles du sapin, ce sont ses feuilles.\nEt on le décore à Noël. Aussi accepté : un sapin.","opts":["Une horloge","Le sapin de Noël","Un hérisson","Un cactus"]},"es":{"q":"Tengo agujas pero nunca coso, y me decoran una vez al año. ¿Quién soy?","a":"El árbol de Navidad","w":"Las agujas del abeto son sus hojas.\nY lo decoran en Navidad. También vale: un abeto, un pino.","opts":["Un reloj","El árbol de Navidad","Un erizo","Un cactus"]}},{"cat":"eni","level":1,"fr":{"q":"Je passe sans jamais revenir, et on dit que je suis de l'argent. Qui suis-je ?","a":"Le temps","w":"Le temps passe et ne revient jamais.\nEt comme dit le proverbe : le temps, c'est de l'argent.","opts":["Le vent","Le train","Le temps","Le salaire"]},"es":{"q":"Paso y nunca vuelvo, y dicen que valgo oro. ¿Quién soy?","a":"El tiempo","w":"El tiempo pasa y no vuelve.\nY como dice el refrán: el tiempo es oro.","opts":["El viento","El tren","El tiempo","El sueldo"]}},{"cat":"eni","level":2,"fr":{"q":"Plus il est chaud, plus il est frais. Qu'est-ce que c'est ?","a":"Le pain","w":"Un pain encore chaud sort tout juste du four.\nDonc il est bien frais !","opts":["Le café","Le four","Le soleil","Le pain"]},"es":{"q":"Cuanto más caliente está, más fresco es. ¿Qué es?","a":"El pan","w":"Un pan todavía caliente acaba de salir del horno.\n¡Así que está bien fresco!","opts":["El café","El horno","El sol","El pan"]}},{"cat":"eni","level":1,"fr":{"q":"Une femme lit un livre entier dans le noir complet, sans lampe ni téléphone. Comment fait-elle ?","a":"En braille","w":"Elle est aveugle et lit du bout des doigts.\nLe braille se lit très bien dans le noir !","opts":["En braille","Avec des lunettes","À la lueur de la lune","Elle l'invente"]},"es":{"q":"Una mujer lee un libro entero a oscuras, sin lámpara ni móvil. ¿Cómo lo hace?","a":"En braille","w":"Es ciega y lee con la punta de los dedos.\n¡El braille se lee perfectamente a oscuras!","opts":["En braille","Con gafas","A la luz de la luna","Se lo inventa"]}},{"cat":"eni","level":2,"fr":{"q":"Je vole sans ailes et je pleure sans yeux. Qui suis-je ?","a":"Un nuage","w":"Le nuage flotte dans le ciel sans ailes.\nEt ses larmes, c'est la pluie !","opts":["Un ballon","Un nuage","Le vent","Un fantôme"]},"es":{"q":"Vuelo sin alas y lloro sin ojos. ¿Quién soy?","a":"Una nube","w":"La nube flota en el cielo sin alas.\n¡Y sus lágrimas son la lluvia!","opts":["Un globo","Una nube","El viento","Un fantasma"]}},{"cat":"eni","level":1,"fr":{"q":"On m'achète pour manger, mais personne ne me mange jamais. Qui suis-je ?","a":"Une fourchette","w":"On mange avec la fourchette, pas la fourchette !\nAussi accepté : une assiette, une cuillère, un couteau.","opts":["Le pain","Une pomme","Une fourchette","Le sel"]},"es":{"q":"Me compran para comer, pero nadie me come nunca. ¿Quién soy?","a":"Un tenedor","w":"Se come con el tenedor, ¡no el tenedor!\nTambién vale: una cuchara, un cuchillo.","opts":["El pan","Una manzana","Un tenedor","La sal"]}},{"cat":"eni","level":1,"fr":{"q":"Un boucher mesure 1,85 m et chausse du 44. Que pèse-t-il ?","a":"De la viande","w":"Piège : on ne demande pas son poids !\nUn boucher, ça pèse de la viande toute la journée.","opts":["85 kg","95 kg","Impossible à savoir","De la viande"]},"es":{"q":"Un carnicero mide 1,85 y calza un 44. ¿Qué pesa?","a":"Carne","w":"Trampa: ¡no te preguntan su peso!\nUn carnicero se pasa el día pesando carne.","opts":["85 kilos","95 kilos","No se puede saber","Carne"]}},{"cat":"eni","level":3,"fr":{"q":"Un homme éteint la lumière avant de se coucher. Le lendemain, il apprend qu'un bateau s'est fracassé sur les rochers et se sent coupable. Quel est son métier ?","a":"Gardien de phare","w":"Sa lumière guidait les bateaux.\nEn l'éteignant, il a laissé le navire dans le noir.","opts":["Gardien de phare","Électricien","Capitaine","Pêcheur"]},"es":{"q":"Un hombre apaga la luz antes de acostarse. Al día siguiente se entera de que un barco se estrelló contra las rocas y se siente culpable. ¿Cuál es su oficio?","a":"Farero","w":"Su luz guiaba a los barcos.\nAl apagarla, dejó el barco a oscuras.","opts":["Farero","Electricista","Capitán","Pescador"]}},{"cat":"eni","level":2,"fr":{"q":"J'ai plein d'yeux mais je ne vois rien, et je passe ma vie sous la terre. Qui suis-je ?","a":"La pomme de terre","w":"Les petits germes de la patate s'appellent des yeux.\nPiège : la taupe vit sous terre mais n'a que deux yeux.","opts":["La taupe","La pomme de terre","Le ver de terre","La carotte"]},"es":{"q":"Tengo muchos ojos pero no veo nada, y paso la vida bajo tierra. ¿Quién soy?","a":"La patata","w":"Los brotes de la patata se llaman ojos.\nTrampa: el topo vive bajo tierra pero solo tiene dos ojos.\nTambién vale: la papa.","opts":["El topo","La patata","La lombriz","La zanahoria"]}},{"cat":"eni","level":2,"fr":{"q":"Si on me met la tête en bas, je grandis de 3. Qui suis-je ?","a":"Le 6","w":"Retourne un 6 : il devient un 9.\nEt 9, c'est 6 plus 3 !","opts":["Le 3","Le 8","Le 6","Le 1"]},"es":{"q":"Si me pones cabeza abajo, crezco 3. ¿Quién soy?","a":"El 6","w":"Dale la vuelta a un 6 y se convierte en 9.\n¡Y 9 es 6 más 3!","opts":["El 3","El 8","El 6","El 1"]}},{"cat":"eni","level":1,"fr":{"q":"Je suis une fille. Qui est le fils du père de ma sœur ?","a":"Mon frère","w":"Le père de ma sœur est mon père.\nSon fils, puisque je suis une fille, c'est mon frère.","opts":["Moi","Mon père","Mon cousin","Mon frère"]},"es":{"q":"Soy una chica. ¿Quién es el hijo del padre de mi hermana?","a":"Mi hermano","w":"El padre de mi hermana es mi padre.\nY su hijo, como yo soy chica, es mi hermano.","opts":["Yo","Mi padre","Mi primo","Mi hermano"]}},{"cat":"eni","level":1,"fr":{"q":"Multiplie-moi par n'importe quel nombre, le résultat sera toujours moi. Qui suis-je ?","a":"Zéro","w":"Zéro fois n'importe quoi donne zéro.\nPiège : un fois 5, ça fait 5, pas un !","opts":["Zéro","Un","L'infini","Dix"]},"es":{"q":"Multiplícame por cualquier número y el resultado siempre seré yo. ¿Quién soy?","a":"El cero","w":"Cero por lo que sea da cero.\nTrampa: uno por 5 da 5, ¡no uno!","opts":["El cero","El uno","El infinito","El diez"]}},{"cat":"eni","level":3,"fr":{"q":"Qui est pour toi le frère de la mère de ton père ?","a":"Ton grand-oncle","w":"La mère de ton père, c'est ta grand-mère.\nSon frère est donc ton grand-oncle.","opts":["Ton oncle","Ton grand-oncle","Ton grand-père","Ton cousin"]},"es":{"q":"¿Qué es para ti el hermano de la madre de tu padre?","a":"Tu tío abuelo","w":"La madre de tu padre es tu abuela.\nY su hermano es tu tío abuelo.","opts":["Tu tío","Tu tío abuelo","Tu abuelo","Tu primo"]}},{"cat":"eni","level":1,"fr":{"q":"Je te suis partout quand il fait beau, mais je disparais dès qu'il fait nuit. Qui suis-je ?","a":"Ton ombre","w":"Pas de lumière, pas d'ombre.\nAu soleil, elle te colle aux talons !","opts":["Ton chien","Ton reflet","Ton ombre","Ton parfum"]},"es":{"q":"Te sigo a todas partes cuando hace sol, pero desaparezco en cuanto se hace de noche. ¿Quién soy?","a":"Tu sombra","w":"Sin luz no hay sombra.\n¡Con sol, te sigue pegada a los talones!","opts":["Tu perro","Tu reflejo","Tu sombra","Tu perfume"]}},{"cat":"eni","level":1,"fr":{"q":"Je mange tout ce que je touche, mais un seul seau d'eau suffit à me tuer. Qui suis-je ?","a":"Le feu","w":"Le feu dévore bois, papier, tissu...\nMais l'eau l'éteint en un instant.","opts":["Le feu","Un ogre","Un trou noir","La rouille"]},"es":{"q":"Me como todo lo que toco, pero un cubo de agua basta para matarme. ¿Quién soy?","a":"El fuego","w":"El fuego devora madera, papel, tela...\nPero el agua lo apaga en un instante.","opts":["El fuego","Un ogro","Un agujero negro","El óxido"]}},{"cat":"eni","level":1,"fr":{"q":"Plus il pleut, plus je suis utile. Je m'ouvre au-dessus de ta tête et je me ferme à l'abri. Qui suis-je ?","a":"Un parapluie","w":"Le parapluie s'ouvre sous la pluie et se replie une fois à l'abri.\nAussi accepté : une ombrelle, si tu es optimiste !","opts":["Un toit","Un parapluie","Un bonnet","Une gouttière"]},"es":{"q":"Cuanto más llueve, más útil soy. Me abro sobre tu cabeza y me cierro bajo techo. ¿Quién soy?","a":"Un paraguas","w":"El paraguas se abre con la lluvia y se cierra bajo techo.\nTambién vale: una sombrilla, si eres optimista.","opts":["Un tejado","Un paraguas","Un gorro","Un canalón"]}},{"cat":"eni","level":1,"fr":{"q":"Je porte ma maison sur le dos, je n'ai pas de pattes, et je laisse une trace brillante derrière moi. Qui suis-je ?","a":"Un escargot","w":"Piège : la tortue porte sa maison mais a des pattes.\nL'escargot glisse sur sa bave, sans pattes.","opts":["Une tortue","Un crabe","Un escargot","Un ver de terre"]},"es":{"q":"Llevo mi casa a cuestas, no tengo patas y dejo un rastro brillante detrás. ¿Quién soy?","a":"Un caracol","w":"Trampa: la tortuga lleva su casa pero tiene patas.\nEl caracol se desliza sobre su baba, sin patas.","opts":["Una tortuga","Un cangrejo","Un caracol","Una lombriz"]}},{"cat":"eni","level":1,"fr":{"q":"On me pose sur la table, on me coupe, on me distribue, mais personne ne me mange. Qui suis-je ?","a":"Un jeu de cartes","w":"Avant de jouer, on coupe le jeu puis on distribue.\nLe gâteau aussi se coupe... mais lui, on le mange !","opts":["Un gâteau","Une nappe","Une pizza","Un jeu de cartes"]},"es":{"q":"Me ponen en la mesa, me cortan, me reparten, pero nadie me come. ¿Quién soy?","a":"Una baraja","w":"Antes de jugar se corta la baraja y se reparte.\nLa tarta también se corta... ¡pero esa sí se come!","opts":["Una tarta","Un mantel","Una pizza","Una baraja"]}},{"cat":"eni","level":2,"fr":{"q":"Je passe devant le soleil sans faire d'ombre. On ne me voit jamais, mais on voit tout ce que je bouge. Qui suis-je ?","a":"Le vent","w":"Le vent est invisible et ne fait aucune ombre.\nPiège : un nuage, lui, fait de l'ombre !","opts":["Le vent","Un avion","Un nuage","La lumière"]},"es":{"q":"Paso delante del sol sin hacer sombra. Nunca me ves, pero ves todo lo que muevo. ¿Quién soy?","a":"El viento","w":"El viento es invisible y no hace sombra.\nTrampa: ¡una nube sí hace sombra!","opts":["El viento","Un avión","Una nube","La luz"]}},{"cat":"eni","level":2,"fr":{"q":"Qui est la belle-mère de la femme de mon frère ?","a":"Ma mère","w":"La belle-mère de quelqu'un, c'est la mère de son mari.\nLe mari, c'est mon frère : sa mère est donc la mienne.","opts":["Ma tante","Ma mère","Ma grand-mère","Ma belle-sœur"]},"es":{"q":"¿Quién es la suegra de la mujer de mi hermano?","a":"Mi madre","w":"La suegra de alguien es la madre de su marido.\nEl marido es mi hermano: ¡su madre es la mía!","opts":["Mi tía","Mi madre","Mi abuela","Mi cuñada"]}},{"cat":"eni","level":2,"fr":{"q":"Un homme est retrouvé mort au milieu d'un champ, avec un sac fermé sur le dos. Que contenait le sac ?","a":"Un parachute","w":"Il a sauté d'un avion et son parachute ne s'est jamais ouvert.\nVoilà pourquoi le sac est resté fermé.","opts":["Des pierres","Un pique-nique","Un parachute","De l'argent"]},"es":{"q":"Encuentran a un hombre muerto en medio de un campo, con una mochila cerrada a la espalda. ¿Qué había dentro?","a":"Un paracaídas","w":"Saltó de un avión y el paracaídas nunca se abrió.\nPor eso la mochila seguía cerrada.","opts":["Piedras","Un pícnic","Un paracaídas","Dinero"]}},{"cat":"eni","level":2,"fr":{"q":"Ma tante est la sœur de ma mère. Que représente le fils de ma tante pour ma mère ?","a":"Son neveu","w":"Le fils de sa sœur, c'est son neveu.\nPiège : pour moi c'est un cousin, pas pour ma mère !","opts":["Son cousin","Son petit-fils","Son beau-fils","Son neveu"]},"es":{"q":"Mi tía es la hermana de mi madre. ¿Qué es el hijo de mi tía para mi madre?","a":"Su sobrino","w":"El hijo de su hermana es su sobrino.\nTrampa: para mí es un primo, ¡no para mi madre!","opts":["Su primo","Su nieto","Su hijastro","Su sobrino"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce que tu peux tenir dans ta main gauche, mais jamais dans ta main droite ?","a":"Ton coude droit","w":"Essaie d'attraper ton coude droit avec ta main droite : impossible !\nAussi accepté : ta main droite.","opts":["Ton coude droit","Un stylo","Ta montre","Rien du tout"]},"es":{"q":"¿Qué puedes agarrar con la mano izquierda, pero nunca con la derecha?","a":"Tu codo derecho","w":"Intenta agarrarte el codo derecho con la mano derecha: ¡imposible!\nTambién vale: tu mano derecha.","opts":["Tu codo derecho","Un bolígrafo","Tu reloj","Nada"]}},{"cat":"eni","level":2,"fr":{"q":"Une dame très bavarde monte dans un taxi. Le chauffeur lui fait signe qu'il est sourd. À l'arrivée, elle comprend qu'il a menti. Comment ?","a":"Il a trouvé l'adresse","w":"Elle lui avait donné l'adresse à voix haute.\nS'il était vraiment sourd, il n'aurait jamais su où aller !","opts":["Il a écouté la radio","Il a trouvé l'adresse","Il a souri","Il a répondu"]},"es":{"q":"Una señora muy habladora sube a un taxi. El taxista le hace señas de que es sordo. Al llegar, ella se da cuenta de que mentía. ¿Cómo?","a":"Encontró la dirección","w":"Ella le había dicho la dirección en voz alta.\nSi fuera sordo de verdad, ¡no habría sabido adónde ir!","opts":["Escuchó la radio","Encontró la dirección","Sonrió","Le contestó"]}},{"cat":"eni","level":1,"fr":{"q":"Je suis grande quand je suis jeune et petite quand je suis vieille. Plus je brille, plus je fonds. Qui suis-je ?","a":"Une bougie","w":"Une bougie neuve est longue, et elle raccourcit à chaque minute allumée.\nBriller la fait fondre !","opts":["Une glace","Une étoile","Une bougie","Une ampoule"]},"es":{"q":"Soy alta cuando soy joven y bajita cuando soy vieja. Cuanto más brillo, más me derrito. ¿Quién soy?","a":"Una vela","w":"Una vela nueva es larga y se va encogiendo mientras arde.\n¡Brillar la derrite!","opts":["Un helado","Una estrella","Una vela","Una bombilla"]}},{"cat":"eni","level":2,"fr":{"q":"Deux frères sont nés le même jour, la même année, de la même mère, mais ce ne sont pas des jumeaux. Comment est-ce possible ?","a":"Des triplés","w":"Il y avait un troisième bébé !\nAussi accepté : des quadruplés.","opts":["Adoptés","Nés à minuit","Des demi-frères","Des triplés"]},"es":{"q":"Dos hermanos nacieron el mismo día, el mismo año, de la misma madre, pero no son gemelos. ¿Cómo puede ser?","a":"Son trillizos","w":"¡Había un tercer bebé!\nTambién vale: cuatrillizos.","opts":["Son adoptados","Nacieron a medianoche","Son medio hermanos","Son trillizos"]}},{"cat":"eni","level":3,"fr":{"q":"Un train de 1 km de long roule à 1 km par minute et traverse un tunnel de 1 km. Combien de temps entre l'entrée de la locomotive et la sortie du dernier wagon ?","a":"2 minutes","w":"Piège : le réflexe dit 1 minute.\nMais la locomotive doit faire 2 km pour que la queue du train sorte.","opts":["2 minutes","1 minute","3 minutes","30 secondes"]},"es":{"q":"Un tren de 1 km de largo va a 1 km por minuto y cruza un túnel de 1 km. ¿Cuánto tiempo pasa desde que entra la locomotora hasta que sale el último vagón?","a":"2 minutos","w":"Trampa: el reflejo dice 1 minuto.\nPero la locomotora debe recorrer 2 km para que salga la cola.","opts":["2 minutos","1 minuto","3 minutos","30 segundos"]}},{"cat":"eni","level":2,"fr":{"q":"Roméo et Juliette sont retrouvés morts sur le sol, au milieu d'une flaque d'eau et de bouts de verre. Le chat a l'air très content. Qui sont-ils ?","a":"Des poissons","w":"Le chat a renversé le bocal.\nRoméo et Juliette étaient des poissons rouges !","opts":["Des oiseaux","Des poissons","Des comédiens","Des souris"]},"es":{"q":"Romeo y Julieta aparecen muertos en el suelo, entre un charco de agua y cristales rotos. El gato parece muy contento. ¿Quiénes son?","a":"Peces","w":"El gato tiró la pecera.\n¡Romeo y Julieta eran peces de colores!","opts":["Pájaros","Peces","Actores","Ratones"]}},{"cat":"eni","level":3,"fr":{"q":"Je suis au début de la nuit et à la fin du matin. Qui suis-je ?","a":"La lettre N","w":"NUIT commence par N, MATIN finit par N.\nPiège : ça sent l'aube, mais c'est une lettre !","opts":["L'aube","Le crépuscule","La lettre N","La lettre M"]},"es":{"q":"Estoy al principio de la noche y al final de la canción. ¿Quién soy?","a":"La letra N","w":"NOCHE empieza por N, CANCIÓN termina en N.\nTrampa: suena a poesía, ¡pero es una letra!","opts":["El amanecer","El estribillo","La letra N","La letra C"]}},{"cat":"eni","level":2,"fr":{"q":"Elle a la tête d'un chat, les pattes d'un chat, la queue d'un chat, mais ce n'est pas un chat. Qui est-ce ?","a":"La chatte","w":"Ce n'est pas UN chat... c'est UNE chatte !\nLe piège est dans le féminin.","opts":["Le tigre","Le lynx","Le chat botté","La chatte"]},"es":{"q":"Tiene la cabeza de un gato, las patas de un gato, la cola de un gato, pero no es un gato. ¿Qué es?","a":"La gata","w":"No es UN gato... ¡es UNA gata!\nLa trampa está en el femenino.","opts":["El tigre","El lince","El gato con botas","La gata"]}},{"cat":"eni","level":2,"fr":{"q":"Un homme rase plus de vingt fois par jour, et pourtant il porte une grande barbe. Comment est-ce possible ?","a":"Il est barbier","w":"Il ne se rase pas : il rase les autres !\nAussi accepté : coiffeur.","opts":["Il rase sa tête","Il est barbier","Sa barbe pousse vite","Il a un rasoir cassé"]},"es":{"q":"Un hombre afeita más de veinte veces al día y, sin embargo, lleva una barba enorme. ¿Cómo es posible?","a":"Es barbero","w":"No se afeita él: ¡afeita a los demás!\nTambién vale: peluquero.","opts":["Se afeita la cabeza","Es barbero","Le crece muy rápido","Su cuchilla está rota"]}},{"cat":"eni","level":3,"fr":{"q":"Deux amies boivent chacune un verre du même cocktail empoisonné. L'une le boit cul sec et survit, l'autre le sirote lentement et meurt. Où était le poison ?","a":"Dans les glaçons","w":"Le poison était dans la glace.\nLa plus rapide a fini avant que les glaçons fondent !","opts":["Dans la paille","Dans le citron","Dans les glaçons","Dans le verre"]},"es":{"q":"Dos amigas se toman cada una un vaso del mismo cóctel envenenado. Una se lo bebe de un trago y sobrevive; la otra lo bebe despacio y muere. ¿Dónde estaba el veneno?","a":"En el hielo","w":"El veneno estaba en los cubitos.\n¡La que bebió rápido terminó antes de que se derritieran!","opts":["En la pajita","En el limón","En el hielo","En el vaso"]}},{"cat":"eni","level":2,"fr":{"q":"Un homme entre dans un bar et demande un verre d'eau. Le barman sort un pistolet et le pointe sur lui. L'homme dit merci et repart content. Pourquoi ?","a":"Il avait le hoquet","w":"La grosse frayeur a fait passer son hoquet.\nPlus besoin du verre d'eau !","opts":["C'était un pistolet à eau","Il était policier","C'était un film","Il avait le hoquet"]},"es":{"q":"Un hombre entra en un bar y pide un vaso de agua. El camarero saca una pistola y le apunta. El hombre da las gracias y se va contento. ¿Por qué?","a":"Tenía hipo","w":"El susto le quitó el hipo.\n¡Ya no necesitaba el vaso de agua!","opts":["Era una pistola de agua","Era policía","Era una película","Tenía hipo"]}},{"cat":"eni","level":1,"fr":{"q":"Qui est pour moi la fille de la sœur de ma mère ?","a":"Ma cousine","w":"La sœur de ma mère est ma tante.\nEt la fille de ma tante, c'est ma cousine.","opts":["Ma cousine","Ma nièce","Ma tante","Ma demi-sœur"]},"es":{"q":"¿Qué es para mí la hija de la hermana de mi madre?","a":"Mi prima","w":"La hermana de mi madre es mi tía.\nY la hija de mi tía es mi prima.","opts":["Mi prima","Mi sobrina","Mi tía","Mi hermanastra"]}},{"cat":"eni","level":3,"fr":{"q":"Un homme est né en l'an 60 et il est mort en l'an 10, à l'âge de 50 ans. Comment est-ce possible ?","a":"Avant Jésus-Christ","w":"Avant J.-C., les années se comptent à rebours.\nDe 60 à 10 av. J.-C., ça fait bien 50 ans. Aussi accepté : av. J.-C.","opts":["Erreur sur la tombe","Avant Jésus-Christ","Il a voyagé dans le temps","Calendrier chinois"]},"es":{"q":"Un hombre nació en el año 60 y murió en el año 10, con 50 años. ¿Cómo es posible?","a":"Antes de Cristo","w":"Antes de Cristo, los años se cuentan hacia atrás.\nDel 60 al 10 a. C. van 50 años. También vale: a. C.","opts":["Error en la lápida","Antes de Cristo","Viajó en el tiempo","Calendario chino"]}},{"cat":"eni","level":2,"fr":{"q":"C'est le frère de ma tante, mais ce n'est pas mon oncle. Qui est-ce ?","a":"Mon père","w":"Si ma tante est la sœur de mon père...\nalors son frère, c'est mon père !","opts":["Mon cousin","Mon grand-père","Mon père","Mon parrain"]},"es":{"q":"Es el hermano de mi tía, pero no es mi tío. ¿Quién es?","a":"Mi padre","w":"Si mi tía es la hermana de mi padre...\n¡su hermano es mi padre!","opts":["Mi primo","Mi abuelo","Mi padre","Mi padrino"]}},{"cat":"eni","level":2,"fr":{"q":"Pourquoi un ours polaire ne mange-t-il jamais de manchots ?","a":"Pôles opposés","w":"L'ours polaire vit au pôle Nord, les manchots dans l'hémisphère Sud.\nIls ne se croisent jamais !","opts":["Trop de plumes","Ils sont trop rapides","Il est végétarien","Pôles opposés"]},"es":{"q":"¿Por qué un oso polar nunca se come a un pingüino?","a":"Polos opuestos","w":"El oso polar vive en el Ártico y los pingüinos en el hemisferio sur.\n¡Nunca se cruzan!","opts":["Demasiadas plumas","Son muy rápidos","Es vegetariano","Polos opuestos"]}},{"cat":"eni","level":2,"fr":{"q":"Quel mois de l'année a le nom le plus court ?","a":"Mai","w":"Piège : février est le plus court en jours, pas en lettres !\nMai : 3 lettres. Juin et août en ont 4.","opts":["Mai","Février","Juin","Août"]},"es":{"q":"¿Qué mes del año tiene el nombre más corto?","a":"Mayo","w":"Trampa: febrero es el más corto en días, ¡no en letras!\nMayo: 4 letras. Todos los demás tienen 5 o más.","opts":["Mayo","Febrero","Junio","Abril"]}},{"cat":"eni","level":1,"fr":{"q":"On les ouvre le matin et on les ferme le soir, sans clé ni serrure. Qu'est-ce que c'est ?","a":"Les yeux","w":"Pas besoin de clé pour ouvrir les yeux au réveil.\nAussi accepté : les paupières.","opts":["Les volets","Les yeux","Les rideaux","Les portes"]},"es":{"q":"Se abren por la mañana y se cierran por la noche, sin llave ni cerradura. ¿Qué son?","a":"Los ojos","w":"No hace falta llave para abrir los ojos al despertar.\nTambién vale: los párpados.","opts":["Las persianas","Los ojos","Las cortinas","Las puertas"]}},{"cat":"eni","level":3,"fr":{"q":"Quand j'avais 6 ans, ma sœur avait la moitié de mon âge. Aujourd'hui j'ai 40 ans. Quel âge a ma sœur ?","a":"37 ans","w":"Piège : le réflexe dit la moitié, 20 ans.\nÀ 6 ans, elle en avait 3 : 3 ans d'écart, pour toujours.","opts":["20 ans","34 ans","37 ans","43 ans"]},"es":{"q":"Cuando yo tenía 6 años, mi hermana tenía la mitad que yo. Hoy tengo 40. ¿Cuántos años tiene mi hermana?","a":"37 años","w":"Trampa: el reflejo dice la mitad, 20.\nCon 6 años ella tenía 3: se llevan 3 años para siempre.","opts":["20 años","34 años","37 años","43 años"]}},{"cat":"eni","level":2,"fr":{"q":"Je suis un arbre à 12 branches. Chaque branche porte 4 nids, et chaque nid abrite 7 oiseaux. Qui suis-je ?","a":"L'année","w":"12 mois, environ 4 semaines par mois, 7 jours par semaine.\nAussi accepté : le calendrier.","opts":["Le calendrier de l'Avent","L'horloge","Le chêne","L'année"]},"es":{"q":"Soy un árbol de 12 ramas. Cada rama tiene 4 nidos, y cada nido 7 pájaros. ¿Quién soy?","a":"El año","w":"12 meses, unas 4 semanas por mes, 7 días por semana.\nTambién vale: el calendario.","opts":["El calendario de Adviento","El reloj","El roble","El año"]}},{"cat":"eni","level":2,"fr":{"q":"On me jette quand on a besoin de moi, et on me remonte quand on n'a plus besoin de moi. Qui suis-je ?","a":"L'ancre","w":"On jette l'ancre pour s'arrêter, on la remonte pour repartir.\nLa poubelle, elle, on la jette quand on n'en veut plus !","opts":["L'ancre","La poubelle","Le filet de pêche","La bouée"]},"es":{"q":"Me echan cuando me necesitan y me suben cuando ya no me necesitan. ¿Quién soy?","a":"El ancla","w":"Se echa el ancla para parar y se sube para zarpar.\n¡La basura se tira cuando ya no la quieres!","opts":["El ancla","La basura","La red de pesca","El salvavidas"]}},{"cat":"eni","level":2,"fr":{"q":"J'ai des bras mais pas de mains, des pieds mais pas d'orteils, et un dos mais pas de colonne. Qui suis-je ?","a":"Un fauteuil","w":"Accoudoirs (les bras), pieds et dossier : tout y est !\nLa table n'a pas de bras.","opts":["Un robot","Un fauteuil","Un épouvantail","Une table"]},"es":{"q":"Tengo brazos pero no manos, patas pero no dedos, y respaldo pero no columna. ¿Quién soy?","a":"Un sillón","w":"Brazos, patas y respaldo: ¡no le falta nada!\nLa mesa no tiene brazos.","opts":["Un robot","Un sillón","Un espantapájaros","Una mesa"]}},{"cat":"eni","level":2,"fr":{"q":"Je n'ai pas de sœur. Qui est la mère de mon neveu ?","a":"Ma belle-sœur","w":"Sans sœur, mon neveu est le fils de mon frère.\nSa mère est donc ma belle-sœur.","opts":["Ma cousine","Ma tante","Ma belle-sœur","Ma mère"]},"es":{"q":"No tengo hermanas. ¿Quién es la madre de mi sobrino?","a":"Mi cuñada","w":"Sin hermanas, mi sobrino es hijo de mi hermano.\nAsí que su madre es mi cuñada.","opts":["Mi prima","Mi tía","Mi cuñada","Mi madre"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai un œil mais je ne vois rien, et je traîne toujours un fil derrière moi. Qui suis-je ?","a":"Une aiguille","w":"L'œil de l'aiguille, c'est le petit trou où passe le fil.\nAucune chance qu'elle voie quoi que ce soit !","opts":["Un cyclope","Une bobine","Un bouton","Une aiguille"]},"es":{"q":"Tengo un ojo pero no veo nada, y siempre arrastro un hilo detrás. ¿Quién soy?","a":"Una aguja","w":"El ojo de la aguja es el agujerito por donde pasa el hilo.\n¡Ver, no ve nada!","opts":["Un cíclope","Un carrete","Un botón","Una aguja"]}},{"cat":"eni","level":1,"fr":{"q":"Je me lève le matin et je me couche le soir, mais je ne dors jamais. Qui suis-je ?","a":"Le soleil","w":"Le soleil se lève et se couche, mais toujours en pleine forme.\nPiège : la lune se lève plutôt le soir !","opts":["Le soleil","Le coq","Le réveil","La lune"]},"es":{"q":"Salgo por la mañana y me pongo por la tarde, pero nunca duermo. ¿Quién soy?","a":"El sol","w":"El sol sale y se pone, pero nunca duerme.\nTrampa: ¡la luna suele salir de noche!","opts":["El sol","El gallo","El despertador","La luna"]}},{"cat":"eni","level":3,"fr":{"q":"Qu'est-ce qui va le plus vite : le chaud ou le froid ?","a":"Le chaud","w":"Le chaud, parce que le froid, on l'attrape !\nPetit jeu de mots de cour de récré.","opts":["Le froid","Le chaud","Pareil","Aucun des deux"]},"es":{"q":"¿Qué corre más: el calor o el frío?","a":"El calor","w":"El calor, porque el frío... ¡se coge!\nJuego de palabras de patio de colegio.","opts":["El frío","El calor","Igual","Ninguno"]}},{"cat":"eni","level":2,"fr":{"q":"J'ai des racines que personne ne voit, je suis plus haute que les arbres, et pourtant je ne pousse jamais. Qui suis-je ?","a":"La montagne","w":"On parle bien du pied et des racines d'une montagne.\nPlus haute que les arbres, mais elle ne pousse pas !","opts":["Le séquoia","La tour Eiffel","La montagne","Le bambou"]},"es":{"q":"Tengo raíces que nadie ve, soy más alta que los árboles y, sin embargo, nunca crezco. ¿Quién soy?","a":"La montaña","w":"Las montañas tienen pie y raíces bajo tierra.\n¡Más alta que los árboles, pero no crece!","opts":["La secuoya","La torre Eiffel","La montaña","El bambú"]}},{"cat":"eni","level":3,"fr":{"q":"Qu'est-ce qui se trouve à la fin de tout ?","a":"La lettre T","w":"Piège philosophique : TOUT se termine par un T !","opts":["La mort","Le néant","Le point final","La lettre T"]},"es":{"q":"¿Qué hay al final de todo?","a":"La letra O","w":"Trampa filosófica: ¡TODO termina en O!","opts":["La muerte","La nada","El punto final","La letra O"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai des touches noires et blanches, une queue mais aucun poil, et je chante quand on me frappe. Qui suis-je ?","a":"Un piano","w":"Le piano à queue a bien une queue, mais pas un seul poil.\nEt ses touches chantent quand on les frappe.","opts":["Un piano","Un zèbre","Un clavier d'ordinateur","Une guitare"]},"es":{"q":"Tengo teclas blancas y negras, cola pero ni un pelo, y canto cuando me golpean. ¿Quién soy?","a":"Un piano","w":"El piano de cola tiene cola, pero ni un pelo.\nY sus teclas cantan cuando las tocas.","opts":["Un piano","Una cebra","Un teclado de ordenador","Una guitarra"]}},{"cat":"eni","level":1,"fr":{"q":"Je vis dans ta bouche, je ne suis pas une dent, et je porte le même nom que le français ou l'espagnol. Qui suis-je ?","a":"La langue","w":"La langue est dans ta bouche...\net le français est une langue !","opts":["La salive","La langue","Le palais","La gencive"]},"es":{"q":"Vivo en tu boca, no soy un diente, y me llamo igual que el francés o el español. ¿Quién soy?","a":"La lengua","w":"La lengua está en tu boca...\n¡y el español es una lengua!","opts":["La saliva","La lengua","El paladar","La encía"]}},{"cat":"eni","level":3,"fr":{"q":"Une femme tire sur son mari, le plonge dans l'eau, puis le suspend pendant cinq minutes. Le soir, ils dînent tranquillement ensemble. Quel est son métier ?","a":"Photographe","w":"Elle tire son portrait, développe la photo dans un bain, puis la suspend pour sécher.\nC'est de la photo argentique !","opts":["Policière","Magicienne","Photographe","Infirmière"]},"es":{"q":"Una mujer dispara a su marido, lo sumerge en agua y luego lo cuelga cinco minutos. Por la noche cenan juntos tan tranquilos. ¿Cuál es su profesión?","a":"Fotógrafa","w":"Le dispara una foto, la revela en un baño y la cuelga para que se seque.\n¡Fotografía analógica!","opts":["Policía","Maga","Fotógrafa","Enfermera"]}},{"cat":"eni","level":1,"fr":{"q":"Comment un homme peut-il passer dix jours sans dormir, sans être fatigué ?","a":"Il dort la nuit","w":"Dix jours sans dormir... mais dix nuits à ronfler !","opts":["Il boit du café","C'est un robot","C'est impossible","Il dort la nuit"]},"es":{"q":"¿Cómo puede un hombre pasar diez días sin dormir sin estar cansado?","a":"Duerme de noche","w":"Diez días sin dormir... ¡pero diez noches roncando!","opts":["Toma café","Es un robot","Es imposible","Duerme de noche"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai une face mais pas d'yeux, et une pile mais pas d'électricité. Qui suis-je ?","a":"Une pièce de monnaie","w":"Pile ou face : ce sont les deux côtés d'une pièce.\nNi yeux sur la face, ni courant dans la pile !","opts":["Une pièce de monnaie","Une télécommande","Une montre","Un miroir"]},"es":{"q":"Tengo cara pero no tengo ojos, y tengo cruz pero no estoy en ninguna iglesia. ¿Quién soy?","a":"Una moneda","w":"Cara o cruz: los dos lados de una moneda.\n¡Ni ojos en la cara ni iglesia en la cruz!","opts":["Una moneda","Un mando a distancia","Un reloj","Un espejo"]}},{"cat":"eni","level":3,"fr":{"q":"Dans une famille, chaque fille a autant de frères que de sœurs, et chaque garçon a deux fois plus de sœurs que de frères. Combien d'enfants ?","a":"7","w":"4 filles et 3 garçons.\nUne fille : 3 frères, 3 sœurs. Un garçon : 4 sœurs, 2 frères.","opts":["5","7","6","9"]},"es":{"q":"En una familia, cada hija tiene tantos hermanos como hermanas, y cada hijo tiene el doble de hermanas que de hermanos. ¿Cuántos hijos hay?","a":"7","w":"4 chicas y 3 chicos.\nUna chica: 3 hermanos y 3 hermanas. Un chico: 4 hermanas y 2 hermanos.","opts":["5","7","6","9"]}},{"cat":"eni","level":1,"fr":{"q":"Plus je travaille, plus je rapetisse, et je laisse tout le monde tout propre. Qui suis-je ?","a":"Le savon","w":"Chaque lavage use un peu le savon.\nÀ force de travailler, il disparaît !","opts":["L'éponge","Le balai","Le savon","La serviette"]},"es":{"q":"Cuanto más trabajo, más pequeño me hago, y dejo a todo el mundo limpito. ¿Quién soy?","a":"El jabón","w":"Cada lavado gasta un poco el jabón.\n¡De tanto trabajar, desaparece!","opts":["La esponja","La escoba","El jabón","La toalla"]}},{"cat":"eni","level":2,"fr":{"q":"Je me brise sur le sable sans jamais me faire mal, et je reviens toujours. Qui suis-je ?","a":"La vague","w":"Les vagues se brisent sur la plage... et la suivante arrive aussitôt.","opts":["Le coquillage","Le château de sable","Le verre","La vague"]},"es":{"q":"Rompo en la arena sin hacerme daño nunca, y siempre vuelvo. ¿Quién soy?","a":"La ola","w":"Las olas rompen en la playa... y enseguida llega la siguiente.","opts":["La concha","El castillo de arena","El cristal","La ola"]}},{"cat":"pie","level":2,"fr":{"q":"Les îles Canaries doivent leur nom à quel animal ?","a":"Le chien","w":"Piège : on pense au canari, mais c'est l'inverse !\nLes Romains les appelaient « Canariae Insulae », les îles aux chiens (canis).\nC'est le petit oiseau jaune qui tient son nom des îles.","opts":["Le chien","Le canari","Le canard","Le chat"]},"es":{"q":"¿A qué animal deben su nombre las islas Canarias?","a":"Al perro","w":"Trampa: pensamos en el canario, ¡pero es al revés!\nLos romanos las llamaban «Canariae Insulae», islas de los perros (canis).\nEs el pajarito amarillo el que debe su nombre a las islas.","opts":["Al perro","Al canario","Al pato","Al gato"]}},{"cat":"pie","level":2,"fr":{"q":"De quel pays vient à l'origine le chapeau « panama » ?","a":"L'Équateur","w":"Piège : le nom !\nCes chapeaux de paille tressée sont fabriqués en Équateur.\nOn les a appelés panamas car ils étaient expédiés depuis le Panama, notamment pour les ouvriers du canal.","opts":["Le Panama","L'Équateur","Cuba","Le Mexique"]},"es":{"q":"¿De qué país es originario el sombrero «panamá»?","a":"Ecuador","w":"Trampa: ¡el nombre!\nEstos sombreros de paja toquilla se tejen en Ecuador.\nSe llamaron panamás porque se enviaban desde Panamá, sobre todo a los obreros del canal.","opts":["Panamá","Ecuador","Cuba","México"]}},{"cat":"pie","level":2,"fr":{"q":"Dans quel pays a-t-on inventé le jeu de « dames chinoises » ?","a":"L'Allemagne","w":"Piège : il n'a rien de chinois !\nLe jeu a été créé en Allemagne en 1892 sous le nom de « Stern-Halma ».\nLe nom « chinois » est une trouvaille marketing américaine.","opts":["La Chine","Le Japon","L'Allemagne","L'Angleterre"]},"es":{"q":"¿En qué país se inventó el juego de las «damas chinas»?","a":"Alemania","w":"Trampa: ¡no tiene nada de chino!\nSe creó en Alemania en 1892 con el nombre de «Stern-Halma».\nLo de «chino» fue un invento de marketing en Estados Unidos.","opts":["China","Japón","Alemania","Inglaterra"]}},{"cat":"pie","level":1,"fr":{"q":"Quelle construction humaine peut-on voir à l'œil nu depuis la Lune ?","a":"Aucune","w":"Piège : la célèbre légende de la Grande Muraille !\nDepuis la Lune, à 384 000 km, on ne distingue aucune construction humaine.\nLa Muraille est très longue, mais bien trop étroite.","opts":["La Grande Muraille de Chine","Les pyramides d'Égypte","Le canal de Suez","Aucune"]},"es":{"q":"¿Qué construcción humana se ve a simple vista desde la Luna?","a":"Ninguna","w":"Trampa: ¡la famosa leyenda de la Gran Muralla!\nDesde la Luna, a 384.000 km, no se distingue ninguna obra humana.\nLa Muralla es larguísima, pero demasiado estrecha.","opts":["La Gran Muralla china","Las pirámides de Egipto","El canal de Suez","Ninguna"]}},{"cat":"pie","level":2,"fr":{"q":"Pour un botaniste, la cacahuète est…","a":"Une légumineuse","w":"Piège : on la mange avec les noix à l'apéro !\nMais l'arachide est de la famille des pois et des haricots.\nSes gousses mûrissent sous terre.","opts":["Une légumineuse","Une noix","Une graine de palmier","Une céréale"]},"es":{"q":"Para un botánico, el cacahuete es…","a":"Una legumbre","w":"Trampa: ¡lo comemos con los frutos secos!\nPero el cacahuete es pariente de los guisantes y las judías.\nSus vainas maduran bajo tierra.","opts":["Una legumbre","Una nuez","Una semilla de palmera","Un cereal"]}},{"cat":"pie","level":2,"fr":{"q":"Tu plantes une clôture droite de 10 mètres, avec un poteau tous les mètres, y compris aux deux bouts. Combien de poteaux ?","a":"11","w":"Piège : l'erreur du piquet de clôture !\nIl y a 10 intervalles d'un mètre, mais il faut un poteau de plus pour fermer le dernier.","opts":["10","11","9","12"]},"es":{"q":"Pones una valla recta de 10 metros, con un poste cada metro, incluidos los dos extremos. ¿Cuántos postes?","a":"11","w":"Trampa: ¡el error del poste de la valla!\nHay 10 tramos de un metro, pero hace falta un poste más para cerrar el último.","opts":["10","11","9","12"]}},{"cat":"pie","level":1,"fr":{"q":"Quelle est la capitale de l'Australie ?","a":"Canberra","w":"Piège : on pense à la ville la plus célèbre, Sydney !\nCanberra a été construite exprès comme capitale, en compromis entre Sydney et Melbourne.","opts":["Sydney","Melbourne","Canberra","Perth"]},"es":{"q":"¿Cuál es la capital de Australia?","a":"Canberra","w":"Trampa: ¡pensamos en la ciudad más famosa, Sídney!\nCanberra se construyó a propósito como capital, como término medio entre Sídney y Melbourne.","opts":["Sídney","Melbourne","Canberra","Perth"]}},{"cat":"pie","level":1,"fr":{"q":"Quelle est la capitale de la Turquie ?","a":"Ankara","w":"Piège : Istanbul est la plus grande ville, pas la capitale !\nAtatürk a fait d'Ankara la capitale en 1923.","opts":["Istanbul","Izmir","Antalya","Ankara"]},"es":{"q":"¿Cuál es la capital de Turquía?","a":"Ankara","w":"Trampa: Estambul es la ciudad más grande, ¡no la capital!\nAtatürk convirtió Ankara en capital en 1923.","opts":["Estambul","Esmirna","Antalya","Ankara"]}},{"cat":"pie","level":2,"fr":{"q":"Quelle est la plus grande île du monde ?","a":"Le Groenland","w":"Piège : l'Australie est si grande qu'on la compte comme un continent !\nLa plus grande île du monde est donc le Groenland.","opts":["Le Groenland","L'Australie","Madagascar","Bornéo"]},"es":{"q":"¿Cuál es la isla más grande del mundo?","a":"Groenlandia","w":"Trampa: ¡Australia es tan grande que cuenta como continente!\nAsí que la isla más grande del mundo es Groenlandia.","opts":["Groenlandia","Australia","Madagascar","Borneo"]}},{"cat":"pie","level":2,"fr":{"q":"Quel est le plus grand désert du monde ?","a":"L'Antarctique","w":"Piège : un désert n'est pas forcément chaud !\nC'est une zone où il ne pleut presque jamais. L'Antarctique est le plus grand.\nLe Sahara n'est que le plus grand désert chaud.","opts":["Le Sahara","L'Antarctique","Le désert de Gobi","Le désert d'Arabie"]},"es":{"q":"¿Cuál es el desierto más grande del mundo?","a":"La Antártida","w":"Trampa: ¡un desierto no tiene por qué ser caluroso!\nEs una zona donde casi no llueve, y la Antártida es la más grande.\nEl Sáhara es solo el mayor desierto cálido.","opts":["El Sáhara","La Antártida","El desierto de Gobi","El desierto arábigo"]}},{"cat":"pie","level":1,"fr":{"q":"De quelle couleur est le sang dans nos veines ?","a":"Rouge","w":"Piège : les veines paraissent bleues à travers la peau !\nC'est un effet d'optique : le sang est toujours rouge, juste plus foncé quand il a moins d'oxygène.","opts":["Bleu","Violet","Rouge","Vert"]},"es":{"q":"¿De qué color es la sangre de nuestras venas?","a":"Roja","w":"Trampa: ¡las venas se ven azules a través de la piel!\nEs un efecto óptico: la sangre siempre es roja, solo más oscura cuando lleva menos oxígeno.","opts":["Azul","Morada","Roja","Verde"]}},{"cat":"pie","level":1,"fr":{"q":"Dans l'arène, qu'est-ce qui fait charger le taureau vers la cape ?","a":"Le mouvement","w":"Piège : le rouge n'y est pour rien !\nLe taureau distingue très mal le rouge.\nC'est le mouvement de la cape qui le provoque.","opts":["La couleur rouge","L'odeur","Le bruit","Le mouvement"]},"es":{"q":"En la plaza, ¿qué hace que el toro embista el capote?","a":"El movimiento","w":"Trampa: ¡el rojo no tiene nada que ver!\nEl toro apenas distingue el rojo.\nLo que le provoca es el movimiento del capote o de la muleta.","opts":["El color rojo","El olor","El ruido","El movimiento"]}},{"cat":"pie","level":1,"fr":{"q":"Combien de temps dure la mémoire d'un poisson rouge ?","a":"Plusieurs mois","w":"Piège : le mythe des 3 secondes !\nDes expériences montrent qu'un poisson rouge peut se souvenir de choses pendant des mois.","opts":["Plusieurs mois","3 secondes","10 secondes","1 minute"]},"es":{"q":"¿Cuánto dura la memoria de un pez de colores?","a":"Varios meses","w":"Trampa: ¡el mito de los 3 segundos!\nLos experimentos demuestran que un pez de colores puede recordar cosas durante meses.","opts":["Varios meses","3 segundos","10 segundos","1 minuto"]}},{"cat":"pie","level":2,"fr":{"q":"Quelle taille mesurait Napoléon Bonaparte ?","a":"Environ 1,69 m","w":"Piège : la légende du « petit caporal » !\nIl mesurait environ 1,69 m, dans la moyenne de son époque.\nLa confusion vient des anciens pouces français, plus longs que les pouces anglais.","opts":["Environ 1,52 m","Environ 1,69 m","Environ 1,40 m","Environ 1,85 m"]},"es":{"q":"¿Cuánto medía Napoleón Bonaparte?","a":"Unos 1,69 m","w":"Trampa: ¡la leyenda del emperador bajito!\nMedía unos 1,69 m, la media de su época.\nLa confusión viene de las antiguas pulgadas francesas, más largas que las inglesas.","opts":["Unos 1,52 m","Unos 1,69 m","Unos 1,40 m","Unos 1,85 m"]}},{"cat":"pie","level":1,"fr":{"q":"Que stocke le dromadaire dans sa bosse ?","a":"De la graisse","w":"Piège : ce n'est pas une gourde !\nLa bosse est une réserve de graisse qui lui donne de l'énergie quand la nourriture manque.","opts":["De l'eau","Du lait","De la graisse","De l'air"]},"es":{"q":"¿Qué almacena el dromedario en su joroba?","a":"Grasa","w":"Trampa: ¡no es una cantimplora!\nLa joroba es una reserva de grasa que le da energía cuando falta comida.","opts":["Agua","Leche","Grasa","Aire"]}},{"cat":"pie","level":1,"fr":{"q":"Pour un botaniste, la tomate est…","a":"Un fruit","w":"Piège : en cuisine, on la traite comme un légume !\nMais elle contient les graines de la plante : c'est un fruit, comme le poivron et l'aubergine.","opts":["Un légume","Une racine","Une tige","Un fruit"]},"es":{"q":"Para un botánico, el tomate es…","a":"Un fruto","w":"Trampa: ¡en la cocina la tratamos como verdura!\nPero contiene las semillas de la planta: es un fruto, como el pimiento o la berenjena.","opts":["Una verdura","Una raíz","Un tallo","Un fruto"]}},{"cat":"pie","level":2,"fr":{"q":"Un chauffeur de camion remonte une rue à sens unique dans le mauvais sens. Un policier le voit et ne dit rien. Pourquoi ?","a":"Il est à pied","w":"Piège : on imagine tout de suite le camion !\nL'énoncé ne dit jamais qu'il conduit : il marche simplement sur le trottoir.","opts":["Il est à pied","Il a une dérogation","Le policier dort","C'est un camion de pompiers"]},"es":{"q":"Un camionero va en dirección contraria por una calle de sentido único. Un policía lo ve y no dice nada. ¿Por qué?","a":"Va a pie","w":"Trampa: ¡enseguida imaginamos el camión!\nEl enunciado nunca dice que conduzca: simplemente va andando por la acera.","opts":["Va a pie","Tiene un permiso especial","El policía está dormido","Es un camión de bomberos"]}},{"cat":"pie","level":1,"fr":{"q":"Deux sœurs sont nées le même jour, la même année, de la même mère, mais ne sont pas jumelles. Comment est-ce possible ?","a":"Ce sont des triplées","w":"Piège : on croit qu'elles ne sont que deux !\nIl y a une troisième sœur : ce sont des triplées.","opts":["L'une est adoptée","Ce sont des triplées","Nées à minuit pile","C'est impossible"]},"es":{"q":"Dos hermanas nacieron el mismo día, el mismo año y de la misma madre, pero no son gemelas. ¿Cómo es posible?","a":"Son trillizas","w":"Trampa: ¡creemos que solo son dos!\nHay una tercera hermana: son trillizas.","opts":["Una es adoptada","Son trillizas","Nacieron a medianoche","Es imposible"]}},{"cat":"pie","level":2,"fr":{"q":"Qu'est-ce qui a été inventé en premier ?","a":"Le parachute","w":"Piège : à quoi bon un parachute sans avion ?\nOn sautait déjà depuis des montgolfières : Garnerin fait le premier saut en 1797.\nLe premier avion ne vole qu'en 1903.","opts":["L'avion","L'hélicoptère","Le parachute","Le planeur"]},"es":{"q":"¿Qué se inventó primero?","a":"El paracaídas","w":"Trampa: ¿para qué un paracaídas sin avión?\nYa se saltaba desde globos: Garnerin hizo el primer salto en 1797.\nEl primer avión no voló hasta 1903.","opts":["El avión","El helicóptero","El paracaídas","El planeador"]}},{"cat":"pie","level":1,"fr":{"q":"Lequel de ces animaux les hommes préhistoriques n'ont-ils jamais croisé ?","a":"Le tyrannosaure","w":"Piège : les films et les dessins animés !\nLes dinosaures ont disparu il y a 66 millions d'années, bien avant l'apparition de l'homme.","opts":["Le mammouth","Le rhinocéros laineux","L'ours des cavernes","Le tyrannosaure"]},"es":{"q":"¿Cuál de estos animales nunca vieron los hombres prehistóricos?","a":"El tiranosaurio","w":"Trampa: ¡las películas y los dibujos animados!\nLos dinosaurios desaparecieron hace 66 millones de años, mucho antes de que existiera el ser humano.","opts":["El mamut","El rinoceronte lanudo","El oso de las cavernas","El tiranosaurio"]}},{"cat":"pie","level":2,"fr":{"q":"Cléopâtre a vécu plus près de notre époque ou de la construction de la pyramide de Khéops ?","a":"De notre époque","w":"Piège : on range toute l'Égypte antique dans le même sac !\nKhéops : vers 2560 av. J.-C. Cléopâtre : morte en 30 av. J.-C.\nElle est donc plus proche de nous que de la pyramide.","opts":["De notre époque","De la pyramide","Pile au milieu","On ne sait pas"]},"es":{"q":"¿Cleopatra vivió más cerca de nuestra época o de la construcción de la pirámide de Keops?","a":"De nuestra época","w":"Trampa: ¡metemos todo el antiguo Egipto en el mismo saco!\nKeops: hacia 2560 a. C. Cleopatra: murió en el 30 a. C.\nEstá más cerca de nosotros que de la pirámide.","opts":["De nuestra época","De la pirámide","Justo en medio","No se sabe"]}},{"cat":"pie","level":2,"fr":{"q":"Une pièce normale tombe 5 fois de suite sur pile. Quelle chance a-t-elle de tomber sur face au 6e lancer ?","a":"50 %","w":"Piège : l'erreur du joueur !\nLa pièce n'a pas de mémoire : chaque lancer reste à une chance sur deux.","opts":["Plus de 50 %","50 %","Moins de 50 %","1 sur 6"]},"es":{"q":"Una moneda normal sale cruz 5 veces seguidas. ¿Qué probabilidad hay de que salga cara en la sexta tirada?","a":"50 %","w":"Trampa: ¡la falacia del jugador!\nLa moneda no tiene memoria: cada tirada sigue siendo una de cada dos.","opts":["Más del 50 %","50 %","Menos del 50 %","1 de 6"]}},{"cat":"pie","level":3,"fr":{"q":"Dans un groupe de 23 personnes, quelle est la probabilité que deux aient le même jour d'anniversaire ?","a":"Environ 50 %","w":"Piège : on compare 23 à 365 jours !\nMais on compte toutes les paires possibles, et il y en a 253.\nRésultat : à peu près une chance sur deux.","opts":["Environ 6 %","Environ 1 %","Environ 50 %","Environ 20 %"]},"es":{"q":"En un grupo de 23 personas, ¿qué probabilidad hay de que dos cumplan años el mismo día?","a":"Alrededor del 50 %","w":"Trampa: ¡comparamos 23 con 365 días!\nPero cuentan todas las parejas posibles, y hay 253.\nResultado: más o menos una de cada dos.","opts":["Alrededor del 6 %","Alrededor del 1 %","Alrededor del 50 %","Alrededor del 20 %"]}},{"cat":"pie","level":3,"fr":{"q":"Jeu télé : 3 portes, une voiture derrière l'une. Tu en choisis une, puis l'animateur, qui sait tout, ouvre une autre porte vide. Que faire ?","a":"Changer de porte","w":"Piège : on croit que c'est du 50/50 !\nTa première porte n'avait qu'une chance sur 3.\nEn changeant, tu gagnes 2 fois sur 3 : c'est le problème de Monty Hall.","opts":["Garder sa porte","C'est pareil","Demander un indice","Changer de porte"]},"es":{"q":"Concurso: 3 puertas y un coche detrás de una. Eliges una y el presentador, que lo sabe todo, abre otra vacía. ¿Qué te conviene?","a":"Cambiar de puerta","w":"Trampa: ¡creemos que es un 50/50!\nTu primera puerta solo tenía una posibilidad entre 3.\nSi cambias, ganas 2 veces de cada 3: es el problema de Monty Hall.","opts":["Quedarte con la tuya","Da igual","Pedir una pista","Cambiar de puerta"]}},{"cat":"pie","level":2,"fr":{"q":"Un prix augmente de 50 %, puis baisse de 50 %. Par rapport au prix de départ, il est…","a":"25 % moins cher","w":"Piège : +50 et -50 ne s'annulent pas !\n100 € deviennent 150 €, et la moitié de 150 €, c'est 75 €.","opts":["Identique","25 % moins cher","50 % moins cher","25 % plus cher"]},"es":{"q":"Un precio sube un 50 % y luego baja un 50 %. Comparado con el inicial, es…","a":"Un 25 % más barato","w":"Trampa: ¡+50 y -50 no se anulan!\n100 € pasan a 150 €, y la mitad de 150 € son 75 €.","opts":["Igual","Un 25 % más barato","Un 50 % más barato","Un 25 % más caro"]}},{"cat":"pie","level":1,"fr":{"q":"La chauve-souris est…","a":"Un mammifère","w":"Piège : elle vole, donc on pense oiseau !\nC'est un mammifère qui allaite ses petits, et pas un rongeur.\nC'est même le seul mammifère capable de vraiment voler.","opts":["Un oiseau","Un rongeur","Un mammifère","Un insecte"]},"es":{"q":"El murciélago es…","a":"Un mamífero","w":"Trampa: vuela, ¡así que pensamos en un ave!\nEs un mamífero que amamanta a sus crías, y no es un roedor.\nEs el único mamífero capaz de volar de verdad.","opts":["Un ave","Un roedor","Un mamífero","Un insecto"]}},{"cat":"pie","level":3,"fr":{"q":"Un Romain naît le 1er janvier de l'an 30 av. J.-C. et meurt le 1er janvier de l'an 30 apr. J.-C. Quel âge a-t-il ?","a":"59 ans","w":"Piège : il n'y a pas d'année zéro !\nOn passe directement de l'an 1 av. J.-C. à l'an 1 apr. J.-C.\nDonc 29 + 30 = 59 ans.","opts":["60 ans","61 ans","30 ans","59 ans"]},"es":{"q":"Un romano nace el 1 de enero del año 30 a. C. y muere el 1 de enero del año 30 d. C. ¿Qué edad tiene?","a":"59 años","w":"Trampa: ¡no existe el año cero!\nSe pasa directamente del año 1 a. C. al año 1 d. C.\nAsí que 29 + 30 = 59 años.","opts":["60 años","61 años","30 años","59 años"]}},{"cat":"pie","level":2,"fr":{"q":"Quel jour a vraiment commencé le XXIe siècle ?","a":"Le 1er janvier 2001","w":"Piège : la grande fête de l'an 2000 !\nSans année zéro, le Ier siècle va de l'an 1 à l'an 100.\nLe XXIe commence donc en 2001.","opts":["Le 1er janvier 2001","Le 1er janvier 2000","Le 31 décembre 1999","Le 31 décembre 2000"]},"es":{"q":"¿Qué día empezó de verdad el siglo XXI?","a":"El 1 de enero de 2001","w":"Trampa: ¡la gran fiesta del año 2000!\nSin año cero, el siglo I va del año 1 al 100.\nAsí que el XXI empieza en 2001.","opts":["El 1 de enero de 2001","El 1 de enero de 2000","El 31 de diciembre de 1999","El 31 de diciembre de 2000"]}},{"cat":"pie","level":1,"fr":{"q":"En quel siècle a eu lieu la Révolution française de 1789 ?","a":"Le XVIIIe siècle","w":"Piège : le « 17 » de 1789 !\nLes années 1700 forment le XVIIIe siècle, comme 2026 est au XXIe.","opts":["Le XVIIe siècle","Le XVIIIe siècle","Le XIXe siècle","Le XVIe siècle"]},"es":{"q":"¿En qué siglo tuvo lugar la Revolución francesa de 1789?","a":"El siglo XVIII","w":"Trampa: ¡el «17» de 1789!\nLos años 1700 forman el siglo XVIII, igual que 2026 está en el XXI.","opts":["El siglo XVII","El siglo XVIII","El siglo XIX","El siglo XVI"]}},{"cat":"pie","level":2,"fr":{"q":"Dans le roman de Mary Shelley, comment s'appelle la créature ?","a":"Elle n'a pas de nom","w":"Piège : Frankenstein, c'est le savant, Victor Frankenstein !\nSa créature, elle, n'a jamais reçu de nom.","opts":["Frankenstein","Igor","Elle n'a pas de nom","Dracula"]},"es":{"q":"En la novela de Mary Shelley, ¿cómo se llama la criatura?","a":"No tiene nombre","w":"Trampa: ¡Frankenstein es el científico, Víctor Frankenstein!\nSu criatura nunca recibe un nombre.","opts":["Frankenstein","Igor","No tiene nombre","Drácula"]}},{"cat":"pie","level":2,"fr":{"q":"Combien de fois Sherlock Holmes dit-il « Élémentaire, mon cher Watson » dans les livres de Conan Doyle ?","a":"Jamais","w":"Piège : sa réplique la plus célèbre… n'existe pas dans les livres !\nElle a été popularisée plus tard par les films et les adaptations.","opts":["Une seule fois","Une dizaine de fois","À chaque enquête","Jamais"]},"es":{"q":"¿Cuántas veces dice Sherlock Holmes «Elemental, querido Watson» en los libros de Conan Doyle?","a":"Nunca","w":"Trampa: ¡su frase más famosa no aparece en los libros!\nLa popularizaron más tarde las películas y adaptaciones.","opts":["Una sola vez","Una decena de veces","En cada caso","Nunca"]}},{"cat":"pie","level":2,"fr":{"q":"Dans « L'Empire contre-attaque », que dit exactement Dark Vador à Luke ?","a":"« Non, je suis ton père. »","w":"Piège : tout le monde cite « Luke, je suis ton père » !\nLuke vient d'accuser Vador d'avoir tué son père, et Vador répond : « Non, je suis ton père. »","opts":["« Non, je suis ton père. »","« Luke, je suis ton père. »","« Je suis ton père, Luke. »","« Luke, tu es mon fils. »"]},"es":{"q":"En «El Imperio contraataca», ¿qué le dice exactamente Darth Vader a Luke?","a":"«No, yo soy tu padre.»","w":"Trampa: ¡todo el mundo cita «Luke, yo soy tu padre»!\nLuke acaba de acusar a Vader de matar a su padre, y Vader responde: «No, yo soy tu padre.»","opts":["«No, yo soy tu padre.»","«Luke, yo soy tu padre.»","«Yo soy tu padre, Luke.»","«Luke, tú eres mi hijo.»"]}},{"cat":"pie","level":2,"fr":{"q":"De quelle couleur est la peau de l'ours polaire ?","a":"Noire","w":"Piège : il a l'air tout blanc !\nSous sa fourrure, sa peau est noire, ce qui l'aide à capter la chaleur du soleil.","opts":["Blanche","Noire","Rose","Grise"]},"es":{"q":"¿De qué color es Huye corriendo","w":"Trampa: ¡la leyenda de la cabeza en la arena!\nEl avestruz corre hasta a 70 km/h o se defiende a patadas.\nAgacha la cabeza para dar la vuelta a sus huevos, de ahí el mito.","opts":["Esconde la cabeza en la arena","Huye corriendo","Se hace el muerto","Sale volando"]}},{"cat":"pie","level":2,"fr":{"q":"Combien de vertèbres compte le cou d'une girafe ?","a":"7","w":"Piège : un cou immense, donc plein de vertèbres ?\nNon : 7, comme nous et presque tous les mammifères.\nLes siennes sont juste très longues.","opts":["14","25","7","50"]},"es":{"q":"¿Cuántas vértebras tiene el cuello de una jirafa?","a":"7","w":"Trampa: un cuello enorme, ¿así que muchísimas vértebras?\nNo: 7, como nosotros y casi todos los mamíferos.\nSolo que las suyas son muy largas.","opts":["14","25","7","50"]}},{"cat":"pie","level":2,"fr":{"q":"Un brocanteur te propose une pièce romaine portant la date « 44 av. J.-C. ». Pourquoi est-ce forcément un faux ?","a":"Jésus n'était pas né","w":"Piège : on cherche un détail historique compliqué !\nEn 44 av. J.-C., personne ne pouvait savoir que Jésus naîtrait des années plus tard.","opts":["Les Romains n'avaient pas de pièces","Le métal est trop moderne","César n'a jamais existé","Jésus n'était pas né"]},"es":{"q":"Un anticuario te ofrece una moneda romana con la fecha «44 a. C.». ¿Por qué es falsa seguro?","a":"Jesús no había nacido","w":"Trampa: ¡buscamos un detalle histórico complicado!\nEn el 44 a. C., nadie podía saber que Jesús nacería años después.","opts":["Los romanos no tenían monedas","El metal es demasiado moderno","César nunca existió","Jesús no había nacido"]}},{"cat":"pie","level":3,"fr":{"q":"Quel sommet est le point de la Terre le plus éloigné de son centre ?","a":"Le Chimborazo","w":"Piège : l'Everest est le plus haut… au-dessus du niveau de la mer !\nLa Terre est renflée à l'équateur : le Chimborazo, en Équateur, est le point le plus éloigné du centre.","opts":["Le Chimborazo","L'Everest","Le K2","Le Kilimandjaro"]},"es":{"q":"¿Qué cumbre es el punto de la Tierra más alejado de su centro?","a":"El Chimborazo","w":"Trampa: el Everest es el más alto… ¡sobre el nivel del mar!\nLa Tierra está abultada en el ecuador: el Chimborazo, en Ecuador, es el punto más alejado del centro.","opts":["El Chimborazo","El Everest","El K2","El Kilimanjaro"]}},{"cat":"pie","level":2,"fr":{"q":"Quels Européens ont atteint l'Amérique en premier ?","a":"Les Vikings","w":"Piège : 1492 n'est pas la première fois !\nVers l'an 1000, Leif Erikson et ses Vikings s'installent à Terre-Neuve, au site de L'Anse aux Meadows.","opts":["Les Espagnols de Colomb","Les Vikings","Les Portugais","Les Anglais"]},"es":{"q":"¿Qué europeos llegaron primero a América?","a":"Los vikingos","w":"Trampa: ¡1492 no fue la primera vez!\nHacia el año 1000, Leif Erikson y sus vikingos se instalaron en Terranova, en L'Anse aux Meadows.","opts":["Los españoles de Colón","Los vikingos","Los portugueses","Los ingleses"]}},{"cat":"pie","level":1,"fr":{"q":"Il y a 10 doigts sur 2 mains. Combien y a-t-il de doigts sur 10 mains ?","a":"50","w":"Piège : on multiplie 10 par 10 !\nUne main a 5 doigts, donc 10 mains en ont 50.","opts":["100","20","50","40"]},"es":{"q":"Hay 10 dedos en 2 manos. ¿Cuántos dedos hay en 10 manos?","a":"50","w":"Trampa: ¡multiplicamos 10 por 10!\nUna mano tiene 5 dedos, así que 10 manos tienen 50.","opts":["100","20","50","40"]}},{"cat":"pie","level":1,"fr":{"q":"De tête, vite : 9 × 8 × 7 × 6 × 5 × 4 × 3 × 2 × 1 × 0 = ?","a":"0","w":"Piège : on se lance dans un calcul énorme !\nIl suffisait de lire jusqu'au bout : tout nombre multiplié par 0 donne 0.","opts":["362 880","3 628 800","45","0"]},"es":{"q":"Rápido, de cabeza: 9 × 8 × 7 × 6 × 5 × 4 × 3 × 2 × 1 × 0 = ?","a":"0","w":"Trampa: ¡nos lanzamos a un cálculo enorme!\nBastaba con leer hasta el final: todo número multiplicado por 0 da 0.","opts":["362.880","3.628.800","45","0"]}},{"cat":"pie","level":3,"fr":{"q":"Pour manger le plus de pizza : une pizza de 30 cm de diamè const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const idsOf=c=>CARDS.map((x,k)=>x[0]===c&&(DIFFS[S.diff]||DIFFS.mid).includes(LEVEL[k])?k:-1).filter(k=>k>=0);

/* Random theme for every card (never the same theme twice in a row when several are chosen); inside a theme, unseen questions come first. */
function buildDeck(n,countFirst){
 const cats=activeCats().length?activeCats():CATS.slice();const pools={};const inDeck=new Set(S.deck);
 cats.forEach(c=>{const ids=idsOf(c).filter(k=>!inDeck.has(k));pools[c]=[...shuffle(ids.filter(k=>!USEDSET.has(k))).map(k=>[k,0]),...shuffle(ids.filter(k=>USEDSET.has(k))).map(k=>[k,1])]});
 const out=[];let recycled=0,guard=0,last=S.deck.length?CARDS[S.deck[S.deck.length-1]][0]:null;
 while(out.length<n&&guard++<3000){
  let avail=cats.filter(c=>pools[c].length);
  if(!avail.length){cats.forEach(c=>pools[c]=shuffle(idsOf(c).filter(k=>!out.includes(k))).map(k=>[k,1]));avail=cats.filter(c=>pools[c].length);
   if(!avail.length){cats.forEach(c=>pools[c]=shuffle(idsOf(c)).map(k=>[k,1]));avail=cats.filter(c=>pools[c].length);if(!avail.length)break}}
  const choice=avail.length>1?avail.filter(c=>c!==last):avail;
  const c=choice[Math.random()*choice.length|0];const usedT=new Set([...S.deck,...out].map(k=>TPL[k]));const pc=pools[c];
  let j=pc.findIndex(x=>!x[1]&&!usedT.has(TPL[x[0]]));if(j<0)j=pc.findIndex(x=>!usedT.has(TPL[x[0]]));if(j<0)j=0;const [k,u]=pc.splice(j,1)[0];
  out.push(k);last=c;if(u&&out.length<=countFirst)recycled++;
 }
 return{deck:out,recycled};
}
function ensureDeck(){if(S.i>=S.deck.length){S.deck=S.deck.concat(buildDeck(10,0).deck)}}
function armTimer(){const cid=S.deck[S.i];S.tmax=S.timer&&cid!=null&&CARDS[cid][0]==="rap"?Math.min(S.timer,10):S.timer;S.deadline=Date.now()+S.tmax*1000;S.pausedLeft=null;timeUpFired=false;S.bz=hostBuz()?freshBz():null;S.pen=[]}
const curKey=()=>`${S.gid||"g"}${S.ug?"u"+S.ug:""}.${S.round}.${S.inRound}.${S.i}.${S.tied?S.tied.join("-"):""}`;

/* typed answer vs expected: articles ignored, key words compared with typo/plural tolerance, numbers compared as numbers (words too) */
function textOk(v,e,wrong){
 const re=String(e).trim().toLowerCase(),rv=String(v).trim().toLowerCase();
 if(digits(e)&&digits(e)===String(e).replace(/[^0-9]/g,"")&&/^[\d\s.,]+$/.test(String(e).trim()))return numOf(v)===digits(e);
 if(re.length<=3&&!/\s/.test(re))return rv.replace(/[^\p{L}\p{N}]/gu,"")===re.replace(/[^\p{L}\p{N}]/gu,"");
 const nv=norm(v),ne=norm(e);if(!nv)return false;if(nv===ne)return true;

 if(de&&ew.length<=2)return numOf(v)===de;
 if(!ew.length)return false;
 /* the key words: those of the answer that no wrong proposal uses */
 const ww=(wrong||[]).flatMap(o=>words(o));let K=ew.filter(w=>!ww.some(x=>wmatch(x,w)));if(!K.length)K=ew;
 const hit=K.filter(w=>vw.some(x=>wmatch(x,w))).length;
 if(K.length===1)return hit===1;
 /* several key words: for a long answer one key word is enough; for two words, the main (longest) one */
 const main=K.reduce((m,w)=>w.length>m.length?w:m,"");
 if(K.length>=3)return hit>=1;
 return vw.some(x=>wmatch(x,main))||hit>=2;
}

 for(const w of [CARDS[id][1][2],CARDS[id][2][2]])for(const sent of String(w||"").split(/\n|[.!?]\s+/)){
  if(!/accept|aussi|tambi[eé]n|\bval(e|en)\b|serait|ser[ií]a/i.test(sent))continue;
  const sw=words(sent).filter(x=>x.length>=3&&!ALTSTOP.has(x));
  if(vw.some(a=>sw.some(b=>wmatch(a,b))))return true}

  case"closemenu":case"closemenu2":closeMenu();renderMenu();break;
  case"board":S.board=true;renderMenu();break;
  case"recap":menuOpen=true;S.recap=true;renderMenu();break;
  case"qcm":S.qcm=v;render();break;
  case"sharelink":doShare(inviteMsg(v,true),inviteLink(v),b);break;
  case"sharegame":doShare(gameMsg(),createLink(),b);break;
  case"play":S.play=v;render();break;
  case"buzz":{if(!V||V.phase!=="q"||!V.bz||V.bz.who!=null)break;b.disabled=true;b.textContent="…";if(NR)NR.presence({buzz:{k:keyNow(),n:V.bz.n,t:Date.now()}}).catch(()=>{});if(ROLE()==="host")setTimeout(buzzCheck,150);break}
  case"copylink":{const inp=document.getElementById("invlink");const ok=()=>{b.textContent=L().copied};
   try{navigator.clipboard.writeText(inp.value).then(ok,()=>{inp.select();ok()})}catch(err){inp.select();ok()}break}
  case"ready":{const key=keyNow();myRdy=myRdy===key?null:key;if(NR)NR.presence({rdy:myRdy}).catch(()=>{});const b2=document.getElementById("rdybtn");if(b2){b2.textContent=myRdy?L().readyOn:L().ready;b2.classList.toggle("on",!!myRdy)}refreshLive();checkAdvance();break}
  case"gohome2":goHome();break;
  case"quit":if(armed==="quit"){armed=null;closeMenu();S.inGame=false;H=[];S.players.forEach(p=>p.s=0);S.phase="home";render()}else{arm("quit");renderMenu()}break;
  case"pause":{if(!ctl||S.phase!=="q")break;if(S.pausedLeft==null)S.pausedLeft=remaining();else{S.deadline=Date.now()+S.pausedLeft*1000;S.pausedLeft=null}save();publishSt();const m=document.getElementById("tmsg");if(m)m.textContent=S.pausedLeft!=null?L().paused:(S.online?L().auto:L().tapPause);break}
  case"reveal":if(ctl)doReveal();break;
  case"skip":if(ctl){push();markUsed(S.deck[S.i]);S.i++;ensureDeck();S.notice="";armTimer();render()}break;
  case"chip":{if(!ctl)break;const k=+v,i=S.correct.indexOf(k);i<0?S.correct.push(k):S.correct.splice(i,1);b.setAttribute("aria-pressed",i<0);{const vb=document.getElementById("vbtn");if(vb)vb.textContent=L().validate(S.correct.length)}save();publishSt();break}
  case"none":if(ctl){S.correct=[];render()}break;
  case"all":if(ctl){S.correct=(S.tied||S.players.map((_,k)=>k)).slice();render()}break;
  case"validate":if(ctl)score();break;
  case"nextround":if(ctl){push();S.round++;S.inRound=0;S.phase="q";armTimer();render()}break;
  case"tie":if(ctl){push();S.tied=lastOnes(S);S.phase="q";armTimer();render()}break;
  case"verdict":if(ctl){push();S.phase="final";S.revealed=false;render()}break;
  case"drum":if(ctl){push();S.revealed=true;S.drumAt=Date.now();render()}break;
  case"othergage":if(ctl){S.gage++;render()}break;
  case"rematch":if(ctl){if(S.online){const pk=presentKeys();const keep=S.players.filter(p=>pk.has(p.k));if(keep.length>=2)S.players=keep}startGame()}break;
  case"gohome":S.inGame=false;H=[];S.phase=S.online?"lobby":"home";render();break;
 }
});
function score(){
 push();
 if(S.online&&S.tied){const pk=presentKeys();const st=S.tied.filter(i=>S.players[i]&&pk.has(S.players[i].k));if(st.length)S.tied=st}S.correct.forEach(k=>S.players[k].s++);
 if(S.online)(S.pen||[]).forEach(i=>{if(S.players[i])S.players[i].s--});
 {const lid=S.deck[S.i];S.log=(S.log||[]).concat([{id:lid,pen:(S.pen||[]).map(i=>S.players[i]&&S.players[i].k).filter(Boolean),ans:S.answers,cor:S.correct.map(i=>S.players[i]&&S.players[i].k).filter(Boolean)}])}
 S.i++;ensureDeck();S.answers=null;
 if(S.tied){const rem=S.tied.filter(k=>!S.correct.includes(k));if(rem.length>=1&&rem.length<S.tied.length)S.tied=rem;S.correct=[];
  if(S.tied.length===1){S.phase="final";S.revealed=false}else{S.phase="q";armTimer()}return render()}
 S.correct=[];S.inRound++;if(S.inRound>=S.per)S.phase="summary";else{S.phase="q";armTimer()}render();
}

if(S.phase==="q"&&!S.deadline)armTimer();
/* No zoom on quick repeated taps (buzzer, answers) */
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
{let lastT=0;document.addEventListener("touchend",e=>{const now=Date.now();const t=e.target.closest("button,.opt,.pc,.buzz,.chip,.tile,.diff,.preset");if(now-lastT<350&&t){e.preventDefault();if(!t.disabled)t.click()}lastT=now},{passive:false})}
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
render();
initCaps();

</script>
