":"1936","w":"La Guerra Civil duró de 1936 a 1939.\nDespués llegó la dictadura de Franco, que se prolongó hasta 1975.","opts":["1923","1931","1936","1939"]}},{"cat":"cul","level":1,"fr":{"q":"En combien d'arrondissements Paris est-il divisé ?","a":"20","w":"Paris compte 20 arrondissements.\nIls sont numérotés en spirale à partir du centre, dans le sens des aiguilles d'une montre.","opts":["12","20","16","24"]},"es":{"q":"¿En cuántos distritos (arrondissements) está dividido París?","a":"20","w":"París tiene 20 distritos.\nSe numeran en espiral desde el centro, en el sentido de las agujas del reloj.","opts":["12","20","16","24"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville est né Napoléon Bonaparte ?","a":"Ajaccio","w":"Napoléon est né à Ajaccio, en Corse, en 1769.\nLa Corse était devenue française l'année précédente.","opts":["Bastia","Paris","Nice","Ajaccio"]},"es":{"q":"¿En qué ciudad nació Napoleón Bonaparte?","a":"Ajaccio","w":"Napoleón nació en Ajaccio, Córcega, en 1769.\nLa isla se había vuelto francesa solo un año antes.","opts":["Bastia","París","Niza","Ajaccio"]}},{"cat":"cul","level":3,"fr":{"q":"Qui sont les deux coprinces d'Andorre ?","a":"Le président français et l'évêque d'Urgell","w":"Andorre a deux chefs d'État : le président de la République française et l'évêque d'Urgell, en Catalogne.\nCe système remonte au Moyen Âge.","opts":["Le roi d'Espagne et le président français","Le président français et l'évêque d'Urgell","Le pape et le roi d'Espagne","Le président catalan et le préfet des Pyrénées"]},"es":{"q":"¿Quiénes son los dos copríncipes de Andorra?","a":"El presidente francés y el obispo de Urgel","w":"Andorra tiene dos jefes de Estado: el presidente de la República Francesa y el obispo de Urgel.\nEste sistema se remonta a la Edad Media.","opts":["El rey de España y el presidente francés","El presidente francés y el obispo de Urgel","El papa y el rey de España","El presidente catalán y el prefecto de los Pirineos"]}},{"cat":"cul","level":2,"fr":{"q":"Laquelle de ces villes espagnoles se trouve sur le continent africain ?","a":"Melilla","w":"Melilla et Ceuta sont deux villes autonomes espagnoles situées en Afrique du Nord.\nElles sont entourées par le Maroc.","opts":["Algésiras","Tarifa","Almería","Melilla"]},"es":{"q":"¿Cuál de estas ciudades españolas está en el continente africano?","a":"Melilla","w":"Melilla y Ceuta son ciudades autónomas españolas en el norte de África.\nAmbas limitan con Marruecos.","opts":["Algeciras","Tarifa","Almería","Melilla"]}},{"cat":"cul","level":2,"fr":{"q":"De quelle ville la bouillabaisse est-elle la spécialité ?","a":"Marseille","w":"La bouillabaisse est une soupe de poissons de roche typique de Marseille.\nElle se sert avec une rouille et des croûtons.","opts":["Bordeaux","Brest","Marseille","Lyon"]},"es":{"q":"¿De qué ciudad es típica la bullabesa (bouillabaisse)?","a":"Marsella","w":"La bullabesa es una sopa de pescados de roca típica de Marsella.\nSe sirve con salsa rouille y picatostes.","opts":["Burdeos","Brest","Marsella","Lyon"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quel océan se trouve l'île de La Réunion ?","a":"L'océan Indien","w":"La Réunion est un département français de l'océan Indien.\nElle se trouve à l'est de Madagascar, près de l'île Maurice.","opts":["L'océan Indien","L'océan Atlantique","L'océan Pacifique","L'océan Austral"]},"es":{"q":"¿En qué océano se encuentra la isla de La Reunión?","a":"El océano Índico","w":"La Reunión es un departamento francés en el océano Índico.\nEstá al este de Madagascar, cerca de Mauricio.","opts":["El océano Índico","El océano Atlántico","El océano Pacífico","El océano Antártico"]}},{"cat":"cul","level":1,"fr":{"q":"Pour quelle fête Valence brûle-t-elle d'immenses figures en carton en mars ?","a":"Las Fallas","w":"Les Fallas se terminent par la « Cremà », la nuit du 19 mars.\nOn y brûle des monuments satiriques appelés « ninots ».","opts":["La Tomatina","Moros y Cristianos","Las Fallas","La Feria de Abril"]},"es":{"q":"¿En qué fiesta Valencia quema enormes figuras de cartón en marzo?","a":"Las Fallas","w":"Las Fallas terminan con la Cremà, la noche del 19 de marzo.\nSe queman monumentos satíricos llenos de ninots.","opts":["La Tomatina","Moros y Cristianos","Las Fallas","La Feria de Abril"]}},{"cat":"cul","level":2,"fr":{"q":"Qui chantait « Non, je ne regrette rien » ?","a":"Édith Piaf","w":"Édith Piaf a enregistré cette chanson en 1960.\nElle est aussi célèbre pour « La Vie en rose ».","opts":["Édith Piaf","Dalida","Barbara","Juliette Gréco"]},"es":{"q":"¿Quién cantaba «Non, je ne regrette rien»?","a":"Édith Piaf","w":"Édith Piaf grabó esta canción en 1960.\nTambién es famosa por «La Vie en rose».","opts":["Édith Piaf","Dalida","Barbara","Juliette Gréco"]}},{"cat":"cul","level":1,"fr":{"q":"Quel roi de France était surnommé le Roi-Soleil ?","a":"Louis XIV","w":"Louis XIV a choisi le soleil comme emblème.\nIl a fait du château de Versailles le siège du pouvoir.","opts":["Louis XVI","François Ier","Henri IV","Louis XIV"]},"es":{"q":"¿Qué rey de Francia era conocido como el Rey Sol?","a":"Luis XIV","w":"Luis XIV eligió el sol como emblema.\nConvirtió el palacio de Versalles en la sede del poder.","opts":["Luis XVI","Francisco I","Enrique IV","Luis XIV"]}},{"cat":"cul","level":3,"fr":{"q":"Combien de fois Paris a-t-il accueilli les Jeux olympiques d'été ?","a":"3","w":"Paris a organisé les Jeux en 1900, 1924 et 2024.\nLondres est la seule autre ville à les avoir accueillis trois fois.","opts":["1","3","2","4"]},"es":{"q":"¿Cuántas veces ha organizado París los Juegos Olímpicos de verano?","a":"3","w":"París organizó los Juegos en 1900, 1924 y 2024.\nLondres es la única otra ciudad que los ha acogido tres veces.","opts":["1","3","2","4"]}},{"cat":"cul","level":2,"fr":{"q":"Dans quelle ville Jeanne d'Arc a-t-elle été brûlée en 1431 ?","a":"Rouen","w":"Jeanne d'Arc a été jugée et brûlée à Rouen.\nElle est surnommée la Pucelle d'Orléans, ville qu'elle avait libérée.","opts":["Orléans","Reims","Paris","Rouen"]},"es":{"q":"¿En qué ciudad fue quemada Juana de Arco en 1431?","a":"Ruan","w":"Juana de Arco fue juzgada y quemada en Ruan.\nSe la conoce como la Doncella de Orleans, ciudad que liberó.","opts":["Orleans","Reims","París","Ruan"]}},{"cat":"cul","level":2,"fr":{"q":"Quel jour sort traditionnellement le beaujolais nouveau ?","a":"Le troisième jeudi de novembre","w":"Le beaujolais nouveau est mis en vente le troisième jeudi de novembre.\nIl s'agit d'un vin primeur, à boire jeune.","opts":["Le premier lundi d'octobre","Le troisième jeudi de novembre","Le 11 novembre","Le dernier vendredi de septembre"]},"es":{"q":"¿Qué día sale tradicionalmente el beaujolais nouveau?","a":"El tercer jueves de noviembre","w":"El beaujolais nouveau sale a la venta el tercer jueves de noviembre.\nEs un vino joven, pensado para beberse pronto.","opts":["El primer lunes de octubre","El tercer jueves de noviembre","El 11 de noviembre","El último viernes de septiembre"]}},{"cat":"cul","level":2,"fr":{"q":"Combien de Tours de France consécutifs l'Espagnol Miguel Indurain a-t-il gagnés ?","a":"5","w":"Miguel Indurain a remporté le Tour cinq fois de suite, de 1991 à 1995.\nIl a été le premier coureur à réussir cinq victoires consécutives.","opts":["5","3","4","7"]},"es":{"q":"¿Cuántos Tours de Francia consecutivos ganó Miguel Induráin?","a":"5","w":"Induráin ganó el Tour cinco veces seguidas, de 1991 a 1995.\nFue el primer ciclista en lograr cinco victorias consecutivas.","opts":["5","3","4","7"]}},{"cat":"cul","level":2,"fr":{"q":"Comment s'appelle la figure féminine qui symbolise la République française ?","a":"Marianne","w":"Marianne porte un bonnet phrygien, symbole de liberté.\nSon buste trône dans toutes les mairies de France.","opts":["Jeanne","Liberté","Marianne","Gabrielle"]},"es":{"q":"¿Cómo se llama la figura femenina que simboliza la República francesa?","a":"Marianne","w":"Marianne lleva un gorro frigio, símbolo de libertad.\nSu busto preside todos los ayuntamientos de Francia.","opts":["Jeanne","Liberté","Marianne","Gabrielle"]}},{"cat":"cul","level":2,"fr":{"q":"Quels sont les deux symboles des armoiries de Madrid ?","a":"Un ours et un arbousier","w":"L'ours et l'arbousier, le « madroño », figurent sur le blason de Madrid.\nOn peut voir leur statue à la Puerta del Sol.","opts":["Un ours et un arbousier","Un lion et un château","Un taureau et un olivier","Un aigle et une grenade"]},"es":{"q":"¿Cuáles son los dos símbolos del escudo de Madrid?","a":"El oso y el madroño","w":"El oso y el madroño aparecen en el escudo de Madrid.\nSu estatua es un punto de encuentro clásico en la Puerta del Sol.","opts":["El oso y el madroño","El león y el castillo","El toro y el olivo","El águila y la granada"]}},{"cat":"cul","level":2,"fr":{"q":"Quelle devise latine figure sur les armoiries de l'Espagne ?","a":"Plus Ultra","w":"« Plus Ultra » signifie « plus loin ».\nElle s'enroule autour des colonnes d'Hercule et date de Charles Quint.","opts":["Veni Vidi Vici","Fluctuat nec mergitur","Semper Fidelis","Plus Ultra"]},"es":{"q":"¿Qué lema en latín aparece en el escudo de España?","a":"Plus Ultra","w":"«Plus Ultra» significa «más allá».\nRodea las columnas de Hércules y procede de la época de Carlos V.","opts":["Veni Vidi Vici","Fluctuat nec mergitur","Semper Fidelis","Plus Ultra"]}},{"cat":"cul","level":2,"fr":{"q":"Quel fleuve traverse Bordeaux ?","a":"La Garonne","w":"Bordeaux est construite sur un croissant de la Garonne, d'où son surnom de « port de la Lune ».\nPlus en aval, la Garonne rejoint la Dordogne pour former la Gironde.","opts":["La Dordogne","La Loire","La Garonne","Le Lot"]},"es":{"q":"¿Qué río atraviesa Burdeos?","a":"El Garona","w":"Burdeos se asienta en una curva del Garona, de ahí su apodo de «puerto de la Luna».\nMás abajo, el Garona se une al Dordoña para formar la Gironda.","opts":["El Dordoña","El Loira","El Garona","El Lot"]}},{"cat":"cul","level":3,"fr":{"q":"Par quel traité Gibraltar est-il devenu britannique en 1713 ?","a":"Le traité d'Utrecht","w":"Le traité d'Utrecht a mis fin à la guerre de Succession d'Espagne.\nL'Espagne y a cédé Gibraltar à la Grande-Bretagne.","opts":["Le traité de Versailles","Le traité d'Utrecht","Le traité des Pyrénées","Le traité de Tordesillas"]},"es":{"q":"¿Por qué tratado pasó Gibraltar a ser británico en 1713?","a":"El Tratado de Utrecht","w":"El Tratado de Utrecht puso fin a la guerra de Sucesión española.\nEn él España cedió Gibraltar a Gran Bretaña.","opts":["El Tratado de Versalles","El Tratado de Utrecht","El Tratado de los Pirineos","El Tratado de Tordesillas"]}},{"cat":"cul","level":2,"fr":{"q":"Quel est le symbole des pèlerins du chemin de Saint-Jacques-de-Compostelle ?","a":"La coquille Saint-Jacques","w":"Les pèlerins portent une coquille accrochée à leur sac.\nOn la retrouve aussi sur les bornes qui balisent le chemin.","opts":["La croix de Malte","La coquille Saint-Jacques","L'épi de blé","La clé"]},"es":{"q":"¿Cuál es el símbolo de los peregrinos del Camino de Santiago?","a":"La concha de vieira","w":"Los peregrinos llevan una concha colgada de la mochila.\nTambién aparece en los mojones que señalan el Camino.","opts":["La cruz de Malta","La concha de vieira","La espiga de trigo","La llave"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle ville se déroule la Feria de Abril ?","a":"Séville","w":"La Feria de Abril de Séville a lieu une ou deux semaines après Pâques.\nOn y danse des sévillanes dans les « casetas » en tenue traditionnelle.","opts":["Malaga","Cordoue","Séville","Valence"]},"es":{"q":"¿En qué ciudad se celebra la Feria de Abril?","a":"Sevilla","w":"La Feria de Abril de Sevilla se celebra una o dos semanas después de Semana Santa.\nEn las casetas se bailan sevillanas con traje de flamenca.","opts":["Málaga","Córdoba","Sevilla","Valencia"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quelle région espagnole produit-on l'essentiel du cava ?","a":"La Catalogne","w":"La grande majorité du cava vient du Penedès, en Catalogne.\nIl est élaboré selon la méthode traditionnelle, comme le champagne.","opts":["L'Andalousie","La Galice","La Rioja","La Catalogne"]},"es":{"q":"¿En qué comunidad se produce la mayor parte del cava?","a":"Cataluña","w":"La gran mayoría del cava procede del Penedès, en Cataluña.\nSe elabora por el método tradicional, como el champán.","opts":["Andalucía","Galicia","La Rioja","Cataluña"]}},{"cat":"cul","level":1,"fr":{"q":"Quel dessert espagnol ressemble beaucoup à la crème brûlée française ?","a":"La crema catalana","w":"La crema catalana est parfumée au citron et à la cannelle.\nComme la crème brûlée, elle est recouverte de sucre caramélisé.","opts":["La crema catalana","Le flan","La natilla","L'arroz con leche"]},"es":{"q":"¿Qué postre español se parece mucho a la crème brûlée francesa?","a":"La crema catalana","w":"La crema catalana se aromatiza con limón y canela.\nComo la crème brûlée, lleva una capa de azúcar caramelizado.","opts":["La crema catalana","El flan","Las natillas","El arroz con leche"]}},{"cat":"cul","level":1,"fr":{"q":"Dans quoi trempe-t-on traditionnellement les churros en Espagne ?","a":"Du chocolat chaud","w":"Les churros se dégustent avec un chocolat chaud épais.\nC'est un petit-déjeuner classique, surtout le 1er janvier au matin.","opts":["Du café au lait","Du miel","Du chocolat chaud","De la crème fouettée"]},"es":{"q":"¿En qué se mojan tradicionalmente los churros en España?","a":"Chocolate caliente","w":"Los churros se toman con un chocolate caliente espeso.\nEs un desayuno clásico, sobre todo la mañana del 1 de enero.","opts":["Café con leche","Miel","Chocolate caliente","Nata montada"]}},{"cat":"cul","level":2,"fr":{"q":"De quelle région viennent les « pintxos », petites bouchées souvent piquées sur du pain ?","a":"Le Pays basque","w":"Les pintxos sont la version basque des tapas.\nSaint-Sébastien en a fait une véritable spécialité.","opts":["Le Pays basque","L'Andalousie","La Castille","Les Baléares"]},"es":{"q":"¿De qué región son típicos los pintxos?","a":"País Vasco","w":"Los pintxos son la versión vasca de las tapas.\nSan Sebastián los ha convertido en todo un emblema.","opts":["País Vasco","Andalucía","Castilla","Baleares"]}},{"cat":"cul","level":3,"fr":{"q":"Dans quelle ville se trouve le Théâtre-musée Dalí ?","a":"Figueres","w":"Salvador Dalí est né à Figueres et y a créé son propre musée.\nIl y est aussi enterré, sous la scène du théâtre.","opts":["Cadaqués","Figueres","Gérone","Barcelone"]},"es":{"q":"¿En qué ciudad está el Teatro-Museo Dalí?","a":"Figueres","w":"Salvador Dalí nació en Figueres y allí creó su propio museo.\nTambién está enterrado en él, bajo el escenario.","opts":["Cadaqués","Figueres","Girona","Barcelona"]}},{"cat":"cul","level":1,"fr":{"q":"Quel groupe sévillan a chanté le tube planétaire « Macarena » ?","a":"Los del Río","w":"« Macarena » a été enregistrée par Los del Río en 1993.\nLe remix de 1995 en a fait un succès mondial.","opts":["Gipsy Kings","Las Ketchup","Mecano","Los del Río"]},"es":{"q":"¿Qué dúo sevillano cantó el éxito mundial «Macarena»?","a":"Los del Río","w":"«Macarena» la grabaron Los del Río en 1993.\nUn remix de 1995 la convirtió en un éxito mundial.","opts":["Gipsy Kings","Las Ketchup","Mecano","Los del Río"]}},{"cat":"cul","level":1,"fr":{"q":"Comment s'appelle le stade du Paris Saint-Germain ?","a":"Le Parc des Princes","w":"Le PSG joue au Parc des Princes, dans le 16e arrondissement.\nLe Vélodrome est le stade de l'Olympique de Marseille.","opts":["Le Stade de France","Le Vélodrome","Le Stade Charléty","Le Parc des Princes"]},"es":{"q":"¿Cómo se llama el estadio del Paris Saint-Germain?","a":"El Parque de los Príncipes","w":"El PSG juega en el Parque de los Príncipes, en el distrito 16.\nEl Vélodrome es el estadio del Olympique de Marsella.","opts":["El Stade de France","El Vélodrome","El Estadio Charléty","El Parque de los Príncipes"]}},{"cat":"cul","level":2,"fr":{"q":"Quelles rivières se rejoignent à Lyon ?","a":"Le Rhône et la Saône","w":"Le Rhône et la Saône se rejoignent au sud de Lyon.\nLe quartier qui occupe ce point s'appelle d'ailleurs La Confluence.","opts":["La Loire et l'Allier","Le Rhône et la Saône","La Seine et la Marne","La Garonne et le Tarn"]},"es":{"q":"¿Qué ríos confluyen en Lyon?","a":"El Ródano y el Saona","w":"El Ródano y el Saona se unen al sur de Lyon.\nEl barrio situado en ese punto se llama precisamente Confluence.","opts":["El Loira y el Allier","El Ródano y el Saona","El Sena y el Marne","El Garona y el Tarn"]}},{"cat":"cul","level":1,"fr":{"q":"De quelle région française vient le camembert ?","a":"La Normandie","w":"Le camembert porte le nom d'un village de l'Orne, en Normandie.\nLe camembert de Normandie AOP est fait au lait cru de vache.","opts":["La Normandie","La Bourgogne","L'Auvergne","La Savoie"]},"es":{"q":"¿De qué región francesa es el camembert?","a":"Normandía","w":"El camembert toma su nombre de un pueblo del Orne, en Normandía.\nEl camembert de Normandía con denominación se hace con leche cruda de vaca.","opts":["Normandía","Borgoña","Auvernia","Saboya"]}},{"cat":"cul","level":3,"fr":{"q":"Quel architecte a conçu la pyramide de verre du Louvre ?","a":"Ieoh Ming Pei","w":"La pyramide d'Ieoh Ming Pei a été inaugurée en 1989.\nElle sert d'entrée principale au musée.","opts":["Jean Nouvel","Renzo Piano","Ieoh Ming Pei","Frank Gehry"]},"es":{"q":"¿Qué arquitecto diseñó la pirámide de cristal del Louvre?","a":"Ieoh Ming Pei","w":"La pirámide de Ieoh Ming Pei se inauguró en 1989.\nEs la entrada principal del museo.","opts":["Jean Nouvel","Renzo Piano","Ieoh Ming Pei","Frank Gehry"]}},{"cat":"cul","level":1,"fr":{"q":"En quelle année Barcelone a-t-elle accueilli les Jeux olympiques ?","a":"1992","w":"Les Jeux de Barcelone ont eu lieu à l'été 1992.\nLa même année, Séville accueillait l'Exposition universelle.","opts":["1988","1992","1996","2000"]},"es":{"q":"¿En qué año se celebraron los Juegos Olímpicos de Barcelona?","a":"1992","w":"Los Juegos de Barcelona se celebraron en el verano de 1992.\nEse mismo año Sevilla acogió la Exposición Universal.","opts":["1988","1992","1996","2000"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a des aiguilles mais ne pique jamais ?","a":"Une horloge","w":"Le piège : penser à quelque chose qui pique, comme le sapin ou le hérisson.\nLes aiguilles d'une horloge indiquent l'heure.\nElles ne piquent personne : c'est une horloge.","opts":["Une horloge","Un sapin","Un hérisson","Un cactus"]},"es":{"q":"¿Qué tiene agujas pero nunca pincha?","a":"Un reloj","w":"Trampa: pensar en algo que pincha, como el pino o el erizo.\nLas agujas de un reloj marcan la hora.\nNo pinchan a nadie: es un reloj.","opts":["Un reloj","Un pino","Un erizo","Un cactus"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a quatre pieds mais ne peut pas marcher ?","a":"Une table","w":"Le piège : chercher un animal.\nUne table a quatre pieds, mais elle ne bouge pas.\nUne chaise serait aussi acceptée.","opts":["Un chien","Une table","Un cheval","Un bébé"]},"es":{"q":"¿Qué tiene cuatro patas pero no puede caminar?","a":"Una mesa","w":"Trampa: buscar un animal.\nUna mesa tiene cuatro patas, pero no se mueve.\nUna silla también valdría.","opts":["Un perro","Una mesa","Un caballo","Un bebé"]}},{"cat":"eni","level":2,"fr":{"q":"Je fais le tour du monde sans jamais quitter mon coin. Qui suis-je ?","a":"Un timbre","w":"Le piège : penser à un moyen de transport.\nUn timbre est collé dans le coin de l'enveloppe.\nIl voyage partout avec la lettre sans bouger de son coin.","opts":["Un avion","Une valise","Un timbre","Un globe"]},"es":{"q":"Doy la vuelta al mundo sin salir de mi esquina. ¿Qué soy?","a":"Un sello","w":"Trampa: pensar en un medio de transporte.\nEl sello va pegado en la esquina del sobre.\nViaja por todo el mundo con la carta sin moverse de su esquina.","opts":["Un avión","Una maleta","Un sello","Un globo terráqueo"]}},{"cat":"eni","level":1,"fr":{"q":"Plus il y en a, moins on y voit. Qu'est-ce que c'est ?","a":"L'obscurité","w":"Le piège : penser à quelque chose qui éblouit.\nPlus il fait noir, moins on voit.\nC'est l'obscurité (le brouillard serait aussi accepté).","opts":["La lumière","Le soleil","Les lunettes","L'obscurité"]},"es":{"q":"Cuanto más hay, menos se ve. ¿Qué es?","a":"La oscuridad","w":"Trampa: pensar en algo que deslumbra.\nCuanto más oscuro está, menos se ve.\nEs la oscuridad (la niebla también valdría).","opts":["La luz","El sol","Las gafas","La oscuridad"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qu'on peut attraper mais jamais lancer ?","a":"Un rhume","w":"Le piège : penser à un objet qu'on attrape au vol.\nUn ballon, ça se lance aussi.\nUn rhume, on l'attrape, mais impossible de le lancer.","opts":["Un rhume","Un ballon","Une balle","Un frisbee"]},"es":{"q":"¿Qué se puede pillar pero nunca lanzar?","a":"Un resfriado","w":"Trampa: pensar en un objeto que se atrapa al vuelo.\nUn balón también se lanza.\nUn resfriado se pilla, pero no hay forma de lanzarlo.","opts":["Un resfriado","Un balón","Una pelota","Un frisbi"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai un lit mais je ne dors jamais, et je cours sans avoir de jambes. Qui suis-je ?","a":"Une rivière","w":"Le piège : penser à un vrai lit ou à un animal.\nUne rivière coule dans son lit.\nEt on dit qu'une rivière court : c'est elle.","opts":["Un hôpital","Une rivière","Un lièvre","Un hamac"]},"es":{"q":"Tengo lecho pero nunca duermo, y corro sin tener piernas. ¿Qué soy?","a":"Un río","w":"Trampa: pensar en una cama de verdad o en un animal.\nEl río corre por su lecho.\nTiene lecho y corre sin piernas: es el río.","opts":["Un hospital","Un río","Una liebre","Una hamaca"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce que tu peux donner à quelqu'un tout en le gardant ?","a":"Ta parole","w":"Le piège : penser à un objet, qu'on perd quand on le donne.\nOn donne sa parole, puis on la tient.\nOn l'a donnée et on la garde : c'est ta parole.","opts":["Ton manteau","Ton argent","Ta parole","Ta place"]},"es":{"q":"¿Qué puedes dar a alguien y aun así quedártelo?","a":"Tu palabra","w":"Trampa: pensar en un objeto, que se pierde al darlo.\nDas tu palabra y luego la mantienes.\nLa has dado y sigue siendo tuya: es tu palabra.","opts":["Tu abrigo","Tu dinero","Tu palabra","Tu asiento"]}},{"cat":"eni","level":3,"fr":{"q":"Un homme habite au 10e étage. Le soir, il prend l'ascenseur jusqu'au 7e et finit à pied, sauf les jours de pluie où il monte directement au 10e. Pourquoi ?","a":"Il est trop petit pour atteindre le bouton 10","w":"Le piège : chercher une raison sportive ou une panne.\nIl est petit et n'atteint que le bouton du 7e.\nLes jours de pluie, il appuie sur le 10 avec son parapluie.","opts":["Il fait du sport","L'ascenseur est en panne","Il rend visite à un voisin","Il est trop petit pour atteindre le bouton 10"]},"es":{"q":"Un hombre vive en un 10.º piso. Por la tarde sube en ascensor hasta el 7.º y sigue a pie, salvo los días de lluvia, que sube directo al 10.º. ¿Por qué?","a":"Es demasiado bajito para llegar al botón del 10","w":"Trampa: buscar un motivo deportivo o una avería.\nEs bajito y solo llega al botón del 7.º.\nLos días de lluvia pulsa el 10 con el paraguas.","opts":["Hace deporte","El ascensor está averiado","Visita a un vecino","Es demasiado bajito para llegar al botón del 10"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qui marche à quatre pattes le matin, sur deux pattes à midi et sur trois le soir ?","a":"L'être humain","w":"Le piège : chercher un animal.\nAu matin de la vie, le bébé marche à quatre pattes.\nAdulte, il marche sur deux jambes, et vieux, avec une canne : l'être humain.","opts":["L'être humain","Le chat","Le kangourou","Le chien"]},"es":{"q":"¿Qué anda a cuatro patas por la mañana, a dos al mediodía y a tres por la noche?","a":"El ser humano","w":"Trampa: buscar un animal.\nEn la mañana de la vida, el bebé gatea a cuatro patas.\nDe adulto anda con dos piernas y de viejo con bastón: el ser humano.","opts":["El ser humano","El gato","El canguro","El perro"]}},{"cat":"eni","level":2,"fr":{"q":"Je suis plus léger qu'une plume, mais même l'homme le plus fort ne peut pas me retenir plus de quelques minutes. Qui suis-je ?","a":"Le souffle","w":"Le piège : penser à un objet léger qu'on tient dans la main.\nOn peut retenir son souffle, mais pas longtemps.\nIl ne pèse rien : c'est le souffle.","opts":["Une bulle","Le souffle","Un ballon","Une feuille"]},"es":{"q":"Soy más ligero que una pluma, pero ni el hombre más fuerte puede contenerme más de unos minutos. ¿Qué soy?","a":"El aliento","w":"Trampa: pensar en un objeto ligero que se sujeta con la mano.\nSe puede contener el aliento, pero no mucho tiempo.\nNo pesa nada: es el aliento.","opts":["Una burbuja","El aliento","Un globo","Una hoja"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui a des feuilles mais n'est pas une plante ?","a":"Un livre","w":"Le piège : penser à un végétal.\nLes pages d'un livre s'appellent aussi des feuilles.\nUn livre a des feuilles sans être une plante (un cahier serait aussi accepté).","opts":["Un chêne","Une salade","Un livre","Un arbre"]},"es":{"q":"¿Qué tiene hojas pero no es una planta?","a":"Un libro","w":"Trampa: pensar en un vegetal.\nLas páginas de un libro también se llaman hojas.\nEl libro tiene hojas sin ser una planta (un cuaderno también valdría).","opts":["Un roble","Una lechuga","Un libro","Un árbol"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qu'il faut casser avant de pouvoir s'en servir ?","a":"Un œuf","w":"Le piège : penser à un objet qu'on casse par accident.\nUn verre cassé ne sert plus à rien.\nUn œuf, lui, il faut le casser pour le cuisiner.","opts":["Un verre","Une assiette","Un téléphone","Un œuf"]},"es":{"q":"¿Qué hay que romper antes de poder usarlo?","a":"Un huevo","w":"Trampa: pensar en un objeto que se rompe por accidente.\nUn vaso roto ya no sirve para nada.\nUn huevo, en cambio, hay que romperlo para cocinarlo.","opts":["Un vaso","Un plato","Un teléfono","Un huevo"]}},{"cat":"eni","level":1,"fr":{"q":"Qu'est-ce qui monte et descend sans jamais bouger ?","a":"Un escalier","w":"Le piège : penser à quelque chose qui bouge vraiment, comme l'ascenseur.\nOn dit qu'un escalier monte ou descend.\nPourtant il ne bouge jamais : c'est l'escalier.","opts":["Un escalier","Un ascenseur","Un yoyo","Une balançoire"]},"es":{"q":"¿Qué sube y baja sin moverse nunca?","a":"Una escalera","w":"Trampa: pensar en algo que se mueve de verdad, como el ascensor.\nSe dice que una escalera sube o baja.\nPero nunca se mueve: es la escalera.","opts":["Una escalera","Un ascensor","Un yoyó","Un columpio"]}},{"cat":"eni","level":2,"fr":{"q":"Je suis noir quand on m'achète, rouge quand on m'utilise et gris quand on me jette. Qui suis-je ?","a":"Le charbon","w":"Le piège : s'arrêter à la couleur noire (café, chocolat).\nLe charbon est noir, puis rougeoie quand il brûle.\nIl finit en cendres grises : c'est le charbon.","opts":["Le café","Le charbon","Le pneu","Le chocolat"]},"es":{"q":"Soy negro cuando me compran, rojo cuando me usan y gris cuando me tiran. ¿Qué soy?","a":"El carbón","w":"Trampa: quedarse en el color negro (café, chocolate).\nEl carbón es negro y se pone rojo al arder.\nTermina en ceniza gris: es el carbón.","opts":["El café","El carbón","El neumático","El chocolate"]}},{"cat":"eni","level":2,"fr":{"q":"Dans un tiroir, il y a 10 chaussettes noires et 10 blanches. Dans le noir, combien dois-tu en prendre au minimum pour être sûr d'avoir une paire de la même couleur ?","a":"3","w":"Le piège : répondre 2, ou 11 en imaginant le pire cas.\nAvec 2 chaussettes, tu peux avoir une noire et une blanche.\nLa 3e est forcément noire ou blanche : elle complète une paire.","opts":["2","11","3","10"]},"es":{"q":"En un cajón hay 10 calcetines negros y 10 blancos. A oscuras, ¿cuántos tienes que sacar como mínimo para tener seguro un par del mismo color?","a":"3","w":"Trampa: responder 2, u 11 pensando en el peor caso.\nCon 2 calcetines puedes tener uno negro y uno blanco.\nEl 3.º es negro o blanco por fuerza: completa un par.","opts":["2","11","3","10"]}},{"cat":"eni","level":2,"fr":{"q":"Si avant-hier était jeudi, quel jour serons-nous après-demain ?","a":"Lundi","w":"Le piège : s'arrêter à aujourd'hui (samedi).\nAvant-hier jeudi, donc hier vendredi et aujourd'hui samedi.\nAprès-demain, c'est donc lundi.","opts":["Samedi","Dimanche","Vendredi","Lundi"]},"es":{"q":"Si anteayer fue jueves, ¿qué día será pasado mañana?","a":"Lunes","w":"Trampa: quedarse en hoy (sábado).\nAnteayer jueves, así que ayer viernes y hoy sábado.\nPasado mañana será lunes.","opts":["Sábado","Domingo","Viernes","Lunes"]}},{"cat":"eni","level":2,"fr":{"q":"Qu'est-ce qui tombe tous les jours sans jamais se faire mal ?","a":"La nuit","w":"Le piège : penser à un objet qui tombe vraiment.\nOn dit que la nuit tombe.\nElle tombe chaque soir et ne se fait jamais mal.","opts":["La nuit","Un vase","Une pomme","Un enfant"]},"es":{"q":"¿Qué cae todos los días sin hacerse nunca daño?","a":"La noche","w":"Trampa: pensar en un objeto que se cae de verdad.\nSe dice que cae la noche.\nCae cada tarde y nunca se hace daño.","opts":["La noche","Un jarrón","Una manzana","Un niño"]}},{"cat":"eni","level":1,"fr":{"q":"J'ai un pouce et quatre doigts, mais je ne suis pas vivant. Qui suis-je ?","a":"Un gant","w":"Le piège : répondre « une main », qui est vivante.\nUn gant a la forme d'une main.\nUn pouce, quatre doigts, mais aucune vie : c'est le gant.","opts":["Une main","Un gant","Un singe","Une fourchette"]},"es":{"q":"Tengo un pulgar y cuatro dedos, pero no estoy vivo. ¿Qué soy?","a":"Un guante","w":"Trampa: responder «una mano», que está viva.\nUn guante tiene forma de mano.\nUn pulgar, cuatro dedos y nada de vida: es el guante.","opts":["Una mano","Un guante","Un mono","Un tenedor"]}},{"cat":"eni","level":1,"fr":{"q":"Je réponds toujours, mais je ne parle jamais en premier. Qui suis-je ?","a":"L'écho","w":"Le piège : penser au perroquet, qui peut parler tout seul.\nL'écho ne fait que répéter ce qu'on vient de dire.\nIl ne parle jamais le premier.","opts":["Un répondeur","Un perroquet","L'écho","Un élève"]},"es":{"q":"Siempre respondo, pero nunca hablo primero. ¿Qué soy?","a":"El eco","w":"Trampa: pensar en el loro, que puede hablar solo.\nEl eco solo repite lo que se acaba de decir.\nNunca habla primero.","opts":["Un contestador","Un loro","El eco","Un alumno"]}},{"cat":"eni","level":3,"fr":{"q":"J'ai deux pièces qui font 30 centimes en tout. L'une des deux n'est pas une pièce de 10 centimes. Quelles sont ces pièces ?","a":"Une de 20 et une de 10","w":"Le piège : croire qu'aucune des deux n'est une pièce de 10.\nL'énoncé dit seulement que l'une n'en est pas une.\nCelle-là est la pièce de 20, et l'autre est bien une pièce de 10.","opts":["Deux pièces de 15","Impossible","Une de 25 et une de 5","Une de 20 et une de 10"]},"es":{"q":"Tengo dos monedas que suman 30 céntimos. Una de ellas no es de 10 céntimos. ¿Qué monedas son?","a":"Una de 20 y una de 10","w":"Trampa: creer que ninguna de las dos es de 10.\nEl enunciado solo dice que una no lo es.\nEsa es la de 20, y la otra sí es de 10.","opts":["Dos de 15","Es imposible","Una de 25 y una de 5","Una de 20 y una de 10"]}},{"cat":"eni","level":3,"fr":{"q":"10 bougies sont allumées. Un courant d'air en éteint 3, et on ne rallume rien. Combien de bougies restera-t-il le lendemain matin ?","a":"3","w":"Le piège : répondre 7, les bougies encore allumées.\nCelles qui restent allumées brûlent jusqu'au bout et disparaissent.\nIl ne reste que les 3 bougies éteintes.","opts":["3","7","10","0"]},"es":{"q":"Hay 10 velas encendidas. Una corriente de aire apaga 3 y no se vuelve a encender ninguna. ¿Cuántas velas quedarán a la mañana siguiente?","a":"3","w":"Trampa: responder 7, las velas que siguen encendidas.\nEsas se consumen hasta el final y desaparecen.\nSolo quedan las 3 velas apagadas.","opts":["3","7","10","0"]}},{"cat":"eni","level":2,"fr":{"q":"J'ai un chapeau mais pas de tête, et un pied mais pas de chaussure. Qui suis-je ?","a":"Un champignon","w":"Le piège : penser à un personnage, comme l'épouvantail.\nLe haut d'un champignon s'appelle le chapeau, et sa tige le pied.\nNi tête ni chaussure : c'est le champignon.","opts":["Un épouvantail","Un champignon","Un clou","Une lampe"]},"es":{"q":"Tengo sombrero pero no cabeza, y pie pero no zapato. ¿Qué soy?","a":"Una seta","w":"Trampa: pensar en un personaje, como el espantapájaros.\nLa parte de arriba de una seta se llama sombrero, y el tallo, pie.\nNi cabeza ni zapato: es la seta.","opts":["Un espantapájaros","Una seta","Un clavo","Una lámpara"]}},{"cat":"eni","level":1,"fr":{"q":"Je te ressemble trait pour trait, mais ta droite est ma gauche. Qui suis-je ?","a":"Ton reflet dans le miroir","w":"Le piège : répondre « ton jumeau » ou « ton ombre ».\nUn jumeau ne t'imite pas, et une ombre n'a pas de traits.\nSeul le miroir te renvoie ton image inversée.","opts":["Ton jumeau","Ta photo","Ton reflet dans le miroir","Ton ombre"]},"es":{"q":"Me parezco a ti en todo, pero tu derecha es mi izquierda. ¿Qué soy?","a":"Tu reflejo en el espejo","w":"Trampa: responder «tu gemelo» o «tu sombra».\nUn gemelo no te imita, y una sombra no tiene rasgos.\nSolo el espejo te devuelve tu imagen invertida.","opts":["Tu gemelo","Tu foto","Tu reflejo en el espejo","Tu sombra"]}},{"cat":"pie","level":1,"fr":{"q":"Un œuf met 4 minutes à cuire. Combien de temps faut-il pour cuire 3 œufs ensemble dans la même casserole ?","a":"4 minutes","w":"Le réflexe : multiplier, 3 × 4 = 12 minutes.\nLes œufs cuisent en même temps dans la même eau.\nIl faut donc toujours 4 minutes.","opts":["12 minutes","4 minutes","8 minutes","6 minutes"]},"es":{"q":"Un huevo tarda 4 minutos en cocerse. ¿Cuánto se tarda en cocer 3 huevos juntos en el mismo cazo?","a":"4 minutos","w":"Reflejo: multiplicar, 3 × 4 = 12 minutos.\nLos huevos se cuecen a la vez en la misma agua.\nAsí que siguen siendo 4 minutos.","opts":["12 minutos","4 minutos","8 minutos","6 minutos"]}},{"cat":"pie","level":2,"fr":{"q":"Si on appelle la queue d'une vache une patte, combien de pattes a une vache ?","a":"4","w":"Le réflexe : répondre 5 en comptant la queue.\nAppeler une queue « patte » ne la transforme pas en patte.\nUne vache a toujours 4 pattes.","opts":["5","3","4","6"]},"es":{"q":"Si a la cola de una vaca la llamamos pata, ¿cuántas patas tiene una vaca?","a":"4","w":"Reflejo: responder 5 contando la cola.\nLlamar «pata» a la cola no la convierte en pata.\nLa vaca sigue teniendo 4 patas.","opts":["5","3","4","6"]}},{"cat":"pie","level":2,"fr":{"q":"Qu'est-ce qui est correct : « le jaune de l'œuf est blanc » ou « le jaune de l'œuf sont blancs » ?","a":"Aucune des deux","w":"Le réflexe : se concentrer sur la grammaire.\nGrammaticalement, on dirait « est ».\nMais le jaune de l'œuf est jaune : aucune des deux phrases n'est vraie.","opts":["« est blanc »","« sont blancs »","Les deux","Aucune des deux"]},"es":{"q":"¿Qué es correcto: «la clara del huevo es amarilla» o «la clara del huevo son amarillas»?","a":"Ninguna de las dos","w":"Reflejo: fijarse solo en la gramática.\nGramaticalmente se diría «es».\nPero la clara del huevo es blanca: ninguna de las dos frases es verdad.","opts":["«es amarilla»","«son amarillas»","Las dos","Ninguna de las dos"]}},{"cat":"pie","level":2,"fr":{"q":"De quelle couleur est la boîte noire d'un avion ?","a":"Orange","w":"Le réflexe : répondre « noire », comme son nom.\nLes boîtes noires sont peintes en orange vif.\nC'est pour les retrouver plus facilement après un accident.","opts":["Orange","Noire","Grise","Rouge"]},"es":{"q":"¿De qué color es la caja negra de un avión?","a":"Naranja","w":"Reflejo: responder «negra», como su nombre.\nLas cajas negras se pintan de naranja vivo.\nAsí se encuentran más fácilmente tras un accidente.","opts":["Naranja","Negra","Gris","Roja"]}},{"cat":"pie","level":2,"fr":{"q":"Pour monter du 1er au 3e étage, il y a 40 marches. Combien de marches pour monter du 1er au 6e étage ?","a":"100","w":"Le réflexe : doubler (3e → 6e) et répo const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function buildDeck(n,countFirst){
 const cats=activeCats();const pools={};
 cats.forEach(c=>{const ids=idsOf(c);pools[c]=[...shuffle(ids.filter(k=>!USEDSET.has(k))).map(k=>[k,0]),...shuffle(ids.filter(k=>USEDSET.has(k))).map(k=>[k,1])]});
 const out=[];let recycled=0,guard=0;const inDeck=new Set(S.deck);
 while(out.length<n&&guard++<500){
  let added=false;
  for(const c of shuffle(cats)){if(out.length>=n)break;const p=pools[c];
   while(p.length){const [k,u]=p.shift();if(inDeck.has(k)&&p.length)continue;out.push(k);inDeck.add(k);if(u&&out.length<=countFirst)recycled++;added=true;break}}
  if(!added)cats.forEach(c=>pools[c]=shuffle(idsOf(c)).map(k=>[k,1]));
 }
 return{deck:out,recycled};
}
function ensureDeck(){if(S.i>=S.deck.length){S.deck=S.deck.concat(buildDeck(10,0).deck)}}

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[«»"'’`.,;:!?¡¿()\-–—€%°]/g," ").replace(/\b(le|la|les|l|un|une|des|de|du|d|el|los|las|una|unos|unas|del|al|en|a|au|aux|sur|con|avec|y|et|il|elle|es|est|son|sa|ses|su|ton|tu|ta)\b/g," ").replace(/\s+/g," ").trim()}
const digits=s=>String(s).replace(/[^0-9]/g,"");
function grade(v,id){
 if(!v||id==null)return false;
 const fr=CARDS[id][1],es=CARDS[id][2];
 if(String(v)[0]==="#")return !!fr[3]&&v==="#"+fr[3].indexOf(fr[1]);
 const nv=norm(v),dv=digits(v);
 return [fr[1],es[1]].some(e=>{const ne=norm(e),de=digits(e);if(de)return dv===de;if(!nv)return false;return nv===ne||(nv.length>=4&&ne.includes(nv))||(ne.length>=4&&nv.includes(ne))});
}
function showAns(v,id){
 if(v==null||v==="")return null;
 if(String(v)[0]==="#"){const o=face(id)[3];const i=+String(v).slice(1);return o&&o[i]!=null?`${"ABCD"[i]} · ${o[i]}`:"?"}
 return String(v);
}

function showMC(id){const m=S.qcm||"some";if(m==="all")return true;if(m==="none")return false;return CARDS[id][0]==="cul"||((id*7+(S.seed||0))%2===0)}
/* ---------- live room ---------- */
let STANDALONE=false;
const MYBY=(()=>{let v=rd("pnb3-by");if(!v){v="b"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);wr("pnb3-by",v)}return v})();
function loadPeerJS(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement("script");s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=()=>res();s.onerror=()=>rej();document.head.appendChild(s)})}
/* Same calls as the platform room (presence, onPeers, leave), carried peer-to-peer: the organiser's phone relays everyone's presence. */
async function peerRoom(code,role){
 try{await loadPeerJS()}catch(e){throw{code:"upstream_error"}}
 const hostId="pnb-game-"+String(code).toLowerCase();
 let peer=null,me=role==="host"?hostId:null,mine={},handlers=[],conns={},others={},hostConn=null,closed=false,retryT=null,last=[];
 const deliver=arr=>{last=arr;const peers=arr.map(x=>({peer:x.peer,by:x.by,isMe:x.peer===me,sameTab:x.peer===me,kind:"viewer",guest:false,presence:x.presence||{},updatedAt:Date.now()}));handlers.forEach(h=>h({peers,joined:[],left:[],updated:[]}))};
 const selfEntry=()=>({peer:me||"me",by:MYBY,presence:mine});
 const hostList=()=>[selfEntry(),...Object.entries(others).map(([p,o])=>({peer:p,by:o.by,presence:o.pr}))];
 const hostBroadcast=()=>{const l=hostList();deliver(l);for(const c of Object.values(conns)){try{if(c.open)c.send({t:"peers",list:l})}catch(e){}}};
 const retry=(fn,ms)=>{clearTimeout(retryT);if(!closed)retryT=setTimeout(fn,ms)};
 function startHost(){
  peer=new Peer(hostId);
  peer.on("open",()=>{netDown(false);hostBroadcast()});
  peer.on("connection",c=>{c.on("data",d=>{if(d&&d.t==="p"&&d.pr&&typeof d.pr==="object"){others[c.peer]={by:String(d.by||c.peer).slice(0,40),pr:d.pr};conns[c.peer]=c;hostBroadcast()}});
   const gone=()=>{delete others[c.peer];delete conns[c.peer];hostBroadcast()};c.on("close",gone);c.on("error",gone)});
  peer.on("error",e=>{if(e.type==="unavailable-id"){try{peer.destroy()}catch(x){}retry(startHost,3000)}else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"||e.type==="socket-closed")netDown(true)});
  peer.on("disconnected",()=>{if(!closed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
 }
 function connectHost(){
  if(closed||!peer||!peer.open)return;
  try{hostConn&&hostConn.close()}catch(e){}
  hostConn=peer.connect(hostId,{reliable:true});
  hostConn.on("open",()=>{netDown(false);hostConn.send({t:"p",by:MYBY,pr:mine})});
  hostConn.on("data",d=>{if(d&&d.t==="peers"&&Array.isArray(d.list))deliver(d.list)});
  hostConn.on("close",()=>{deliver([selfEntry()]);retry(connectHost,3000)});
 }
 function startPlayer(){
  peer=new Peer();
  peer.on("open",id=>{me=id;netDown(false);connectHost()});
  peer.on("error",e=>{if(e.type==="peer-unavailable"){deliver([selfEntry()]);retry(connectHost,3000)}else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"||e.type==="socket-closed")netDown(true)});
  peer.on("disconnected",()=>{if(!closed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
 }
 role==="host"?startHost():startPlayer();
 return{name:hostId,
  presence:async patch=>{for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}mine=JSON.parse(JSON.stringify(mine));
   if(role==="host")hostBroadcast();else{if(hostConn&&hostConn.open){try{hostConn.send({t:"p",by:MYBY,pr:mine})}catch(e){}}deliver((last.length?last:[selfEntry()]).map(x=>x.peer===me?{...x,presence:mine}:x))}},
  onPeers:h=>{handlers.push(h);return()=>{}},
  leave:async()=>{closed=true;clearTimeout(retryT);try{peer&&peer.destroy()}catch(e){}}};
}

async function openRoom(code,role){

 catch(e){joining=false;NR=null;joinErr=e&&e.code==="not_permitted"?L().roomOff:L().roomFail;return false}
 joining=false;
 NR.onPeers(onPeers,()=>{});

 const pr={role,n:String(name).slice(0,16),ans:myAns};

}

function applyHash(){const m=/^#([A-Za-z]{4})$/.exec(location.hash||"");if(m&&!S.online&&!P){S.mode="online";S.otab="join";S.joinCode=m[1].toUpperCase();if(S.phase!=="home"&&!S.inGame)S.phase="home"}}
function inviteLink(code){return location.href.split("#")[0]+"#"+code}
function onPeers(ch){
 PEERS=ch.peers.filter(p=>p.kind==="viewer");
 const me=PEERS.find(p=>p.sameTab);if(me)myKey=keyOf(me);
 if(ROLE()==="host")hostPeers();
 else if(ROLE()==="player"){const h=PEERS.find(p=>p.presence&&p.presence.role==="host"&&p.presence.st);hostSt=h?h.presence.st:null;playerRefresh()}
}
function hostPeers(){
 let changed=false;
 for(const p of PEERS){const pr=p.presence||{};if((pr.role!=="player"&&pr.role!=="host")||!pr.n)continue;
  const k=keyOf(p),n=String(pr.n).slice(0,16);let e=S.players.find(x=>x.k===k);
  if(!e){if(S.players.length>=12)continue;const used=new Set(S.players.map(x=>x.c));let c=0;while(used.has(c))c++;S.players.push({k,n,c,s:0});changed=true}
  else if(e.n!==n){e.n=n;changed=true}}
 if(changed&&(S.phase==="lobby"||S.phase==="summary"||S.phase==="final"))render();
 else{if(changed){save();publishSt()}refreshLive()}
 autoReveal();checkAdvance();
}
function answersNow(key){const m={};for(const p of PEERS){const a=p.presence&&p.presence.ans;if(a&&a.k===key&&a.v!=null&&a.v!=="")m[keyOf(p)]=String(a.v).slice(0,40)}return m}
function eligible(V){const pk=presentKeys();return (V.tied||V.players.map((_,i)=>i)).filter(i=>V.players[i]&&pk.has(V.players[i].k))}
function autoReveal(){

 const el=eligible(S);if(!el.length)return;const ans=answersNow(curKey());
 if(el.every(i=>ans[S.players[i].k]!=null)){const k=curKey();clearTimeout(autoT);autoT=setTimeout(()=>{if(S.phase==="q"&&curKey()===k)doReveal()},900)}
}
function buildSt(){return{mc:S.deck[S.i]!=null?showMC(S.deck[S.i]):false,ph:S.phase==="home"?"wait":S.phase,cid:S.deck[S.i]??null,key:curKey(),round:S.round,rounds:S.rounds,per:S.per,inRound:S.inRound,timer:S.timer,dl:S.deadline,pz:S.pausedLeft,

 return `<section class="panel readyp"><p class="hint2">${l.nextAuto}</p><div id="readylive">${readyLiveHTML()}</div>
 <div class="actions"><button class="btn primary ${on?"on":""}" data-act="ready" id="rdybtn">${on?l.readyOn:l.ready}</button>${ROLE()==="host"?`<button class="btn quiet" data-act="validate">${l.force}</button>`:""}</div></section>`}
function recapEntries(){return ROLE()==="player"?(P&&PLOG.code===P.code?PLOG.items:[]):(S.log||[])}
function recapHTML(){const l=L(),E=recapEntries();if(!E.length)return `<p class="hint2">${l.recapEmpty}</p>`;
 const names={};((V&&V.players)||S.players).forEach(p=>names[p.k]=p);
 return `<div class="recap">${E.map((e,n)=>{const [q,a,w]=face(e.id);const c=catOf(e.id);const cor=new Set(e.cor||[]);
  const hasAns=ONLINE()&&e.ans;
  const lines=hasAns?Object.values(names).map(p=>{const sa=showAns(e.ans[p.k],e.id);const ok=cor.has(p.k);return `<span class="${ok?"okk":"ko"}">${ok?"✓":"✗"} ${esc(p.n)} · ${sa?esc(sa):l.noAnswer}</span>`}).join("")
   :(cor.size?`<span class="okk">✓ ${l.got} : ${[...cor].map(k=>esc(names[k]?names[k].n:"?")).join(", ")}</span>`:`<span class="ko">${l.nobodyGot}</span>`);
  return `<div class="rc" style="--c:var(--${c})"><div class="rch"><i></i>${n+1} · ${l.catS[c]}</div><p class="rq">${esc(q)}</p><p class="ra">${esc(a)}</p><div class="rl">${lines}</div>${w?`<details><summary>${l.showExpl}</summary><div class="expl">${esc(w)}</div></details>`:""}</div>`}).join("")}</div>`}
function startTick(C){
 stopTimer();
 const upd=()=>{const s=document.getElementById("secs"),pr=document.getElementById("pr"),tm=document.getElementById("tm");if(!s){stopTimer();return}
  const left=remaining();s.textContent=left;pr.style.strokeDashoffset=C*(1-left/V.timer);
  if(left<=Math.min(8,Math.ceil(V.timer/4)))tm.classList.add("low");
  if(left<=0){stopTimer();tm.classList.add("up");document.getElementById("tmsg").textContent=L().timeUp;const cd=document.getElementById("card");if(cd&&!cd.classList.contains("shake"))cd.classList.add("shake");
   if(ROLE()==="host"&&!timeUpFired){timeUpFired=true;const k=curKey();setTimeout(()=>{if(S.phase==="q"&&curKey()===k)doReveal()},1500)}}};
 upd();tick=setInterval(upd,250);
}
function refreshLive(){
 if(!V)return;
 const el=document.getElementById("live");if(el)el.innerHTML=liveHTML();
 const lb=document.getElementById("lobbylist");if(lb)lb.innerHTML=lobbyHTML();
 const rl=document.getElementById("readylive");if(rl)rl.innerHTML=readyLiveHTML();
 const sb=document.getElementById("startbtn");if(sb){const ok=presentCount()>=2;sb.disabled=!ok;const np=document.getElementById("needp");if(np)np.hidden=ok}
}

function lastOnes(v=V){const m=Math.min(...v.players.map(p=>p.s));return v.players.map((p,k)=>p.s===m?k:-1).filter(k=>k>=0)}
function boardHTML(mark){
 const mx=Math.max(1,...V.players.map(p=>p.s));
 const r=V.players.map((p,k)=>({...p,k:k,key:p.k})).sort((a,b)=>b.s-a.s);
 return `<div class="board">${r.map((p,i)=>{const last=mark.includes(p.k);return `<div class="row ${last?"last":i===0&&p.s>0?"top1":""}"><span class="rk">${i+1}</span>${av(p)}<div style="min-width:0"><div class="nm">${esc(p.n)}${ONLINE()&&p.key===myKey?` <span class="tg">${L().you}</span>`:""}${last?`<span class="tag">${L().last}</span>`:""}</div><div class="bar"><i style="width:${p.s/mx*100}%"></i></div></div><span class="sc">${p.s}</span></div>`}).join("")}</div>`;
}
function summary(){
 const l=L(),lasts=lastOnes(),end=V.round>=V.rounds,ctrl=CTRL();
 app.innerHTML=gameTop()+`<h2 class="h2"><small>${l.endRound(V.round)}</small>${end?l.finalRank:l.standings}</h2>
 ${boardHTML(lasts)}
 ${ctrl?`<div class="actions">${end?(lasts.length>1?`<button class="btn primary" data-act="tie">${l.tieBtn}</button>`:`<button class="btn primary" data-act="verdict">${l.toVerdict}</button>`)
  :`<button class="btn primary" data-act="nextround">${l.next(V.round+1)}</button>`}</div>`:`<p class="notice">${l.waitNext}</p>`}`;
}
function loser(){if(V.tied&&V.tied.length===1)return V.tied[0];const m=Math.min(...V.players.map(p=>p.s));return V.players.findIndex(p=>p.s===m)}
function final(){
 const l=L(),G=GAGES[S.lang],k=loser(),p=V.players[k]||{n:"?",s:0,c:0},ctrl=CTRL();
 const since=Date.now()-V.drumAt;
 if(!V.revealed||since<2250){
  const d=V.revealed?3-Math.floor(since/750):"?";
  app.innerHTML=gameTop()+`<article class="card verdict"><span class="lbl">${l.isLoser}</span><div class="big ${V.revealed?"pop":""}" id="big" style="color:var(--ink)">${d}</div></article>
  ${!V.revealed?(ctrl?`<div class="actions"><button class="btn primary" data-act="drum">${l.drum}</button></div>`:`<p class="notice">${l.waitNext}</p>`):""}`;
  if(V.revealed){stopTimer();tick=setTimeout(()=>render(),Math.min(760,2260-since))}
  return;
 }
 app.innerHTML=gameTop()+`<article class="card verdict" style="--c:var(--bad)"><span class="lbl">${l.isLoser}</span>
  <div class="big pop">${esc(p.n)}</div><p class="hint" style="margin:0">${l.pts(p.s)}</p>
  <div class="gage"><span class="lbl">${l.gage}</span>${esc(G[V.gage%G.length])}</div></article>
 ${boardHTML([k])}
 ${ctrl?`<div class="actions"><button class="btn ghost" data-act="othergage">${l.otherGage}</button><button class="btn primary" data-act="rematch">${l.rematch}</button><button class="btn ghost" data-act="recap">${l.recap}</button><button class="btn quiet" data-act="gohome">${l.home}</button></div>`:`<div class="actions"><button class="btn ghost" data-act="recap">${l.recap}</button><button class="btn ghost" data-act="leave">${l.leave}</button></div>`}`;
}

/* ---------- menu ---------- */
let menuOpen=false;
function closeMenu(){menuOpen=false;S.board=false;S.recap=false}
function renderMenu(){
 if(!menuOpen){sheet.innerHTML="";return}
 const l=L(),role=ROLE(),inGame=V&&V.players&&V.phase!=="lobby"&&V.phase!=="home";
 sheet.innerHTML=`<div class="sheet" data-act="closemenu"><div class="box" role="dialog" aria-modal="true" aria-label="${l.menu}">
  <div class="hd"><h3>${S.recap?l.recap:S.board?l.standings:l.menu}</h3>${langToggle()}</div>
  ${S.recap?recapHTML():S.board?boardHTML(lastOnes()):`
  <button class="mi" data-act="closemenu2"><span>${l.mResume}</span><small>${l.mResumeS}</small></button>
  ${role!=="player"?`<button class="mi" data-act="back"><span>${l.mBack}</span><small>${l.mBackS}</small></button>`:""}
  ${inGame?`<button class="mi" data-act="board"><span>${l.mBoard}</span></button><button class="mi" data-act="recap"><span>${l.recap}</span><small>${l.recapS}</small></button>`:""}
  ${role!=="player"?`<button class="mi" data-act="gohome2"><span>${l.mHome}</span><small>${l.mHomeS}</small></button>`:""}
  ${role==="player"?`<button class="mi danger" data-act="leave"><span>${l.leave}</span><small>${l.leaveS}</small></button>`
   :role==="host"?`<button class="mi danger" data-act="closeroom"><span>${armed==="closeroom"?l.sure:l.closeRoom}</span></button>`
   :`<button class="mi danger" data-act="quit"><span>${armed==="quit"?l.sure:l.mQuit}</span><small>${l.mQuitS}</small></button>`}`}
  <button class="btn ghost" data-act="closemenu2">${l.close}</button></div></div>`;
}

/* ---------- actions ---------- */
function startGame(){
 H=[];S.players.forEach(p=>p.s=0);S.deck=[];
 const need=S.rounds*S.per;const {deck,recycled}=buildDeck(need+12,need);
 Object.assign(S,{deck,i:0,round:1,inRound:0,correct:[],tied:null,revealed:false,drumAt:0,answers:null,inGame:true,phase:"q",notice:recycled?L().recycled(recycled):""});
 S.gage=Math.random()*GAGES.fr.length|0;S.seed=Math.random()*1000|0;S.log=[];myRdy=null;armTimer();render();
}
function doReveal(){
 push();markUsed(S.deck[S.i]);S.phase="a";S.notice="";
 if(S.online){const ans=answersNow(curKey());S.answers={};S.players.forEach(p=>{if(ans[p.k]!=null)S.answers[p.k]=ans[p.k]});
  const el=S.tied||S.players.map((_,i)=>i);S.correct=el.filter(i=>grade(S.answers[S.players[i].k],S.deck[S.i]))}
 else{S.correct=[];S.answers=null}
 render();
}
async function createRoom(){
 const l=L();const n=(S.myName||"").trim();
 if(!n){joinErr=l.nameErr;render();return}
 const A="ABCDEFGHJKLMNPQRSTUVWXYZ";const code=Array.from({length:4},()=>A[Math.random()*A.length|0]).join("");
 if(!S.localPlayers)S.localPlayers={players:S.players,example:S.example};
 Object.assign(S,{online:{code},players:[],example:false,inGame:false,phase:"lobby",tied:null,correct:[],answers:null});H=[];
 const ok=await openRoom(code,"host");
 if(!ok){S.online=null;S.phase="home";restoreLocal()}
 render();
}
function restoreLocal(){if(S.localPlayers){S.players=S.localPlayers.players;S.example=S.localPlayers.example;S.localPlayers=null}}
async function joinRoom(){
 const l=L();const n=(S.myName||"").trim(),c=(S.joinCode||"").trim().toUpperCase();
 if(!n){joinErr=l.nameErr;render();return}
 if(!/^[A-Z]{4}$/.test(c)){joinErr=l.codeErr;render();return}
 P={code:c,name:n};myAns=null;lastPKey="";
 const ok=await openRoom(c,"player");
 if(!ok){P=null}
 render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
 const act=b.dataset.act,v=b.dataset.v;
 if(act==="closemenu"&&e.target!==b)return;
 const ctl=CTRL();
 switch(act){
  case"lang":S.lang=v;lastPKey="";render();break;
  case"mode":S.mode=v;joinErr="";render();break;
  case"otab":S.otab=v;joinErr="";render();break;
  case"create":createRoom();break;
  case"join":joinRoom();break;
  case"leave":leaveRoom().then(()=>{P=null;closeMenu();render()});break;
  case"backroom":S.phase=S.inGame?(S.resumePhase==="home"?"q":S.resumePhase):"lobby";if(S.phase==="q")armTimer();render();break;
  case"closeroom":if(armed==="closeroom"){armed=null;closeMenu();leaveRoom().then(()=>{S.online=null;S.inGame=false;S.phase="home";H=[];restoreLocal();render()})}else{arm("closeroom");render()}break;
  case"startonline":if(presentCount()>=2){const pk=presentKeys();startGame()}break;
  case"pick":if(V&&V.phase==="q")sendAns("#"+v);break;
  case"del":S.players.splice(+v,1);S.example=false;render();break;
  case"cat":S.cats[v]=!S.cats[v];render();break;
  case"mix":CATS.forEach(c=>S.cats[c]=true);render();break;
  case"preset":{const p=PRESETS.find(x=>x[0]===v);S.rounds=p[1];S.per=p[2];render();break}
  case"step":{const [k,d]=v.split(":");const lim=k==="rounds"?[1,8]:[3,15];S[k]=Math.min(lim[1],Math.max(lim[0],S[k]+ +d));render();break}
  case"diff":S.diff=v;render();break;
  case"timer":S.timer=+v;render();break;
  case"start":startGame();break;
  case"resume":S.phase=S.resumePhase||"q";if(S.phase==="q")armTimer();render();break;
  case"abandon":if(armed==="abandon"){armed=null;S.inGame=false;H=[];S.players.forEach(p=>p.s=0);render()}else{arm("abandon");render()}break;
  case"reset":if(armed==="reset"){armed=null;USED=[];USEDSET=new Set();flash=L().resetDone;render();setTimeout(()=>{flash=""},4000)}else{arm("reset");render()}break;
  case"back":if(ctl)undo();break;
  case"menu":menuOpen=true;renderMenu();break;
  case"closemenu":case"closemenu2":closeMenu();renderMenu();break;
  case"board":S.board=true;renderMenu();break;
  case"recap":menuOpen=true;S.recap=true;renderMenu();break;
  case"qcm":S.qcm=v;render();break;
  case"copylink":{const inp=document.getElementById("invlink");const ok=()=>{b.textContent=L().copied};
   try{navigator.clipboard.writeText(inp.value).then(ok,()=>{inp.select();ok()})}catch(err){inp.select();ok()}break}
  case"ready":{const key=keyNow();myRdy=myRdy===key?null:key;if(NR)NR.presence({rdy:myRdy}).catch(()=>{});const b2=document.getElementById("rdybtn");if(b2){b2.textContent=myRdy?L().readyOn:L().ready;b2.classList.toggle("on",!!myRdy)}refreshLive();checkAdvance();break}
  case"gohome2":goHome();break;
  case"quit":if(armed==="quit"){armed=null;closeMenu();S.inGame=false;H=[];S.players.forEach(p=>p.s=0);S.phase="home";render()}else{arm("quit");renderMenu()}break;
  case"pause":{if(!ctl||S.phase!=="q")break;if(S.pausedLeft==null)S.pausedLeft=remaining();else{S.deadline=Date.now()+S.pausedLeft*1000;S.pausedLeft=null}save();publishSt();const m=document.getElementById("tmsg");if(m)m.textContent=S.pausedLeft!=null?L().paused:(S.online?L().auto:L().tapPause);break}
  case"reveal":if(ctl)doReveal();break;
  case"skip":if(ctl){push();markUsed(S.deck[S.i]);S.i++;ensureDeck();S.notice="";armTimer();render()}break;
  case"chip":{if(!ctl)break;const k=+v,i=S.correct.indexOf(k);i<0?S.correct.push(k):S.correct.splice(i,1);b.setAttribute("aria-pressed",i<0);{const vb=document.getElementById("vbtn");if(vb)vb.textContent=L().validate(S.correct.length)}save();publishSt();break}
  case"none":if(ctl){S.correct=[];render()}break;
  case"all":if(ctl){S.correct=(S.tied||S.players.map((_,k)=>k)).slice();render()}break;
  case"validate":if(ctl)score();break;
  case"nextround":if(ctl){push();S.round++;S.inRound=0;S.phase="q";armTimer();render()}break;
  case"tie":if(ctl){push();S.tied=lastOnes(S);S.phase="q";armTimer();render()}break;
  case"verdict":if(ctl){push();S.phase="final";S.revealed=false;render()}break;
  case"drum":if(ctl){push();S.revealed=true;S.drumAt=Date.now();render()}break;
  case"othergage":if(ctl){S.gage++;render()}break;
  case"rematch":if(ctl)startGame();break;
  case"gohome":S.inGame=false;H=[];S.phase=S.online?"lobby":"home";render();break;
 }
});
function score(){
 push();S.correct.forEach(k=>S.players[k].s++);
 {const lid=S.deck[S.i];S.log=(S.log||[]).concat([{id:lid,ans:S.answers,cor:S.correct.map(i=>S.players[i]&&S.players[i].k).filter(Boolean)}])}
 S.i++;ensureDeck();S.answers=null;
 if(S.tied){const rem=S.tied.filter(k=>!S.correct.includes(k));if(rem.length>=1&&rem.length<S.tied.length)S.tied=rem;S.correct=[];
  if(S.tied.length===1){S.phase="final";S.revealed=false}else{S.phase="q";armTimer()}return render()}
 S.correct=[];S.inRound++;if(S.inRound>=S.per)S.phase="summary";else{S.phase="q";armTimer()}render();
}

if(S.phase==="q"&&!S.deadline)armTimer();
render();
initCaps();

</script>
