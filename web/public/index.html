<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OndeTV</title>
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OndeTV">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <div id="player" class="player hidden" aria-hidden="true">
    <video id="video" playsinline webkit-playsinline autoplay autopictureinpicture x-webkit-airplay="allow"></video>
    <div id="tap-layer" class="tap-layer"></div>

    <div id="center-controls" class="center-controls">
      <button data-center="chprev" class="ch live-only" aria-label="Chaîne précédente"><span>⏮</span><small>Chaîne</small></button>
      <button data-center="back" aria-label="Reculer"><span>⏪</span><small id="center-back-label">30 s</small></button>
      <button data-center="play" class="big" id="center-play" aria-label="Lecture / pause"><span>⏸</span></button>
      <button data-center="forward" aria-label="Avancer"><span>⏩</span><small id="center-fwd-label">30 s</small></button>
      <button data-center="chnext" class="ch live-only" aria-label="Chaîne suivante"><span>⏭</span><small>Chaîne</small></button>
    </div>

    <div class="player-top">
      <button id="player-close" class="icon-btn" aria-label="Fermer">✕</button>
      <div id="player-logo" class="player-logo"></div>
      <div class="player-title">
        <strong id="player-title"></strong>
        <span id="player-subtitle"></span>
      </div>
      <button id="btn-pip" class="icon-btn" aria-label="Image dans l'image">⧉</button>
      <button id="btn-airplay" class="icon-btn hidden" aria-label="AirPlay">⎚</button>
      <button id="player-fav" class="icon-btn hidden" aria-label="Favori">☆</button>
    </div>

    <div id="live-ui" class="live-ui hidden">
      <div id="shift-bar" class="shift-bar hidden">
        <span id="shift-time" class="shift-time"></span>
        <input id="shift-range" type="range" min="0" max="1000" value="1000" aria-label="Position dans le programme">
        <span id="shift-delay" class="shift-delay"></span>
      </div>
      <div id="live-banner" class="live-banner">
        <div class="banner-num" id="banner-num"></div>
        <div class="banner-body">
          <div class="banner-now"><span class="live-badge">DIRECT</span> <span id="epg-now">—</span></div>
          <div class="banner-times"><span id="epg-start"></span><div class="bar"><i id="epg-progress"></i></div><span id="epg-end"></span></div>
          <div id="epg-next" class="muted"></div>
        </div>
      </div>
      <div class="live-controls">
        <button data-act="list"><span>☰</span>Chaînes</button>
        <button data-act="restart"><span>⏮</span>Début</button>
        <button data-act="golive" id="btn-golive" class="hidden live-btn"><span>●</span>Direct</button>
        <button data-act="guide"><span>⟲</span>Replay</button>
        <button data-act="recents"><span>🕘</span>Récents</button>
        <button data-act="previous"><span>⇆</span>Précédente</button>
        <button data-act="number"><span>#</span>N°</button>
        <button data-act="fullscreen" id="btn-fs" class="btn-fs"><span>⛶</span>Plein écran</button>
        <button data-act="aspect" id="btn-aspect" class="btn-aspect"><span>⤢</span>Ajusté</button>
        <button data-act="vlc"><span>🔶</span>VLC</button>
        <button data-act="more"><span>⋯</span>Options</button>
      </div>
    </div>

    <div id="vod-ui" class="live-ui vod-ui hidden">
      <div class="vod-seek">
        <span id="vod-time">0:00</span>
        <input id="vod-range" type="range" min="0" max="1000" value="0" aria-label="Position">
        <span id="vod-duration">0:00</span>
      </div>
      <div class="live-controls">
        <button data-vod="tracks"><span>💬</span>Pistes</button>
        <button data-vod="speed" id="vod-speed"><span>⏱</span>×1</button>
        <button data-vod="fullscreen" class="btn-fs"><span>⛶</span>Plein écran</button>
        <button data-vod="aspect" class="btn-aspect"><span>⤢</span>Ajusté</button>
        <button data-vod="vlc"><span>🔶</span>VLC</button>
        <button data-vod="more"><span>⋯</span>Options</button>
      </div>
    </div>

    <aside id="channel-panel" class="side-panel left hidden" aria-label="Liste des chaînes">
      <div class="panel-head">
        <strong id="channel-panel-title">Chaînes</strong>
        <button class="icon-btn" data-panel-close aria-label="Fermer">✕</button>
      </div>
      <input id="panel-search" type="search" placeholder="Rechercher une chaîne" autocomplete="off">
      <div id="panel-sources" class="chips panel-sources hidden"></div>
      <div id="panel-list" class="panel-list"></div>
    </aside>

    <aside id="guide-panel" class="side-panel right hidden" aria-label="Guide de la chaîne">
      <div class="panel-head">
        <strong id="guide-title">Guide</strong>
        <button class="icon-btn" data-panel-close aria-label="Fermer">✕</button>
      </div>
      <div id="guide-list" class="panel-list"></div>
    </aside>

    <div id="numpad" class="numpad hidden">
      <div id="numpad-display" class="numpad-display">—</div>
      <div id="numpad-hint" class="numpad-hint"></div>
      <div class="numpad-keys">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button data-key="del">⌫</button><button>0</button><button data-key="ok">OK</button>
      </div>
    </div>

    <div id="menu" class="menu hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="player-status" class="player-status hidden"></div>
  </div>

  <div id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <button class="icon-btn sheet-close" data-close aria-label="Fermer">✕</button>
      <div id="sheet-content"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
