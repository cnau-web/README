plugins {
    id "com.android.application"
}

android {
    namespace "fr.ondetv.tv"
    compileSdk 35

    defaultConfig {
        applicationId "fr.ondetv.tv"
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName = "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Clé de signature fixe : chaque nouvelle version s'installe par-dessus la précédente.
    // App personnelle installée à la main (pas de Play Store).
    signingConfigs {
        release {
            storeFile file("../ondetv-release.jks")
            storePassword "ondetv-tv"
            keyAlias "ondetv"
            keyPassword "ondetv-tv"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = "1.5.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.core:core:1.13.1"
}
